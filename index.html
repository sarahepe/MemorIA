                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL EDITAR PERFIL */}
                    {showProfileModal && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-purple-100 space-y-4">
                                <div className="flex justify-between items-center border-b pb-3">
                                    <h3 className="text-lg font-bold text-slate-800">Editar Mi Perfil</h3>
                                    <button onClick={() => setShowProfileModal(false)}><Icon name="x" className="w-5 h-5 text-slate-400" /></button>
                                </div>

                                <form onSubmit={(e) => {
                                    e.preventDefault();
                                    const updated = { ...user, name: profileForm.name, degree: profileForm.degree, university: profileForm.university };
                                    setUser(updated);
                                    setRegisteredUsers(prev => prev.map(u => u.email === user.email ? updated : u));
                                    setShowProfileModal(false);
                                }} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-600 uppercase mb-1">Nombre Completo</label>
                                        <input type="text" required value={profileForm.name} onChange={(e) => setProfileForm({ ...profileForm, name: e.target.value })} className="w-full px-4 py-2.5 rounded-xl border border-purple-100 text-sm" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-600 uppercase mb-1">Carrera / Grado</label>
                                        <input type="text" required value={profileForm.degree} onChange={(e) => setProfileForm({ ...profileForm, degree: e.target.value })} className="w-full px-4 py-2.5 rounded-xl border border-purple-100 text-sm" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-600 uppercase mb-1">Universidad</label>
                                        <UniversitySelect name="university" value={profileForm.university} onChange={(e) => setProfileForm({ ...profileForm, university: e.target.value })} />
                                    </div>
                                    <button type="submit" className="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white font-extrabold rounded-2xl shadow text-xs">
                                        Guardar Cambios
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL CREAR ASIGNATURA */}
                    {showModal && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-purple-100 space-y-4">
                                <div className="flex justify-between items-center border-b pb-3">
                                    <h3 className="text-lg font-bold text-slate-800">Nueva Asignatura</h3>
                                    <button onClick={() => setShowModal(false)}><Icon name="x" className="w-5 h-5 text-slate-400" /></button>
                                </div>

                                <form onSubmit={handleAddSubject} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-600 uppercase mb-1">Nombre de la Asignatura</label>
                                        <input type="text" required value={subjectNameInput} onChange={(e) => setSubjectNameInput(e.target.value)} placeholder="Ej. Anatomía, Estadística..." className="w-full px-4 py-2.5 rounded-xl border text-sm" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-600 uppercase mb-1">Fecha de Examen</label>
                                        <input type="date" value={subjectExamDateInput} onChange={(e) => setSubjectExamDateInput(e.target.value)} className="w-full px-4 py-2.5 rounded-xl border text-sm bg-white" />
                                    </div>
                                    <button type="submit" className="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white font-extrabold rounded-2xl shadow text-xs">
                                        Guardar Asignatura
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    <footer className="bg-white border-t border-purple-100 py-6 mt-12">
                        <div className="max-w-7xl mx-auto px-4 text-center text-xs text-slate-400">
                            MemorAI © 2026 — Tu Aula Inteligente con Repetición Espaciada e IA.
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
