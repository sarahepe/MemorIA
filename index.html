                                                        </h3>
                                                        <span className="text-[10px] uppercase font-bold bg-slate-100 px-2 py-1 rounded text-slate-500">
                                                            {q.type === 'test' ? 'Tipo Test' : q.type === 'short' ? 'Pregunta Corta' : 'Desarrollo'}
                                                        </span>
                                                    </div>

                                                    {q.type === 'test' && (
                                                        <div className="space-y-2">
                                                            {q.options.map((opt, oIdx) => {
                                                                const isSelected = userAnswers[q.id] === oIdx;
                                                                let btnStyle = "border-slate-200 hover:border-brand-300 bg-slate-50/50";

                                                                if (testSubmitted) {
                                                                    if (oIdx === q.correct) {
                                                                        btnStyle = "border-emerald-500 bg-emerald-50 text-emerald-800 font-semibold";
                                                                    } else if (isSelected && oIdx !== q.correct) {
                                                                        btnStyle = "border-red-500 bg-red-50 text-red-800";
                                                                    }
                                                                } else if (isSelected) {
                                                                    btnStyle = "border-brand-600 bg-brand-50 text-brand-900 font-semibold";
                                                                }

                                                                return (
                                                                    <button
                                                                        key={oIdx}
                                                                        onClick={() => handleSelectOption(q.id, oIdx)}
                                                                        className={`w-full text-left p-3.5 rounded-xl border text-sm transition flex items-center justify-between ${btnStyle}`}>
                                                                        <span>{opt}</span>
                                                                        {testSubmitted && oIdx === q.correct && <Icon name="check-circle" className="w-5 h-5 text-emerald-600" />}
                                                                        {testSubmitted && isSelected && oIdx !== q.correct && <Icon name="x-circle" className="w-5 h-5 text-red-500" />}
                                                                    </button>
                                                                );
                                                            })}
                                                        </div>
                                                    )}

                                                    {(q.type === 'short' || q.type === 'long') && (
                                                        <div>
                                                            <textarea 
                                                                rows={q.type === 'short' ? 2 : 4}
                                                                disabled={testSubmitted}
                                                                value={userAnswers[q.id] || ''}
                                                                onChange={(e) => handleSelectOption(q.id, e.target.value)}
                                                                placeholder="Escribe tu respuesta aquí..."
                                                                className="w-full p-3 rounded-xl border border-slate-200 text-sm outline-none focus:ring-2 focus:ring-brand-500">
                                                            </textarea>
                                                        </div>
                                                    )}

                                                    {testSubmitted && (
                                                        <div className="mt-3 p-4 bg-purple-50/70 rounded-xl border border-purple-100 text-xs text-purple-900 space-y-2">
                                                            {q.type !== 'test' && (
                                                                <div>
                                                                    <span className="font-bold text-slate-800">Respuesta Modelo Sugerida: </span>
                                                                    <p className="mt-1 text-slate-600">{q.idealAnswer}</p>
                                                                </div>
                                                            )}
                                                            <div className="flex items-center space-x-2 text-brand-700 font-bold border-t border-purple-200/60 pt-2">
                                                                <Icon name="file-text" className="w-4 h-4" />
                                                                <span>Ubicación en el Temario: {q.sourceFile} — Página {q.sourcePage}</span>
                                                            </div>
                                                        </div>
                                                    )}
                                                </div>
                                            ))}
                                        </div>

                                        {!testSubmitted ? (
                                            <button 
                                                onClick={handleFinishTest}
                                                className="w-full py-3.5 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-xl shadow-lg shadow-brand-500/20 text-sm transition">
                                                Finalizar Examen y Corregir
                                            </button>
                                        ) : (
                                            <div className="bg-slate-900 text-white p-6 rounded-2xl shadow-xl text-center space-y-4">
                                                <h3 className="text-lg font-bold text-slate-200">¡Examen Corregido!</h3>
                                                <div className="text-4xl font-black text-brand-400">
                                                    Nota Tipo Test: {calculateScore()} / 10
                                                </div>

                                                {isPublic && (
                                                    <p className="text-xs text-emerald-400 font-semibold">
                                                        ✓ Examen publicado correctamente en el Banco Comunitario.
                                                    </p>
                                                )}

                                                <button 
                                                    onClick={() => setActiveTab('dashboard')}
                                                    className="px-6 py-2.5 bg-brand-500 hover:bg-brand-600 text-white rounded-xl text-sm font-semibold transition">
                                                    Volver a mis Asignaturas
                                                </button>
                                            </div>
                                        )}
                                    </>
                                )}
                            </div>
                        )}

                        {/* 4. BANCO COMUNITARIO */}
                        {user && activeTab === 'community' && (
                            <div className="space-y-6">
                                <div>
                                    <h2 className="text-2xl font-extrabold text-slate-900">Banco Comunitario de Exámenes</h2>
                                    <p className="text-slate-500 text-sm">Explora exámenes compartidos públicamente por la comunidad de estudiantes.</p>
                                </div>

                                {publicExams.length === 0 ? (
                                    <div className="bg-white p-12 rounded-2xl border border-dashed border-slate-200 text-center text-slate-400 space-y-3">
                                        <Icon name="book-open" className="w-12 h-12 mx-auto text-slate-300" />
                                        <h3 className="text-lg font-bold text-slate-700">Aún no hay exámenes en la comunidad</h3>
                                        <p className="text-xs text-slate-400 max-w-md mx-auto">
                                            Sé el primero en publicar un examen cambiando el interruptor de "Privado" a "Público" al finalizar una prueba.
                                        </p>
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        {publicExams.map((exam) => (
                                            <div key={exam.id} className="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm flex flex-col justify-between hover:border-brand-300 transition">
                                                <div>
                                                    <span className="text-xs font-semibold px-2.5 py-1 bg-brand-50 text-brand-700 rounded-md">
                                                        {exam.subject}
                                                    </span>
                                                    <h3 className="font-bold text-slate-800 text-base mt-2">{exam.title}</h3>
                                                    <p className="text-xs text-slate-500 mb-4">{exam.university} • Creado por {exam.author}</p>
                                                </div>

                                                <button 
                                                    onClick={() => handlePracticeExam(exam)}
                                                    className="px-4 py-2 bg-brand-50 hover:bg-brand-600 hover:text-white text-brand-700 text-xs font-bold rounded-xl transition flex items-center justify-between">
                                                    <span>Practicar ahora</span>
                                                    <Icon name="arrow-right" className="w-3.5 h-3.5" />
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {/* MODAL: EDITAR PERFIL DE USUARIO */}
                    {showProfileModal && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100 space-y-4">
                                <div className="flex justify-between items-center border-b pb-3">
                                    <h3 className="text-lg font-bold text-slate-800 flex items-center space-x-2">
                                        <Icon name="user" className="w-5 h-5 text-brand-600" />
                                        <span>Editar Mi Perfil</span>
                                    </h3>
                                    <button onClick={() => setShowProfileModal(false)} className="text-slate-400 hover:text-slate-600">
                                        <Icon name="x" className="w-5 h-5" />
                                    </button>
                                </div>

                                <form onSubmit={handleSaveProfile} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Nombre Completo</label>
                                        <input 
                                            type="text" 
                                            required
                                            value={profileForm.name}
                                            onChange={(e) => setProfileForm({ ...profileForm, name: e.target.value })}
                                            className="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-brand-500 text-sm outline-none"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Carrera / Grado</label>
                                        <input 
                                            type="text" 
                                            required
                                            value={profileForm.degree}
                                            onChange={(e) => setProfileForm({ ...profileForm, degree: e.target.value })}
                                            className="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-brand-500 text-sm outline-none"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Universidad</label>
                                        <UniversitySelect 
                                            name="university"
                                            value={profileForm.university}
                                            onChange={(e) => setProfileForm({ ...profileForm, university: e.target.value })}
                                        />
                                    </div>

                                    {(profileForm.university === 'Otra universidad (España)' || profileForm.university === 'Universidad Extranjera / Internacional') && (
                                        <div>
                                            <label className="block text-xs font-semibold text-brand-700 uppercase mb-1">Escribe tu Universidad</label>
                                            <input 
                                                type="text" 
                                                required
                                                value={profileForm.customUniversity}
                                                onChange={(e) => setProfileForm({ ...profileForm, customUniversity: e.target.value })}
                                                placeholder="Ej. Harvard, UBA, etc."
                                                className="w-full px-4 py-2.5 rounded-xl border border-brand-300 bg-brand-50/40 focus:ring-2 focus:ring-brand-500 text-sm outline-none"
                                            />
                                        </div>
                                    )}

                                    <div className="flex space-x-3 justify-end pt-2">
                                        <button 
                                            type="button" 
                                            onClick={() => setShowProfileModal(false)}
                                            className="px-4 py-2 text-sm font-semibold text-slate-600 hover:bg-slate-100 rounded-xl transition">
                                            Cancelar
                                        </button>
                                        <button 
                                            type="submit" 
                                            className="px-4 py-2 text-sm font-semibold bg-brand-600 hover:bg-brand-700 text-white rounded-xl shadow-md transition">
                                            Guardar Cambios
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL: AÑADIR ASIGNATURA */}
                    {showModal && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100 space-y-4">
                                <div className="flex justify-between items-center">
                                    <h3 className="text-lg font-bold text-slate-800">Nueva Asignatura</h3>
                                    <button onClick={() => setShowModal(false)} className="text-slate-400 hover:text-slate-600">
                                        <Icon name="x" className="w-5 h-5" />
                                    </button>
                                </div>

                                <form onSubmit={handleAddSubject} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Nombre de la Materia</label>
                                        <input 
                                            type="text" 
                                            required
                                            value={subjectNameInput}
                                            onChange={(e) => setSubjectNameInput(e.target.value)}
                                            placeholder="Ej. Farmacología, Derecho Mercantil..." 
                                            className="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-brand-500 text-sm outline-none"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Fecha del Examen</label>
                                        <input 
                                            type="date" 
                                            value={subjectExamDateInput}
                                            onChange={(e) => setSubjectExamDateInput(e.target.value)}
                                            className="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-brand-500 text-sm outline-none bg-white"
                                        />
                                    </div>

                                    <div className="flex space-x-3 justify-end pt-2">
                                        <button 
                                            type="button" 
                                            onClick={() => setShowModal(false)}
                                            className="px-4 py-2 text-sm font-semibold text-slate-600 hover:bg-slate-100 rounded-xl transition">
                                            Cancelar
                                        </button>
                                        <button 
                                            type="submit" 
                                            className="px-4 py-2 text-sm font-semibold bg-brand-600 hover:bg-brand-700 text-white rounded-xl shadow-md transition">
                                            Guardar Asignatura
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* MODAL: CONFIGURAR EXAMEN IA */}
                    {showExamConfigModal && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100 space-y-4">
                                <div className="flex justify-between items-center">
                                    <h3 className="text-lg font-bold text-slate-800">Configurador de Examen IA</h3>
                                    <button onClick={() => setShowExamConfigModal(false)} className="text-slate-400 hover:text-slate-600">
                                        <Icon name="x" className="w-5 h-5" />
                                    </button>
                                </div>

                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Formato de Preguntas</label>
                                        <select 
                                            value={examConfig.format}
                                            onChange={(e) => setExamConfig({ ...examConfig, format: e.target.value })}
                                            className="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-brand-500 text-sm outline-none bg-white">
                                            <option value="test">Tipo Test (Opción múltiple)</option>
                                            <option value="short">Preguntas Cortas</option>
                                            <option value="long">Preguntas Largas / Desarrollo</option>
                                            <option value="mixed">Examen Mixto (Combinado)</option>
                                        </select>
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Número de Preguntas</label>
                                        <select 
                                            value={examConfig.questionCount}
                                            onChange={(e) => setExamConfig({ ...examConfig, questionCount: e.target.value })}
                                            className="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-brand-500 text-sm outline-none bg-white">
                                            <option value="10">10 Preguntas (Rápido)</option>
                                            <option value="15">15 Preguntas (Estándar)</option>
                                            <option value="25">25 Preguntas (Extenso)</option>
                                            <option value="30">30 Preguntas (Examen Completo)</option>
                                        </select>
                                    </div>

                                    <div className="flex space-x-3 justify-end pt-2">
                                        <button 
                                            type="button" 
                                            onClick={() => setShowExamConfigModal(false)}
                                            className="px-4 py-2 text-sm font-semibold text-slate-600 hover:bg-slate-100 rounded-xl transition">
                                            Cancelar
                                        </button>
                                        <button 
                                            onClick={handleGenerateExamFromConfig}
                                            className="px-4 py-2 text-sm font-semibold bg-brand-600 hover:bg-brand-700 text-white rounded-xl shadow-md transition">
                                            Generar Examen
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL: VER RESUMEN GENERADO POR IA */}
                    {showSummaryModal && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-2xl w-full p-6 shadow-2xl border border-slate-100 space-y-4 max-h-[85vh] flex flex-col">
                                <div className="flex justify-between items-center border-b pb-3">
                                    <h3 className="text-lg font-bold text-slate-800 flex items-center space-x-2">
                                        <Icon name="sparkles" className="w-5 h-5 text-brand-600" />
                                        <span>Resumen Generado por IA</span>
                                    </h3>
                                    <button onClick={() => setShowSummaryModal(false)} className="text-slate-400 hover:text-slate-600">
                                        <Icon name="x" className="w-5 h-5" />
                                    </button>
                                </div>

                                <div className="flex-1 overflow-y-auto p-4 bg-slate-50 rounded-xl font-mono text-xs whitespace-pre-wrap text-slate-800 border border-slate-200">
                                    {generatedSummary}
                                </div>

                                <div className="flex justify-end pt-2">
                                    <button 
                                        onClick={() => setShowSummaryModal(false)}
                                        className="px-5 py-2 text-sm font-semibold bg-brand-600 text-white rounded-xl shadow hover:bg-brand-700 transition">
                                        Entendido
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* FOOTER */}
                    <footer className="bg-white border-t border-slate-100 py-6 mt-12">
                        <div className="max-w-7xl mx-auto px-4 text-center text-xs text-slate-400">
                            MemorAI © 2026 — Tu Aula Inteligente con Repetición Espaciada e IA.
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
