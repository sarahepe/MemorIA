<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MemorAI - Tu Aula Inteligente</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            violet: {
              25: "#faf8ff"
            }
          },
          boxShadow: {
            soft: "0 20px 60px rgba(91, 33, 182, 0.10)",
            glow: "0 0 35px rgba(124, 58, 237, 0.20)"
          }
        }
      }
    };
  </script>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background: #faf9ff;
      color: #1f1635;
    }

    ::selection {
      background: #ddd6fe;
      color: #4c1d95;
    }

    .gradient-text {
      background: linear-gradient(90deg, #6d28d9, #a855f7, #7c3aed);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .glass {
      background: rgba(255, 255, 255, 0.78);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
    }

    .grid-bg {
      background-image:
        linear-gradient(rgba(124, 58, 237, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(124, 58, 237, 0.035) 1px, transparent 1px);
      background-size: 28px 28px;
    }

    .drop-zone {
      transition: all 0.2s ease;
    }

    .drop-zone.dragging {
      border-color: #7c3aed;
      background: #f5f3ff;
      transform: scale(1.01);
      box-shadow: 0 15px 40px rgba(124, 58, 237, 0.12);
    }

    .progress-ring {
      transform: rotate(-90deg);
    }

    .fade-in {
      animation: fadeIn 0.35s ease both;
    }

    .slide-up {
      animation: slideUp 0.4s ease both;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .scrollbar::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }

    .scrollbar::-webkit-scrollbar-thumb {
      background: #ddd6fe;
      border-radius: 99px;
    }

    .scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useRef } = React;

    const Icon = ({ name, size = 20, strokeWidth = 1.8, className = "" }) => {
      const paths = {
        brain: (
          <>
            <path d="M9.5 3.5A3.5 3.5 0 0 0 6 7v.3A3.5 3.5 0 0 0 4 10.5 3.5 3.5 0 0 0 7.5 14H8v2.5A2.5 2.5 0 0 0 10.5 19h1" />
            <path d="M14.5 3.5A3.5 3.5 0 0 1 18 7v.3a3.5 3.5 0 0 1 2 3.2 3.5 3.5 0 0 1-3.5 3.5H16v2.5a2.5 2.5 0 0 1-2.5 2.5h-1" />
            <path d="M12 4v16M8 8.5h2M14 8.5h2M8 12h2M14 12h2" />
          </>
        ),
        home: (
          <>
            <path d="m3 10 9-7 9 7" />
            <path d="M5 9v10h14V9M9 19v-6h6v6" />
          </>
        ),
        chart: (
          <>
            <path d="M4 19V5M4 19h17" />
            <path d="m7 15 4-4 3 2 5-7" />
          </>
        ),
        book: (
          <>
            <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21z" />
            <path d="M4 5.5v15A2.5 2.5 0 0 1 6.5 18H20M8 7h8M8 11h8" />
          </>
        ),
        users: (
          <>
            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
            <circle cx="9" cy="7" r="4" />
            <path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" />
          </>
        ),
        plus: (
          <>
            <path d="M12 5v14M5 12h14" />
          </>
        ),
        upload: (
          <>
            <path d="M12 16V4" />
            <path d="m7 9 5-5 5 5" />
            <path d="M5 20h14" />
          </>
        ),
        file: (
          <>
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
            <path d="M14 2v6h6M8 13h8M8 17h6" />
          </>
        ),
        check: (
          <>
            <path d="m5 12 4 4L19 6" />
          </>
        ),
        x: (
          <>
            <path d="m6 6 12 12M18 6 6 18" />
          </>
        ),
        search: (
          <>
            <circle cx="11" cy="11" r="7" />
            <path d="m20 20-4-4" />
          </>
        ),
        calendar: (
          <>
            <rect x="3" y="4" width="18" height="17" rx="2" />
            <path d="M16 2v4M8 2v4M3 10h18" />
          </>
        ),
        flame: (
          <>
            <path d="M12 22c4.5 0 7-3.1 7-7.2 0-3.7-2.1-6.3-5.2-8.8.1 2.4-1.1 4.1-2.3 4.8.3-3.7-1.4-6.9-4.2-8.8.2 4-3.3 6.7-3.3 11.1C4 18.1 7.4 22 12 22Z" />
          </>
        ),
        clock: (
          <>
            <circle cx="12" cy="12" r="9" />
            <path d="M12 7v5l3 2" />
          </>
        ),
        sparkles: (
          <>
            <path d="m12 3 1.3 4.7L18 9l-4.7 1.3L12 15l-1.3-4.7L6 9l4.7-1.3z" />
            <path d="m19 15 .7 2.3L22 18l-2.3.7L19 21l-.7-2.3L16 18l2.3-.7z" />
            <path d="m5 15 .5 1.5L7 17l-1.5.5L5 19l-.5-1.5L3 17l1.5-.5z" />
          </>
        ),
        chevron: (
          <>
            <path d="m7 10 5 5 5-5" />
          </>
        ),
        arrow: (
          <>
            <path d="M5 12h14M13 6l6 6-6 6" />
          </>
        ),
        lock: (
          <>
            <rect x="4" y="10" width="16" height="11" rx="2" />
            <path d="M8 10V7a4 4 0 0 1 8 0v3" />
          </>
        ),
        mail: (
          <>
            <rect x="3" y="5" width="18" height="14" rx="2" />
            <path d="m3 7 9 6 9-6" />
          </>
        ),
        user: (
          <>
            <circle cx="12" cy="8" r="4" />
            <path d="M4 21a8 8 0 0 1 16 0" />
          </>
        ),
        university: (
          <>
            <path d="m3 10 9-6 9 6-9 6z" />
            <path d="M5 12v6M9 14v4M15 14v4M19 12v6M3 18h18" />
          </>
        ),
        menu: (
          <>
            <path d="M4 6h16M4 12h16M4 18h16" />
          </>
        ),
        globe: (
          <>
            <circle cx="12" cy="12" r="9" />
            <path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18" />
          </>
        ),
        trophy: (
          <>
            <path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z" />
            <path d="M7 6H4v2a4 4 0 0 0 4 4M17 6h3v2a4 4 0 0 1-4 4" />
          </>
        ),
        target: (
          <>
            <circle cx="12" cy="12" r="9" />
            <circle cx="12" cy="12" r="5" />
            <circle cx="12" cy="12" r="1" />
          </>
        ),
        filter: (
          <>
            <path d="M4 6h16M7 12h10M10 18h4" />
          </>
        )
      };

      return (
        <svg
          width={size}
          height={size}
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth={strokeWidth}
          strokeLinecap="round"
          strokeLinejoin="round"
          className={className}
        >
          {paths[name] || paths.sparkles}
        </svg>
      );
    };

    const initialSubjects = [
      { id: 1, name: "Derecho Constitucional", progress: 82, color: "violet", cards: 126 },
      { id: 2, name: "Microeconomía", progress: 68, color: "fuchsia", cards: 94 },
      { id: 3, name: "Programación II", progress: 91, color: "indigo", cards: 148 },
      { id: 4, name: "Psicología Cognitiva", progress: 57, color: "purple", cards: 71 }
    ];

    const communityExams = [
      {
        id: 1,
        title: "Constitucional II · Parcial 2026",
        university: "Universidad Complutense de Madrid",
        subject: "Derecho Constitucional",
        questions: 25,
        difficulty: "Intermedio",
        author: "Laura M.",
        rating: 4.9,
        attempts: 128
      },
      {
        id: 2,
        title: "Microeconomía · Final",
        university: "Universidad Carlos III de Madrid",
        subject: "Microeconomía",
        questions: 30,
        difficulty: "Avanzado",
        author: "Carlos R.",
        rating: 4.8,
        attempts: 94
      },
      {
        id: 3,
        title: "Programación II · Java",
        university: "Universidad Politécnica de Madrid",
        subject: "Programación II",
        questions: 20,
        difficulty: "Intermedio",
        author: "Ana G.",
        rating: 4.7,
        attempts: 76
      },
      {
        id: 4,
        title: "Cognición y Memoria · Tema 1-5",
        university: "Universidad Autónoma de Madrid",
        subject: "Psicología Cognitiva",
        questions: 35,
        difficulty: "Básico",
        author: "Miguel P.",
        rating: 4.9,
        attempts: 151
      }
    ];

    const questions = [
      {
        question: "¿Cuál es la función principal de la Constitución en un Estado democrático?",
        options: [
          "Regular únicamente la economía nacional",
          "Establecer el marco jurídico y político fundamental del Estado",
          "Sustituir todas las leyes ordinarias",
          "Regular exclusivamente las relaciones internacionales"
        ],
        answer: 1,
        explanation:
          "La Constitución establece los principios fundamentales del Estado, organiza sus poderes y reconoce los derechos de los ciudadanos."
      },
      {
        question: "¿Qué principio garantiza que los poderes públicos estén sometidos a la ley?",
        options: [
          "Principio de legalidad",
          "Principio de oportunidad",
          "Principio de territorialidad",
          "Principio de subsidiariedad"
        ],
        answer: 0,
        explanation:
          "El principio de legalidad exige que las actuaciones de los poderes públicos se encuentren sometidas al ordenamiento jurídico."
      },
      {
        question: "¿Qué elemento caracteriza a una democracia constitucional?",
        options: [
          "La concentración de todos los poderes en una persona",
          "La ausencia de límites al poder político",
          "La separación de poderes y la protección de derechos fundamentales",
          "La eliminación del poder judicial"
        ],
        answer: 2,
        explanation:
          "Una democracia constitucional combina participación democrática, separación de poderes y garantías para los derechos fundamentales."
      }
    ];

    function App() {
      const [view, setView] = useState("auth");
      const [authMode, setAuthMode] = useState("login");
      const [subjects, setSubjects] = useState(initialSubjects);
      const [showSubjectModal, setShowSubjectModal] = useState(false);
      const [newSubject, setNewSubject] = useState("");
      const [notes, setNotes] = useState("");
      const [uploadedFile, setUploadedFile] = useState(null);
      const [dragging, setDragging] = useState(false);
      const [testQuestions, setTestQuestions] = useState(questions);
      const [testIndex, setTestIndex] = useState(0);
      const [answers, setAnswers] = useState({});
      const [selectedAnswer, setSelectedAnswer] = useState(null);
      const [testFinished, setTestFinished] = useState(false);
      const [visibility, setVisibility] = useState("Privado");
      const [mobileMenu, setMobileMenu] = useState(false);
      const [communitySearch, setCommunitySearch] = useState("");
      const [communityUniversity, setCommunityUniversity] = useState("Todas");
      const [communitySubject, setCommunitySubject] = useState("Todas");
      const [activeCommunityExam, setActiveCommunityExam] = useState(null);
      const fileInputRef = useRef(null);

      const filteredExams = useMemo(() => {
        return communityExams.filter((exam) => {
          const text = `${exam.title} ${exam.author} ${exam.subject}`.toLowerCase();
          const matchesSearch = text.includes(communitySearch.toLowerCase());
          const matchesUniversity =
            communityUniversity === "Todas" ||
            exam.university === communityUniversity;
          const matchesSubject =
            communitySubject === "Todas" || exam.subject === communitySubject;

          return matchesSearch && matchesUniversity && matchesSubject;
        });
      }, [communitySearch, communityUniversity, communitySubject]);

      const resetTest = (customQuestions = questions) => {
        setTestQuestions(customQuestions);
        setTestIndex(0);
        setAnswers({});
        setSelectedAnswer(null);
        setTestFinished(false);
      };

      const startTest = (customQuestions = questions) => {
        resetTest(customQuestions);
        setView("test");
      };

      const handleAnswer = (index) => {
        if (selectedAnswer !== null || testFinished) return;

        setSelectedAnswer(index);
        setAnswers((prev) => ({
          ...prev,
          [testIndex]: index
        }));
      };

      const nextQuestion = () => {
        if (testIndex < testQuestions.length - 1) {
          setTestIndex((prev) => prev + 1);
          setSelectedAnswer(null);
        } else {
          setTestFinished(true);
        }
      };

      const score = Object.entries(answers).reduce((total, [questionIndex, answer]) => {
        return total + (answer === testQuestions[questionIndex].answer ? 1 : 0);
      }, 0);

      const addSubject = () => {
        if (!newSubject.trim()) return;

        const colors = ["violet", "fuchsia", "indigo", "purple"];
        setSubjects((prev) => [
          ...prev,
          {
            id: Date.now(),
            name: newSubject.trim(),
            progress: 0,
            color: colors[prev.length % colors.length],
            cards: 0
          }
        ]);
        setNewSubject("");
        setShowSubjectModal(false);
      };

      const handleFile = (file) => {
        if (!file) return;
        if (file.type === "application/pdf" || file.name.toLowerCase().endsWith(".pdf")) {
          setUploadedFile(file);
        } else {
          alert("Por favor, selecciona un archivo PDF.");
        }
      };

      const onDrop = (event) => {
        event.preventDefault();
        setDragging(false);
        const file = event.dataTransfer.files?.[0];
        handleFile(file);
      };

      const signIn = (event) => {
        event.preventDefault();
        setView("dashboard");
      };

      const navigation = [
        { id: "dashboard", label: "Inicio", icon: "home" },
        { id: "test", label: "Simulador", icon: "chart" },
        { id: "community", label: "Banco comunitario", icon: "users" }
      ];

      if (view === "auth") {
        return (
          <AuthScreen
            authMode={authMode}
            setAuthMode={setAuthMode}
            onSubmit={signIn}
          />
        );
      }

      return (
        <div className="min-h-screen bg-[#faf9ff]">
          <header className="sticky top-0 z-40 border-b border-violet-100/80 bg-white/85 backdrop-blur-xl">
            <div className="mx-auto flex h-18 max-w-7xl items-center justify-between px-4 py-3 sm:px-6 lg:px-8">
              <button
                onClick={() => setView("dashboard")}
                className="flex items-center gap-2.5"
              >
                <div className="flex h-10 w-10 items-center justify-center rounded-xl bg-gradient-to-br from-violet-600 to-fuchsia-500 text-white shadow-lg shadow-violet-200">
                  <Icon name="brain" size={23} />
                </div>
                <div className="text-left">
                  <div className="text-lg font-extrabold tracking-tight text-slate-900">
                    Memor<span className="text-violet-600">AI</span>
                  </div>
                  <div className="hidden text-[10px] font-medium text-slate-400 sm:block">
                    TU AULA INTELIGENTE
                  </div>
                </div>
              </button>

              <div className="hidden items-center gap-1 md:flex">
                {navigation.map((item) => (
                  <button
                    key={item.id}
                    onClick={() => setView(item.id)}
                    className={`flex items-center gap-2 rounded-xl px-4 py-2.5 text-sm font-semibold transition ${
                      view === item.id
                        ? "bg-violet-50 text-violet-700"
                        : "text-slate-500 hover:bg-slate-50 hover:text-slate-900"
                    }`}
                  >
                    <Icon name={item.icon} size={17} />
                    {item.label}
                  </button>
                ))}
              </div>

              <div className="flex items-center gap-3">
                <div className="hidden text-right sm:block">
                  <div className="text-sm font-bold text-slate-800">María García</div>
                  <div className="text-xs text-slate-400">Estudiante</div>
                </div>
                <div className="flex h-10 w-10 items-center justify-center rounded-full bg-gradient-to-br from-violet-500 to-fuchsia-500 text-sm font-bold text-white shadow-md">
                  MG
                </div>
                <button
                  onClick={() => setMobileMenu((prev) => !prev)}
                  className="rounded-lg p-2 text-slate-500 hover:bg-slate-100 md:hidden"
                >
                  <Icon name="menu" />
                </button>
              </div>
            </div>

            {mobileMenu && (
              <div className="border-t border-violet-100 bg-white p-3 md:hidden">
                {navigation.map((item) => (
                  <button
                    key={item.id}
                    onClick={() => {
                      setView(item.id);
                      setMobileMenu(false);
                    }}
                    className={`flex w-full items-center gap-3 rounded-xl px-4 py-3 text-sm font-semibold ${
                      view === item.id
                        ? "bg-violet-50 text-violet-700"
                        : "text-slate-600"
                    }`}
                  >
                    <Icon name={item.icon} size={18} />
                    {item.label}
                  </button>
                ))}
              </div>
            )}
          </header>

          <main className="mx-auto max-w-7xl px-4 py-6 sm:px-6 lg:px-8">
            {view === "dashboard" && (
              <Dashboard
                subjects={subjects}
                setShowSubjectModal={setShowSubjectModal}
                notes={notes}
                setNotes={setNotes}
                uploadedFile={uploadedFile}
                setUploadedFile={setUploadedFile}
                dragging={dragging}
                setDragging={setDragging}
                onDrop={onDrop}
                fileInputRef={fileInputRef}
                handleFile={handleFile}
                startTest={startTest}
              />
            )}

            {view === "test" && (
              <TestSimulator
                questions={testQuestions}
                testIndex={testIndex}
                selectedAnswer={selectedAnswer}
                answers={answers}
                testFinished={testFinished}
                score={score}
                visibility={visibility}
                setVisibility={setVisibility}
                handleAnswer={handleAnswer}
                nextQuestion={nextQuestion}
                startTest={startTest}
                setView={setView}
              />
            )}

            {view === "community" && (
              <Community
                search={communitySearch}
                setSearch={setCommunitySearch}
                university={communityUniversity}
                setUniversity={setCommunityUniversity}
                subject={communitySubject}
                setSubject={setCommunitySubject}
                exams={filteredExams}
                startTest={startTest}
                activeExam={activeCommunityExam}
                setActiveExam={setActiveCommunityExam}
              />
            )}
          </main>

          {showSubjectModal && (
            <SubjectModal
              value={newSubject}
              setValue={setNewSubject}
              onClose={() => setShowSubjectModal(false)}
              onAdd={addSubject}
            />
          )}
        </div>
      );
    }

    function AuthScreen({ authMode, setAuthMode, onSubmit }) {
      return (
        <div className="grid-bg flex min-h-screen items-center justify-center overflow-hidden bg-[#faf9ff] px-4 py-8">
          <div className="pointer-events-none absolute -left-24 -top-24 h-72 w-72 rounded-full bg-violet-300/20 blur-3xl" />
          <div className="pointer-events-none absolute -bottom-24 -right-24 h-96 w-96 rounded-full bg-fuchsia-300/20 blur-3xl" />

          <div className="relative grid w-full max-w-5xl overflow-hidden rounded-[2rem] border border-violet-100 bg-white shadow-soft lg:grid-cols-[1fr_0.9fr]">
            <div className="relative hidden overflow-hidden bg-gradient-to-br from-violet-800 via-violet-700 to-fuchsia-700 p-10 text-white lg:flex lg:flex-col lg:justify-between">
              <div className="absolute -right-24 -top-24 h-72 w-72 rounded-full border-[50px] border-white/10" />
              <div className="absolute -bottom-32 -left-20 h-80 w-80 rounded-full border-[55px] border-fuchsia-300/10" />

              <div className="relative">
                <div className="mb-10 flex items-center gap-3">
                  <div className="flex h-11 w-11 items-center justify-center rounded-xl bg-white/15">
                    <Icon name="brain" size={25} />
                  </div>
                  <span className="text-xl font-extrabold">MemorAI</span>
                </div>

                <div className="max-w-md">
                  <div className="mb-5 inline-flex items-center gap-2 rounded-full border border-white/15 bg-white/10 px-3 py-1.5 text-xs font-semibold">
                    <Icon name="sparkles" size={14} />
                    Estudia de forma inteligente
                  </div>
                  <h1 className="text-4xl font-black leading-tight xl:text-5xl">
                    Convierte tus apuntes en conocimiento.
                  </h1>
                  <p className="mt-5 text-base leading-7 text-violet-100">
                    MemorAI combina IA y repetición espaciada para ayudarte a
                    preparar tus exámenes de forma más eficiente.
                  </p>
                </div>
              </div>

              <div className="relative grid grid-cols-3 gap-3">
                {[
                  ["94%", "Retención"],
                  ["2.4h", "Ahorradas/sem."],
                  ["+31%", "Rendimiento"]
                ].map(([value, label]) => (
                  <div key={label} className="rounded-2xl border border-white/10 bg-white/10 p-4">
                    <div className="text-xl font-black">{value}</div>
                    <div className="mt-1 text-[11px] text-violet-100">{label}</div>
                  </div>
                ))}
              </div>
            </div>

            <div className="p-6 sm:p-9 lg:p-12">
              <div className="mb-8 lg:hidden">
                <div className="mx-auto flex w-fit h-12 items-center justify-center rounded-2xl bg-gradient-to-br from-violet-600 to-fuchsia-500 px-4 text-white shadow-lg">
                  <div className="flex items-center gap-2 font-extrabold">
                    <Icon name="brain" />
                    MemorAI
                  </div>
                </div>
              </div>

              <div className="mb-7">
                <h2 className="text-2xl font-extrabold text-slate-900">
                  {authMode === "login" ? "Bienvenido de nuevo" : "Crea tu cuenta"}
                </h2>
                <p className="mt-2 text-sm text-slate-500">
                  {authMode === "login"
                    ? "Continúa donde lo dejaste y sigue avanzando."
                    : "Empieza a estudiar de una forma más inteligente."}
                </p>
              </div>

              <div className="mb-7 grid grid-cols-2 rounded-xl bg-slate-100 p-1">
                <button
                  onClick={() => setAuthMode("login")}
                  className={`rounded-lg py-2.5 text-sm font-bold transition ${
                    authMode === "login"
                      ? "bg-white text-violet-700 shadow-sm"
                      : "text-slate-500"
                  }`}
                >
                  Iniciar Sesión
                </button>
                <button
                  onClick={() => setAuthMode("register")}
                  className={`rounded-lg py-2.5 text-sm font-bold transition ${
                    authMode === "register"
                      ? "bg-white text-violet-700 shadow-sm"
                      : "text-slate-500"
                  }`}
                >
                  Registrarse
                </button>
              </div>

              <form onSubmit={onSubmit} className="space-y-4">
                {authMode === "register" && (
                  <InputField
                    icon="user"
                    label="Nombre completo"
                    placeholder="Ej. María García"
                    required
                  />
                )}

                <InputField
                  icon="mail"
                  label="Email"
                  type="email"
                  placeholder="tu@email.com"
                  required
                />

                <InputField
                  icon="lock"
                  label="Contraseña"
                  type="password"
                  placeholder="••••••••"
                  required
                />

                {authMode === "register" && (
                  <>
                    <InputField
                      icon="university"
                      label="Universidad"
                      placeholder="Ej. Universidad de Madrid"
                      required
                    />
                    <InputField
                      icon="book"
                      label="Carrera / Grado"
                      placeholder="Ej. Derecho"
                      required
                    />
                  </>
                )}

                {authMode === "login" && (
                  <div className="flex items-center justify-between pt-1">
                    <label className="flex items-center gap-2 text-xs text-slate-500">
                      <input
                        type="checkbox"
                        className="rounded border-slate-300 text-violet-600 focus:ring-violet-500"
                      />
                      Recordarme
                    </label>
                    <button
                      type="button"
                      className="text-xs font-bold text-violet-600 hover:text-violet-800"
                    >
                      ¿Olvidaste tu contraseña?
                    </button>
                  </div>
                )}

                <button
                  type="submit"
                  className="mt-3 flex w-full items-center justify-center gap-2 rounded-xl bg-gradient-to-r from-violet-600 to-fuchsia-600 py-3.5 text-sm font-bold text-white shadow-lg shadow-violet-200 transition hover:-translate-y-0.5 hover:shadow-xl"
                >
                  {authMode === "login" ? "Entrar en MemorAI" : "Crear mi cuenta"}
                  <Icon name="arrow" size={17} />
                </button>
              </form>

              <div className="mt-7 flex items-center gap-3 text-[11px] text-slate-400">
                <div className="h-px flex-1 bg-slate-100" />
                <span>Tu progreso, tus datos</span>
                <div className="h-px flex-1 bg-slate-100" />
              </div>
            </div>
          </div>
        </div>
      );
    }

    function InputField({
      icon,
      label,
      placeholder,
      type = "text",
      required = false
    }) {
      return (
        <label className="block">
          <span className="mb-1.5 block text-xs font-bold text-slate-600">{label}</span>
          <div className="relative">
            <Icon
              name={icon}
              size={17}
              className="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"
            />
            <input
              type={type}
              required={required}
              placeholder={placeholder}
              className="w-full rounded-xl border border-slate-200 bg-white py-3 pl-10 pr-4 text-sm text-slate-800 outline-none transition placeholder:text-slate-300 focus:border-violet-400 focus:ring-4 focus:ring-violet-100"
            />
          </div>
        </label>
      );
    }

    function Dashboard({
      subjects,
      setShowSubjectModal,
      notes,
      setNotes,
      uploadedFile,
      setUploadedFile,
      dragging,
      setDragging,
      onDrop,
      fileInputRef,
      handleFile,
      startTest
    }) {
      return (
        <div className="fade-in">
          <section className="mb-7 flex flex-col justify-between gap-4 sm:flex-row sm:items-end">
            <div>
              <div className="mb-2 inline-flex items-center gap-2 rounded-full bg-violet-50 px-3 py-1.5 text-xs font-bold text-violet-700">
                <Icon name="sparkles" size={14} />
                Buenos días, María
              </div>
              <h1 className="text-3xl font-black tracking-tight text-slate-900 sm:text-4xl">
                Tu espacio de estudio
              </h1>
              <p className="mt-2 text-sm text-slate-500">
                Hoy es un buen día para avanzar un poco más.
              </p>
            </div>
            <button
              onClick={() => setShowSubjectModal(true)}
              className="inline-flex items-center justify-center gap-2 rounded-xl bg-violet-600 px-4 py-3 text-sm font-bold text-white shadow-lg shadow-violet-200 transition hover:bg-violet-700"
            >
              <Icon name="plus" size={18} />
              Añadir Asignatura
            </button>
          </section>

          <section className="grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
            <MetricCard
              icon="target"
              label="Nivel de dominio"
              value="78%"
              detail="+6% esta semana"
              color="violet"
              progress={78}
            />
            <MetricCard
              icon="calendar"
              label="Próximo examen"
              value="18 Sep"
              detail="Derecho Constitucional"
              color="fuchsia"
            />
            <MetricCard
              icon="flame"
              label="Días en racha"
              value="12 días"
              detail="Tu mejor racha: 19 días"
              color="orange"
            />
            <MetricCard
              icon="clock"
              label="Repasos pendientes"
              value="24"
              detail="≈ 35 min estimados"
              color="indigo"
            />
          </section>

          <section className="mt-7 grid gap-6 lg:grid-cols-[1.15fr_0.85fr]">
            <div className="rounded-3xl border border-violet-100 bg-white p-5 shadow-soft sm:p-6">
              <div className="mb-5 flex items-center justify-between">
                <div>
                  <h2 className="text-lg font-extrabold text-slate-900">Mis asignaturas</h2>
                  <p className="mt-1 text-xs text-slate-400">
                    Tu progreso actual por materia
                  </p>
                </div>
                <span className="rounded-full bg-violet-50 px-3 py-1 text-xs font-bold text-violet-600">
                  {subjects.length} materias
                </span>
              </div>

              <div className="space-y-3">
                {subjects.map((subject) => (
                  <SubjectRow key={subject.id} subject={subject} />
                ))}
              </div>
            </div>

            <div className="rounded-3xl border border-violet-100 bg-white p-5 shadow-soft sm:p-6">
              <div className="mb-5 flex items-center gap-3">
                <div className="flex h-10 w-10 items-center justify-center rounded-xl bg-violet-100 text-violet-600">
                  <Icon name="sparkles" size={20} />
                </div>
                <div>
                  <h2 className="text-lg font-extrabold text-slate-900">Crear con IA</h2>
                  <p className="text-xs text-slate-400">Apuntes → test personalizado</p>
                </div>
              </div>

              <div
                onDragOver={(event) => {
                  event.preventDefault();
                  setDragging(true);
                }}
                onDragLeave={() => setDragging(false)}
                onDrop={onDrop}
                onClick={() => fileInputRef.current?.click()}
                className={`drop-zone mb-4 cursor-pointer rounded-2xl border-2 border-dashed p-6 text-center ${
                  dragging
                    ? "dragging"
                    : "border-violet-200 bg-violet-25 hover:border-violet-400 hover:bg-violet-50/50"
                }`}
              >
                <input
                  ref={fileInputRef}
                  type="file"
                  accept=".pdf,application/pdf"
                  className="hidden"
                  onChange={(e) => handleFile(e.target.files?.[0])}
                />

                {uploadedFile ? (
                  <div className="flex items-center justify-center gap-3">
                    <div className="flex h-11 w-11 items-center justify-center rounded-xl bg-red-50 text-red-500">
                      <Icon name="file" />
                    </div>
                    <div className="text-left">
                      <div className="max-w-[220px] truncate text-sm font-bold text-slate-800">
                        {uploadedFile.name}
                      </div>
                      <div className="text-xs text-emerald-600">PDF listo para procesar</div>
                    </div>
                    <button
                      onClick={(e) => {
                        e.stopPropagation();
                        setUploadedFile(null);
                      }}
                      className="rounded-lg p-2 text-slate-400 hover:bg-slate-100 hover:text-slate-600"
                    >
                      <Icon name="x" size={16} />
                    </button>
                  </div>
                ) : (
                  <>
                    <div className="mx-auto mb-3 flex h-12 w-12 items-center justify-center rounded-2xl bg-violet-100 text-violet-600">
                      <Icon name="upload" size={22} />
                    </div>
                    <div className="text-sm font-bold text-slate-700">
                      Arrastra tu PDF aquí
                    </div>
                    <div className="mt-1 text-xs text-slate-400">
                      o haz clic para seleccionar un archivo
                    </div>
                  </>
                )}
              </div>

              <div className="mb-4">
                <label className="mb-2 block text-xs font-bold text-slate-600">
                  O pega tus apuntes
                </label>
                <textarea
                  value={notes}
                  onChange={(e) => setNotes(e.target.value)}
                  placeholder="Pega aquí el contenido de tus apuntes..."
                  rows="4"
                  className="w-full resize-none rounded-2xl border border-slate-200 bg-slate-50 p-3 text-sm outline-none transition placeholder:text-slate-300 focus:border-violet-400 focus:bg-white focus:ring-4 focus:ring-violet-100"
                />
              </div>

              <button
                onClick={() => startTest()}
                className="flex w-full items-center justify-center gap-2 rounded-xl bg-gradient-to-r from-violet-600 to-fuchsia-600 py-3.5 text-sm font-bold text-white shadow-lg shadow-violet-200 transition hover:-translate-y-0.5"
              >
                <Icon name="sparkles" size={18} />
                Generar Test con IA
              </button>
            </div>
          </section>

          <section className="mt-6 rounded-3xl border border-violet-100 bg-gradient-to-r from-violet-700 to-fuchsia-700 p-6 text-white shadow-soft sm:p-7">
            <div className="flex flex-col justify-between gap-5 sm:flex-row sm:items-center">
              <div>
                <div className="mb-2 flex items-center gap-2 text-violet-200">
                  <Icon name="trophy" size={18} />
                  <span className="text-xs font-bold uppercase tracking-wider">
                    Tu progreso semanal
                  </span>
                </div>
                <h3 className="text-2xl font-black">¡Vas por muy buen camino!</h3>
                <p className="mt-1 max-w-xl text-sm text-violet-100">
                  Has completado el 86% de tu objetivo semanal. Mantén tu racha para
                  desbloquear el siguiente nivel.
                </p>
              </div>
              <div className="flex h-24 w-24 shrink-0 items-center justify-center rounded-full border-8 border-white/20 bg-white/10 text-center">
                <div>
                  <div className="text-2xl font-black">86%</div>
                  <div className="text-[9px] text-violet-100">OBJETIVO</div>
                </div>
              </div>
            </div>
          </section>
        </div>
      );
    }

    function MetricCard({ icon, label, value, detail, color, progress }) {
      const styles = {
        violet: {
          bg: "bg-violet-50",
          text: "text-violet-600",
          ring: "text-violet-500"
        },
        fuchsia: {
          bg: "bg-fuchsia-50",
          text: "text-fuchsia-600",
          ring: "text-fuchsia-500"
        },
        orange: {
          bg: "bg-orange-50",
          text: "text-orange-500",
          ring: "text-orange-500"
        },
        indigo: {
          bg: "bg-indigo-50",
          text: "text-indigo-600",
          ring: "text-indigo-500"
        }
      };

      const style = styles[color];

      return (
        <div className="rounded-3xl border border-violet-100 bg-white p-5 shadow-soft">
          <div className="flex items-start justify-between">
            <div className={`flex h-10 w-10 items-center justify-center rounded-xl ${style.bg} ${style.text}`}>
              <Icon name={icon} size={20} />
            </div>
            {progress && (
              <div className="relative h-11 w-11">
                <svg className="progress-ring h-11 w-11">
                  <circle
                    cx="22"
                    cy="22"
                    r="18"
                    stroke="currentColor"
                    strokeWidth="4"
                    fill="none"
                    className="text-slate-100"
                  />
                  <circle
                    cx="22"
                    cy="22"
                    r="18"
                    stroke="currentColor"
                    strokeWidth="4"
                    fill="none"
                    strokeDasharray={`${progress * 1.13} 113`}
                    className={style.ring}
                  />
                </svg>
              </div>
            )}
          </div>
          <div className="mt-5 text-xs font-semibold text-slate-400">{label}</div>
          <div className="mt-1 text-2xl font-black tracking-tight text-slate-900">{value}</div>
          <div className="mt-1 truncate text-[11px] text-slate-400">{detail}</div>
        </div>
      );
    }

    function SubjectRow({ subject }) {
      const colors = {
        violet: {
          icon: "bg-violet-100 text-violet-600",
          bar: "bg-violet-500"
        },
        fuchsia: {
          icon: "bg-fuchsia-100 text-fuchsia-600",
          bar: "bg-fuchsia-500"
        },
        indigo: {
          icon: "bg-indigo-100 text-indigo-600",
          bar: "bg-indigo-500"
        },
        purple: {
          icon: "bg-purple-100 text-purple-600",
          bar: "bg-purple-500"
        }
      };

      const color = colors[subject.color];

      return (
        <div className="group rounded-2xl border border-slate-100 p-4 transition hover:border-violet-100 hover:bg-violet-25">
          <div className="flex items-center gap-3">
            <div className={`flex h-10 w-10 shrink-0 items-center justify-center rounded-xl ${color.icon}`}>
              <Icon name="book" size={18} />
            </div>

            <div className="min-w-0 flex-1">
              <div className="flex items-center justify-between gap-3">
                <span className="truncate text-sm font-bold text-slate-800">
                  {subject.name}
                </span>
                <span className="text-sm font-black text-slate-700">{subject.progress}%</span>
              </div>

              <div className="mt-2 h-2 overflow-hidden rounded-full bg-slate-100">
                <div
                  className={`h-full rounded-full ${color.bar} transition-all`}
                  style={{ width: `${subject.progress}%` }}
                />
              </div>

              <div className="mt-2 text-[10px] text-slate-400">
                {subject.cards} tarjetas · {subject.progress > 0 ? "Repaso activo" : "Sin comenzar"}
              </div>
            </div>
          </div>
        </div>
      );
    }

    function TestSimulator({
      questions,
      testIndex,
      selectedAnswer,
      answers,
      testFinished,
      score,
      visibility,
      setVisibility,
      handleAnswer,
      nextQuestion,
      startTest,
      setView
    }) {
      const current = questions[testIndex];
      const percentage = Math.round((score / questions.length) * 100);

      return (
        <div className="mx-auto max-w-4xl fade-in">
          <div className="mb-6 flex flex-col justify-between gap-4 sm:flex-row sm:items-center">
            <div>
              <button
                onClick={() => setView("dashboard")}
                className="mb-3 text-xs font-bold text-violet-600 hover:text-violet-800"
              >
                ← Volver al panel
              </button>
              <h1 className="text-3xl font-black tracking-tight text-slate-900">
                Simulador de examen
              </h1>
              <p className="mt-1 text-sm text-slate-500">
                Derecho Constitucional · Test generado con IA
              </p>
            </div>

            <div className="flex items-center rounded-xl border border-slate-200 bg-white p-1">
              <button
                onClick={() => setVisibility("Privado")}
                className={`rounded-lg px-3 py-2 text-xs font-bold transition ${
                  visibility === "Privado"
                    ? "bg-violet-100 text-violet-700"
                    : "text-slate-400"
                }`}
              >
                🔒 Privado
              </button>
              <button
                onClick={() => setVisibility("Público")}
                className={`rounded-lg px-3 py-2 text-xs font-bold transition ${
                  visibility === "Público"
                    ? "bg-emerald-100 text-emerald-700"
                    : "text-slate-400"
                }`}
              >
                🌐 Público
              </button>
            </div>
          </div>

          {!testFinished ? (
            <div className="rounded-3xl border border-violet-100 bg-white p-5 shadow-soft sm:p-8">
              <div className="mb-8">
                <div className="mb-3 flex items-center justify-between text-xs font-bold">
                  <span className="text-violet-600">
                    Pregunta {testIndex + 1} de {questions.length}
                  </span>
                  <span className="text-slate-400">
                    {Math.round(((testIndex) / questions.length) * 100)}% completado
                  </span>
                </div>
                <div className="h-2 overflow-hidden rounded-full bg-slate-100">
                  <div
                    className="h-full rounded-full bg-gradient-to-r from-violet-600 to-fuchsia-500 transition-all"
                    style={{ width: `${((testIndex + 1) / questions.length) * 100}%` }}
                  />
                </div>
              </div>

              <div className="mb-7">
                <div className="mb-3 flex h-10 w-10 items-center justify-center rounded-xl bg-violet-100 font-black text-violet-600">
                  {testIndex + 1}
                </div>
                <h2 className="max-w-3xl text-xl font-extrabold leading-relaxed text-slate-900 sm:text-2xl">
                  {current.question}
                </h2>
              </div>

              <div className="space-y-3">
                {current.options.map((option, index) => {
                  const isSelected = selectedAnswer === index;
                  const isCorrect = index === current.answer;
                  const answered = selectedAnswer !== null;

                  let classes =
                    "border-slate-200 bg-white hover:border-violet-300 hover:bg-violet-25";

                  if (answered && isCorrect) {
                    classes = "border-emerald-300 bg-emerald-50";
                  } else if (answered && isSelected && !isCorrect) {
                    classes = "border-red-300 bg-red-50";
                  }

                  return (
                    <button
                      key={option}
                      onClick={() => handleAnswer(index)}
                      className={`flex w-full items-center gap-4 rounded-2xl border p-4 text-left transition ${classes}`}
                    >
                      <span
                        className={`flex h-9 w-9 shrink-0 items-center justify-center rounded-full text-sm font-bold ${
                          answered && isCorrect
                            ? "bg-emerald-500 text-white"
                            : answered && isSelected
                            ? "bg-red-500 text-white"
                            : "bg-slate-100 text-slate-500"
                        }`}
                      >
                        {answered && isCorrect ? (
                          <Icon name="check" size={17} />
                        ) : answered && isSelected ? (
                          <Icon name="x" size={17} />
                        ) : (
                          String.fromCharCode(65 + index)
                        )}
                      </span>
                      <span className="text-sm font-semibold text-slate-700">{option}</span>
                    </button>
                  );
                })}
              </div>

              {selectedAnswer !== null && (
                <div
                  className={`mt-5 rounded-2xl border p-4 ${
                    selectedAnswer === current.answer
                      ? "border-emerald-200 bg-emerald-50"
                      : "border-red-200 bg-red-50"
                  }`}
                >
                  <div className="flex items-start gap-3">
                    <div
                      className={`mt-0.5 flex h-8 w-8 shrink-0 items-center justify-center rounded-full ${
                        selectedAnswer === current.answer
                          ? "bg-emerald-500 text-white"
                          : "bg-red-500 text-white"
                      }`}
                    >
                      <Icon
                        name={selectedAnswer === current.answer ? "check" : "x"}
                        size={16}
                      />
                    </div>
                    <div>
                      <div
                        className={`text-sm font-extrabold ${
                          selectedAnswer === current.answer
                            ? "text-emerald-700"
                            : "text-red-700"
                        }`}
                      >
                        {selectedAnswer === current.answer ? "¡Correcto!" : "Incorrecto"}
                      </div>
                      <p className="mt-1 text-xs leading-5 text-slate-600">
                        {current.explanation}
                      </p>
                    </div>
                  </div>
                </div>
              )}

              <div className="mt-7 flex justify-end">
                <button
                  disabled={selectedAnswer === null}
                  onClick={nextQuestion}
                  className={`inline-flex items-center gap-2 rounded-xl px-5 py-3 text-sm font-bold text-white transition ${
                    selectedAnswer === null
                      ? "cursor-not-allowed bg-slate-200"
                      : "bg-violet-600 hover:bg-violet-700"
                  }`}
                >
                  {testIndex === questions.length - 1 ? "Ver resultado" : "Siguiente"}
                  <Icon name="arrow" size={17} />
                </button>
              </div>
            </div>
          ) : (
            <div className="slide-up overflow-hidden rounded-3xl border border-violet-100 bg-white shadow-soft">
              <div className="bg-gradient-to-br from-violet-700 to-fuchsia-700 px-6 py-10 text-center text-white sm:px-10">
                <div className="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-full bg-white/15">
                  <Icon name="trophy" size={31} />
                </div>
                <div className="text-sm font-semibold text-violet-100">Test completado</div>
                <div className="mt-1 text-5xl font-black">{percentage}%</div>
                <div className="mt-2 text-sm text-violet-100">
                  Has acertado {score} de {questions.length} preguntas
                </div>
              </div>

              <div className="grid gap-4 p-6 sm:grid-cols-3 sm:p-8">
                <ResultCard
                  icon="check"
                  title="Respuestas correctas"
                  value={`${score}/${questions.length}`}
                  color="emerald"
                />
                <ResultCard
                  icon="target"
                  title="Nivel estimado"
                  value={percentage >= 80 ? "Alto" : percentage >= 60 ? "Medio" : "Inicial"}
                  color="violet"
                />
                <ResultCard
                  icon="clock"
                  title="Próximo repaso"
                  value={percentage >= 80 ? "7 días" : percentage >= 60 ? "3 días" : "1 día"}
                  color="fuchsia"
                />
              </div>

              <div className="border-t border-slate-100 px-6 py-5 sm:px-8">
                <div className="rounded-2xl bg-violet-50 p-4">
                  <div className="flex gap-3">
                    <Icon name="sparkles" className="mt-0.5 text-violet-600" />
                    <div>
                      <div className="text-sm font-extrabold text-violet-800">
                        Repetición espaciada programada
                      </div>
                      <p className="mt-1 text-xs leading-5 text-violet-700/80">
                        Hemos ajustado tu siguiente repaso según tu rendimiento. Las preguntas
                        que has fallado aparecerán antes para reforzar la memoria.
                      </p>
                    </div>
                  </div>
                </div>

                <div className="mt-5 flex flex-col gap-3 sm:flex-row">
                  <button
                    onClick={() => startTest()}
                    className="flex-1 rounded-xl bg-violet-600 px-5 py-3 text-sm font-bold text-white hover:bg-violet-700"
                  >
                    Repetir test
                  </button>
                  <button
                    onClick={() => setView("dashboard")}
                    className="flex-1 rounded-xl border border-slate-200 bg-white px-5 py-3 text-sm font-bold text-slate-700 hover:bg-slate-50"
                  >
                    Volver al inicio
                  </button>
                </div>

                {visibility === "Público" && (
                  <div className="mt-4 rounded-xl border border-emerald-200 bg-emerald-50 p-3 text-center text-xs font-semibold text-emerald-700">
                    🌐 Este examen está marcado como público y podría compartirse con la comunidad.
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    function ResultCard({ icon, title, value, color }) {
      const styles = {
        emerald: "bg-emerald-50 text-emerald-600",
        violet: "bg-violet-50 text-violet-600",
        fuchsia: "bg-fuchsia-50 text-fuchsia-600"
      };

      return (
        <div className="rounded-2xl border border-slate-100 p-4">
          <div className={`mb-3 flex h-9 w-9 items-center justify-center rounded-xl ${styles[color]}`}>
            <Icon name={icon} size={17} />
          </div>
          <div className="text-xs text-slate-400">{title}</div>
          <div className="mt-1 text-lg font-black text-slate-800">{value}</div>
        </div>
      );
    }

    function Community({
      search,
      setSearch,
      university,
      setUniversity,
      subject,
      setSubject,
      exams,
      startTest,
      activeExam,
      setActiveExam
    }) {
      return (
        <div className="fade-in">
          <section className="mb-7">
            <div className="mb-2 inline-flex items-center gap-2 rounded-full bg-fuchsia-50 px-3 py-1.5 text-xs font-bold text-fuchsia-700">
              <Icon name="globe" size={14} />
              Comunidad MemorAI
            </div>
            <h1 className="text-3xl font-black tracking-tight text-slate-900 sm:text-4xl">
              Banco comunitario
            </h1>
            <p className="mt-2 max-w-2xl text-sm leading-6 text-slate-500">
              Descubre y practica exámenes compartidos por estudiantes de distintas
              universidades.
            </p>
          </section>

          <section className="mb-6 rounded-3xl border border-violet-100 bg-white p-4 shadow-soft sm:p-5">
            <div className="grid gap-3 lg:grid-cols-[1fr_230px_210px]">
              <div className="relative">
                <Icon
                  name="search"
                  size={18}
                  className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"
                />
                <input
                  value={search}
                  onChange={(e) => setSearch(e.target.value)}
                  placeholder="Buscar exámenes, materias o autores..."
                  className="w-full rounded-xl border border-slate-200 bg-slate-50 py-3 pl-11 pr-4 text-sm outline-none focus:border-violet-400 focus:bg-white focus:ring-4 focus:ring-violet-100"
                />
              </div>

              <SelectFilter
                value={university}
                setValue={setUniversity}
                options={[
                  "Todas",
                  "Universidad Complutense de Madrid",
                  "Universidad Carlos III de Madrid",
                  "Universidad Politécnica de Madrid",
                  "Universidad Autónoma de Madrid"
                ]}
              />

              <SelectFilter
                value={subject}
                setValue={setSubject}
                options={[
                  "Todas",
                  "Derecho Constitucional",
                  "Microeconomía",
                  "Programación II",
                  "Psicología Cognitiva"
                ]}
              />
            </div>
          </section>

          <div className="mb-4 flex items-center justify-between">
            <div className="flex items-center gap-2">
              <Icon name="filter" size={16} className="text-violet-600" />
              <span className="text-sm font-bold text-slate-700">
                {exams.length} exámenes encontrados
              </span>
            </div>
            <span className="hidden text-xs text-slate-400 sm:block">
              Ordenados por relevancia
            </span>
          </div>

          {exams.length === 0 ? (
            <div className="rounded-3xl border border-dashed border-violet-200 bg-white p-12 text-center">
              <div className="mx-auto mb-3 flex h-12 w-12 items-center justify-center rounded-2xl bg-violet-50 text-violet-500">
                <Icon name="search" />
              </div>
              <h3 className="font-extrabold text-slate-800">No encontramos resultados</h3>
              <p className="mt-1 text-sm text-slate-400">
                Prueba con otros términos o filtros.
              </p>
            </div>
          ) : (
            <div className="grid gap-4">
              {exams.map((exam) => (
                <ExamCard
                  key={exam.id}
                  exam={exam}
                  onPractice={() => startTest()}
                  onPreview={() => setActiveExam(exam)}
                />
              ))}
            </div>
          )}

          {activeExam && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/40 p-4 backdrop-blur-sm">
              <div className="w-full max-w-lg rounded-3xl bg-white p-6 shadow-2xl">
                <div className="flex items-start justify-between">
                  <div>
                    <div className="mb-2 inline-flex rounded-full bg-violet-50 px-2.5 py-1 text-[10px] font-bold text-violet-600">
                      EXAMEN PÚBLICO
                    </div>
                    <h3 className="text-xl font-black text-slate-900">{activeExam.title}</h3>
                  </div>
                  <button
                    onClick={() => setActiveExam(null)}
                    className="rounded-xl p-2 text-slate-400 hover:bg-slate-100"
                  >
                    <Icon name="x" />
                  </button>
                </div>

                <div className="mt-5 grid grid-cols-2 gap-3">
                  <InfoPill label="Universidad" value={activeExam.university} />
                  <InfoPill label="Asignatura" value={activeExam.subject} />
                  <InfoPill label="Preguntas" value={`${activeExam.questions}`} />
                  <InfoPill label="Dificultad" value={activeExam.difficulty} />
                </div>

                <div className="mt-5 flex items-center gap-2 text-xs text-slate-500">
                  <span className="font-bold text-amber-500">★ {activeExam.rating}</span>
                  <span>·</span>
                  <span>{activeExam.attempts} intentos</span>
                  <span>·</span>
                  <span>Por {activeExam.author}</span>
                </div>

                <button
                  onClick={() => {
                    setActiveExam(null);
                    startTest();
                  }}
                  className="mt-6 flex w-full items-center justify-center gap-2 rounded-xl bg-violet-600 py-3.5 text-sm font-bold text-white hover:bg-violet-700"
                >
                  Practicar ahora
                  <Icon name="arrow" size={17} />
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    function SelectFilter({ value, setValue, options }) {
      return (
        <div className="relative">
          <select
            value={value}
            onChange={(e) => setValue(e.target.value)}
            className="w-full appearance-none rounded-xl border border-slate-200 bg-slate-50 py-3 pl-4 pr-10 text-sm font-medium text-slate-600 outline-none focus:border-violet-400 focus:bg-white focus:ring-4 focus:ring-violet-100"
          >
            {options.map((option) => (
              <option key={option}>{option}</option>
            ))}
          </select>
          <Icon
            name="chevron"
            size={16}
            className="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-slate-400"
          />
        </div>
      );
    }

    function ExamCard({ exam, onPractice, onPreview }) {
      return (
        <div className="rounded-3xl border border-violet-100 bg-white p-5 shadow-soft transition hover:-translate-y-0.5 hover:shadow-lg sm:p-6">
          <div className="flex flex-col gap-5 lg:flex-row lg:items-center lg:justify-between">
            <div className="flex min-w-0 gap-4">
              <div className="hidden h-12 w-12 shrink-0 items-center justify-center rounded-2xl bg-gradient-to-br from-violet-100 to-fuchsia-100 text-violet-600 sm:flex">
                <Icon name="file" size={21} />
              </div>

              <div className="min-w-0">
                <div className="mb-2 flex flex-wrap items-center gap-2">
                  <span className="rounded-full bg-violet-50 px-2.5 py-1 text-[10px] font-bold text-violet-600">
                    {exam.subject}
                  </span>
                  <span className="rounded-full bg-emerald-50 px-2.5 py-1 text-[10px] font-bold text-emerald-600">
                    Público
                  </span>
                </div>

                <h3 className="truncate text-lg font-extrabold text-slate-900">{exam.title}</h3>

                <div className="mt-2 flex flex-wrap items-center gap-x-3 gap-y-1 text-xs text-slate-400">
                  <span>{exam.university}</span>
                  <span>·</span>
                  <span>{exam.questions} preguntas</span>
                  <span>·</span>
                  <span>{exam.difficulty}</span>
                </div>

                <div className="mt-3 flex items-center gap-3 text-xs">
                  <span className="font-bold text-amber-500">★ {exam.rating}</span>
                  <span className="text-slate-400">{exam.attempts} intentos</span>
                  <span className="text-slate-400">Por {exam.author}</span>
                </div>
              </div>
            </div>

            <div className="flex shrink-0 gap-2">
              <button
                onClick={onPreview}
                className="rounded-xl border border-slate-200 px-4 py-2.5 text-xs font-bold text-slate-600 hover:bg-slate-50"
              >
                Ver detalles
              </button>
              <button
                onClick={onPractice}
                className="inline-flex items-center justify-center gap-2 rounded-xl bg-violet-600 px-4 py-2.5 text-xs font-bold text-white shadow-md shadow-violet-100 hover:bg-violet-700"
              >
                Practicar ahora
                <Icon name="arrow" size={15} />
              </button>
            </div>
          </div>
        </div>
      );
    }

    function InfoPill({ label, value }) {
      return (
        <div className="rounded-xl bg-slate-50 p-3">
          <div className="text-[10px] font-semibold uppercase tracking-wider text-slate-400">
            {label}
          </div>
          <div className="mt-1 text-xs font-bold text-slate-700">{value}</div>
        </div>
      );
    }

    function SubjectModal({ value, setValue, onClose, onAdd }) {
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/40 p-4 backdrop-blur-sm">
          <div className="w-full max-w-md rounded-3xl bg-white p-6 shadow-2xl sm:p-7">
            <div className="flex items-start justify-between">
              <div>
                <div className="mb-3 flex h-10 w-10 items-center justify-center rounded-xl bg-violet-100 text-violet-600">
                  <Icon name="book" size={20} />
                </div>
                <h2 className="text-xl font-black text-slate-900">Añadir asignatura</h2>
                <p className="mt-1 text-sm text-slate-400">
                  Crea una nueva materia para organizar tus repasos.
                </p>
              </div>

              <button
                onClick={onClose}
                className="rounded-xl p-2 text-slate-400 hover:bg-slate-100"
              >
                <Icon name="x" />
              </button>
            </div>

            <label className="mt-6 block">
              <span className="mb-2 block text-xs font-bold text-slate-600">
                Nombre de la materia
              </span>
              <input
                autoFocus
                value={value}
                onChange={(e) => setValue(e.target.value)}
                onKeyDown={(e) => {
                  if (e.key === "Enter") onAdd();
                }}
                placeholder="Ej. Historia del Derecho"
                className="w-full rounded-xl border border-slate-200 px-4 py-3 text-sm outline-none focus:border-violet-400 focus:ring-4 focus:ring-violet-100"
              />
            </label>

            <div className="mt-6 flex gap-3">
              <button
                onClick={onClose}
                className="flex-1 rounded-xl border border-slate-200 py-3 text-sm font-bold text-slate-600 hover:bg-slate-50"
              >
                Cancelar
              </button>
              <button
                onClick={onAdd}
                disabled={!value.trim()}
                className={`flex-1 rounded-xl py-3 text-sm font-bold text-white ${
                  value.trim()
                    ? "bg-violet-600 hover:bg-violet-700"
                    : "cursor-not-allowed bg-slate-200"
                }`}
              >
                Añadir materia
              </button>
            </div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
```
