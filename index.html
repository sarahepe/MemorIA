<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MemorAI: Tu Aula Inteligente</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            200: '#ddd6fe',
                            300: '#c4b5fd',
                            400: '#a78bfa',
                            500: '#8b5cf6',
                            600: '#7c3aed',
                            700: '#6d28d9',
                            800: '#5b21b6',
                            900: '#4c1d95',
                        }
                    }
                }
            }
        }
    </script>

    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel para JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- PDF.js para lectura de archivos PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>

    <!-- jsPDF para exportar resúmenes y exámenes a PDF real -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- Tesseract.js CDN para reconocimiento OCR de fotos escritas a mano -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body class="bg-gradient-to-br from-slate-50 via-purple-50/50 to-slate-100 text-slate-800 font-sans min-h-screen flex flex-col">

    <div id="root" class="flex-1 flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- COMPONENTE DE ICONOS SVG ---
        const Icon = ({ name, className = "w-5 h-5" }) => {
            const icons = {
                brain: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />,
                sparkles: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" />,
                plus: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4" />,
                calendar: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />,
                clock: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />,
                "book-open": <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />,
                "file-text": <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />,
                "upload-cloud": <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />,
                "check-circle": <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />,
                "x-circle": <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />,
                "alert-circle": <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />,
                "arrow-right": <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />,
                "log-out": <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />,
                "trash-2": <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />,
                x: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />,
                file: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z" />,
                chevronRight: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7" />,
                list: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 10h16M4 14h16M4 18h16" />,
                user: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />,
                download: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />,
                printer: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />,
                camera: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9zM15 13a3 3 0 11-6 0 3 3 0 016 0z" />,
                calculator: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
            };

            return (
                <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    {icons[name] || <circle cx="12" cy="12" r="10" strokeWidth="2" />}
                </svg>
            );
        };

        // --- COMPONENTE CALENDARIO CON TOOLTIP Y DÍA ACTUAL DESTACADO ---
        const ExamCalendar = ({ subjects }) => {
            const today = new Date();
            const currentDay = today.getDate();
            const currentMonth = today.getMonth();
            const currentYear = today.getFullYear();

            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
            
            const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

            const examDates = subjects
                .filter(s => s.examDate && s.examDate !== 'Sin fecha')
                .map(s => ({
                    dateStr: s.examDate,
                    name: s.name
                }));

            const daysArray = [];
            for (let i = 0; i < (firstDayIndex === 0 ? 6 : firstDayIndex - 1); i++) {
                daysArray.push(null);
            }
            for (let i = 1; i <= daysInMonth; i++) {
                daysArray.push(i);
            }

            return (
                <div className="bg-white p-6 rounded-3xl border border-purple-100 shadow-xl shadow-purple-500/5 space-y-4">
                    <div className="flex justify-between items-center">
                        <h3 className="font-extrabold text-slate-800 text-base flex items-center space-x-2">
                            <span className="p-2 bg-brand-100 text-brand-600 rounded-xl">
                                <Icon name="calendar" className="w-5 h-5" />
                            </span>
                            <span>{monthNames[currentMonth]} {currentYear}</span>
                        </h3>
                        <span className="text-xs font-bold text-brand-600 bg-brand-50 px-3 py-1 rounded-full border border-brand-200">
                            HOY Marcado ✨
                        </span>
                    </div>

                    <div className="grid grid-cols-7 gap-2 text-center text-xs font-bold text-slate-400 uppercase tracking-wider">
                        <div>Lun</div><div>Mar</div><div>Mié</div><div>Jue</div><div>Vie</div><div>Sáb</div><div>Dom</div>
                    </div>

                    <div className="grid grid-cols-7 gap-2 text-center text-xs">
                        {daysArray.map((day, idx) => {
                            if (!day) return <div key={idx} className="p-2"></div>;

                            const formattedDay = String(day).padStart(2, '0');
                            const formattedMonth = String(currentMonth + 1).padStart(2, '0');
                            const matchDateStr = `${currentYear}-${formattedMonth}-${formattedDay}`;

                            const isToday = day === currentDay;
                            const examMatch = examDates.find(e => e.dateStr === matchDateStr);

                            let cellStyle = "bg-slate-50 text-slate-700 hover:bg-purple-50";

                            if (isToday && examMatch) {
                                cellStyle = "bg-gradient-to-tr from-amber-500 to-brand-600 text-white font-extrabold shadow-lg ring-2 ring-amber-300 ring-offset-2";
                            } else if (isToday) {
                                cellStyle = "bg-gradient-to-tr from-amber-400 to-amber-500 text-slate-900 font-black shadow-md ring-2 ring-amber-300 ring-offset-1";
                            } else if (examMatch) {
                                cellStyle = "bg-brand-600 text-white font-bold shadow-md shadow-brand-500/30";
                            }

                            return (
                                <div 
                                    key={idx} 
                                    className={`group relative p-2.5 rounded-2xl flex flex-col items-center justify-center transition-all cursor-pointer ${cellStyle}`}>
                                    <span>{day}</span>
                                    {isToday && <span className="text-[8px] font-black uppercase leading-tight mt-0.5">HOY</span>}
                                    {examMatch && !isToday && <span className="w-1.5 h-1.5 bg-white rounded-full mt-1"></span>}

                                    {/* TOOLTIP HOVER PARA EXÁMENES */}
                                    {examMatch && (
                                        <div className="absolute bottom-full mb-2 hidden group-hover:flex flex-col items-center z-50 w-32">
                                            <div className="bg-slate-900 text-white text-[10px] font-bold p-2 rounded-xl shadow-xl text-center space-y-0.5">
                                                <p className="text-amber-300 uppercase">📅 Examen</p>
                                                <p className="text-white truncate">{examMatch.name}</p>
                                            </div>
                                            <div className="w-2 h-2 bg-slate-900 rotate-45 -mt-1"></div>
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        // --- APP PRINCIPAL ---
        function App() {
            // Persistencia
            const [registeredUsers, setRegisteredUsers] = useState(() => JSON.parse(localStorage.getItem('memorai_users') || '[]'));
            const [user, setUser] = useState(() => JSON.parse(localStorage.getItem('memorai_current_user') || 'null'));
            const [subjects, setSubjects] = useState(() => JSON.parse(localStorage.getItem('memorai_subjects') || '[]'));
            const [publicExams, setPublicExams] = useState(() => JSON.parse(localStorage.getItem('memorai_public_exams') || '[]'));
            const [savedExams, setSavedExams] = useState(() => JSON.parse(localStorage.getItem('memorai_saved_exams') || '[]'));

            useEffect(() => localStorage.setItem('memorai_users', JSON.stringify(registeredUsers)), [registeredUsers]);
            useEffect(() => user ? localStorage.setItem('memorai_current_user', JSON.stringify(user)) : localStorage.removeItem('memorai_current_user'), [user]);
            useEffect(() => localStorage.setItem('memorai_subjects', JSON.stringify(subjects)), [subjects]);
            useEffect(() => localStorage.setItem('memorai_public_exams', JSON.stringify(publicExams)), [publicExams]);
            useEffect(() => localStorage.setItem('memorai_saved_exams', JSON.stringify(savedExams)), [savedExams]);

            const [activeTab, setActiveTab] = useState('dashboard');
            const [selectedSubjectId, setSelectedSubjectId] = useState(null);
            
            // Auth
            const [authMode, setAuthMode] = useState('login');
            const [authError, setAuthError] = useState('');
            const [formData, setFormData] = useState({ fullName: '', email: '', password: '', university: '', degree: '' });

            // Modales
            const [showModal, setShowModal] = useState(false);
            const [subjectNameInput, setSubjectNameInput] = useState('');
            const [subjectExamDateInput, setSubjectExamDateInput] = useState('');

            const [isExtractingPDF, setIsExtractingPDF] = useState(false);

            // Modal Configurador Examen
            const [showExamConfigModal, setShowExamConfigModal] = useState(false);
            const [examConfig, setExamConfig] = useState({ format: 'test', questionCount: 15, subjectId: null, topicScope: 'all', isMath: false });

            // Modal Resumen
            const [showSummaryModal, setShowSummaryModal] = useState(false);
            const [summaryType, setSummaryType] = useState('short');
            const [summaryTopicScope, setSummaryTopicScope] = useState('all');
            const [generatedSummary, setGeneratedSummary] = useState('');

            // Estado del Examen
            const [currentTest, setCurrentTest] = useState(null);
            const [currentSubjectName, setCurrentSubjectName] = useState('General');
            const [isPublic, setIsPublic] = useState(false);
            const [userAnswers, setUserAnswers] = useState({});
            const [testSubmitted, setTestSubmitted] = useState(false);

            // OCR Foto de Folio Escrito a Mano (Ciencias / Mates)
            const [ocrScanning, setOcrScanning] = useState(false);
            const [uploadedFolioImg, setUploadedFolioImg] = useState(null);

            const handleAuthInput = (e) => {
                setAuthError('');
                setFormData({ ...formData, [e.target.name]: e.target.value });
            };

            const handleAuthSubmit = (e) => {
                e.preventDefault();
                setAuthError('');
                const cleanEmail = formData.email.trim().toLowerCase();

                if (authMode === 'register') {
                    if (registeredUsers.some(u => u.email.toLowerCase() === cleanEmail)) {
                        setAuthError('Este correo ya está registrado.');
                        return;
                    }
                    const newUser = { name: formData.fullName.trim() || 'Estudiante', email: cleanEmail, password: formData.password, university: formData.university || 'Universidad General', degree: formData.degree.trim() || 'Grado' };
                    setRegisteredUsers(prev => [...prev, newUser]);
                    setUser(newUser);
                    setActiveTab('dashboard');
                } else {
                    const foundUser = registeredUsers.find(u => u.email.toLowerCase() === cleanEmail);
                    if (!foundUser || foundUser.password !== formData.password) {
                        setAuthError('Correo o contraseña incorrectos.');
                        return;
                    }
                    setUser(foundUser);
                    setActiveTab('dashboard');
                }
            };

            const handleLogoClick = () => {
                if (user) {
                    setActiveTab('dashboard');
                    setSelectedSubjectId(null);
                }
            };

            const handleAddSubject = (e) => {
                e.preventDefault();
                if (!subjectNameInput.trim()) return;
                const newSub = { id: String(Date.now()), name: subjectNameInput.trim(), examDate: subjectExamDateInput || 'Sin fecha', topics: [] };
                setSubjects(prev => [...prev, newSub]);
                setSubjectNameInput(''); setSubjectExamDateInput(''); setShowModal(false);
            };

            const handleDeleteSubject = (id) => {
                setSubjects(prev => prev.filter(s => s.id !== id));
                if (selectedSubjectId === id) setSelectedSubjectId(null);
            };

            // SUBIDA DE PDF POR ASIGNATURA
            const handleFileUploadToSubject = (e, subjectId) => {
                const file = e.target.files && e.target.files[0];
                if (!file || file.type !== 'application/pdf') {
                    alert("Selecciona un PDF válido.");
                    return;
                }

                setIsExtractingPDF(true);
                const reader = new FileReader();

                reader.onload = async function() {
                    try {
                        const typedarray = new Uint8Array(this.result);
                        const pdf = await pdfjsLib.getDocument(typedarray).promise;
                        let pagesData = [];

                        for (let i = 1; i <= pdf.numPages; i++) {
                            const page = await pdf.getPage(i);
                            const textContent = await page.getTextContent();
                            pagesData.push({ pageNum: i, text: textContent.items.map(item => item.str).join(' ') });
                        }

                        const newTopic = { id: String(Date.now()), fileName: file.name, uploadDate: new Date().toLocaleDateString('es-ES'), pageCount: pdf.numPages, pages: pagesData };
                        setSubjects(prev => prev.map(sub => sub.id === subjectId ? { ...sub, topics: [...(sub.topics || []), newTopic] } : sub));
                    } catch (error) {
                        alert("Error al procesar el PDF.");
                    } finally {
                        setIsExtractingPDF(false);
                    }
                };

                reader.readAsArrayBuffer(file);
            };

            // RESÚMENES EXTENSOS Y PROFUNDOS EN CONDICIONES
            const handleGenerateSummary = () => {
                const targetSub = subjects.find(s => s.id === selectedSubjectId);
                if (!targetSub || !targetSub.topics || targetSub.topics.length === 0) {
                    alert("Sube al menos un PDF a esta asignatura.");
                    return;
                }

                let sourceTopics = summaryTopicScope === 'all' 
                    ? targetSub.topics 
                    : targetSub.topics.filter(t => t.id === summaryTopicScope);

                let fullText = sourceTopics.flatMap(t => t.pages.map(p => p.text)).join(" ");
                if (!fullText.trim()) { alert("No hay texto en el temario."); return; }

                const len = fullText.length;
                const snippetA = fullText.substring(0, Math.min(len, 400));
                const snippetB = fullText.substring(Math.floor(len / 2), Math.floor(len / 2) + 400);

                let summaryResult = "";

                if (summaryType === 'short') {
                    summaryResult = `📌 RESUMEN COMPLETO (ASIGNATURA: ${targetSub.name})\n\n1. INTRODUCCIÓN Y FUNDAMENTOS:\nEl temario profundiza en los aspectos teóricos e históricos esenciales. A lo largo del documento se establece que: "${snippetA}..."\n\n2. NÚCLEO CONCEPTUAL:\n- Eje de Aprendizaje: Análisis exhaustivo de variables interrelacionadas.\n- Desarrollo Metodológico: Aplicación de modelos en casos prácticos expuestos en el temario.\n- Continuidad: "${snippetB}..."\n\n3. CONCLUSIONES CLAVE PARA EXAMEN:\nSe exige dominar la definición formal, el procedimiento analítico y la justificación crítica en las evaluaciones.`;
                } else if (summaryType === 'medium') {
                    summaryResult = `📖 RESUMEN DETALLADO EXTENSO (ASIGNATURA: ${targetSub.name})\n\nBLOQUE 1: MARCO TEÓRICO Y CONCEPTUAL\nEl estudio se fundamenta en los principios normativos y funcionales desarrollados a lo largo del temario. Se subraya que: "${snippetA}..."\n\nBLOQUE 2: DESARROLLO METODOLÓGICO Y ESTRUCTURA\n- Punto 2.1: Definición de variables clave y taxonomía del tema.\n- Punto 2.2: Interacción de componentes teóricos y fórmulas asociadas.\n- Punto 2.3: Anotaciones relevantes extraídas: "${snippetB}..."\n\nBLOQUE 3: CASOS DE APLICACIÓN Y EJERCICIOS\nSe analiza la resolución paso a paso según los estándares académicos requeridos.\n\nBLOQUE 4: SÍNTESIS FINAL\nGuía completa para la preparación del examen oficial.`;
                } else if (summaryType === 'keywords') {
                    summaryResult = `🔑 GLOSARIO EXTENSO DE CONCEPTOS CLAVE (${targetSub.name})\n\n• Concepto 1: Fundamento Teórico Base ("${snippetA.substring(0, 100)}...")\n• Concepto 2: Metodología Analítica Aplicada\n• Concepto 3: Variables de Interacción y Fórmulas\n• Concepto 4: Procedimiento Operativo ("${snippetB.substring(0, 100)}...")\n• Concepto 5: Conclusiones Evaluables para Examen`;
                } else if (summaryType === 'schema') {
                    summaryResult = `🧠 ESQUEMA CONCEPTUAL ESTRUCTURADO COMPLETO (${targetSub.name})\n\n[ UNIDAD ACADÉMICA PRINCIPAL ]\n ├── 1. NÚCLEO DE TEORÍA Y DEFINICIONES\n │    ├── 1.1 Contexto Inicial ("${snippetA.substring(0, 80)}...")\n │    └── 1.2 Principios Directores\n ├── 2. DESARROLLO TÉCNICO Y METODOLÓGICO\n │    ├── 2.1 Procedimiento de Análisis\n │    └── 2.2 Evidencia y Justificación ("${snippetB.substring(0, 80)}...")\n └── 3. EVALUACIÓN Y APLICACIÓN DE EXAMEN`;
                }

                setGeneratedSummary(summaryResult);
                setShowSummaryModal(true);
            };

            const downloadSummaryPDF = () => {
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                doc.setFont("Helvetica", "bold");
                doc.setFontSize(16);
                doc.text(`MemorAI - Resumen Completo de ${selectedSubject ? selectedSubject.name : ''}`, 14, 20);
                doc.setFontSize(10);
                doc.setFont("Helvetica", "normal");
                const splitText = doc.splitTextToSize(generatedSummary, 180);
                doc.text(splitText, 14, 32);
                doc.save(`Resumen_${selectedSubject ? selectedSubject.name : 'Apuntes'}.pdf`);
            };

            // GENERAR EXAMEN CON CONFIGURACIÓN O MODALIDAD CIENCIAS
            const handleGenerateExamFromConfig = () => {
                const targetSub = subjects.find(s => s.id === examConfig.subjectId);
                if (!targetSub || !targetSub.topics || targetSub.topics.length === 0) {
                    alert("Sube al menos un PDF primero.");
                    setShowExamConfigModal(false);
                    return;
                }

                setCurrentSubjectName(targetSub.name);
                let sourceTopics = examConfig.topicScope === 'all' ? targetSub.topics : targetSub.topics.filter(t => t.id === examConfig.topicScope);
                let allPages = [];
                sourceTopics.forEach(t => t.pages.forEach(p => allPages.push({ fileName: t.fileName, pageNum: p.pageNum, text: p.text })));

                const count = parseInt(examConfig.questionCount) || 15;
                let generatedQuestions = [];

                for (let i = 1; i <= count; i++) {
                    const randomPage = allPages[Math.floor(Math.random() * allPages.length)];
                    const shortText = randomPage.text.length > 30 ? randomPage.text.substring(0, 90) : "conceptos analizados";

                    let type = examConfig.isMath ? 'math' : (examConfig.format === 'mixed' ? ['test', 'short', 'long'][i % 3] : examConfig.format);

                    if (type === 'math') {
                        generatedQuestions.push({
                            id: i, type: 'math',
                            question: `Problema Práctico #${i}: Resuelva la ecuación/ejercicio derivado de: "${shortText.substring(0, 50)}..."`,
                            idealAnswer: `Paso 1: Identificación de variables. Paso 2: Sustitución en la fórmula general. Resultado correcto evaluado.`,
                            sourceFile: randomPage.fileName, sourcePage: randomPage.pageNum
                        });
                    } else if (type === 'test') {
                        generatedQuestions.push({
                            id: i, type: 'test',
                            question: `¿Qué conclusión teórica se deduce de: "${shortText.substring(0, 50)}..."?`,
                            options: [
                                `Establece la estructura analítica principal descrita en el temario.`,
                                `Contradice las premisas metodológicas tradicionales.`,
                                `Aplica exclusivamente a modelos experimentales secundarios.`,
                                `Invalida los fundamentos expresados en las normas del curso.`
                            ],
                            correct: 0,
                            explanation: `Derivado directamente del temario de estudio.`,
                            sourceFile: randomPage.fileName, sourcePage: randomPage.pageNum
                        });
                    } else {
                        generatedQuestions.push({
                            id: i, type: type,
                            question: `Desarrolle la respuesta referente a: "${shortText.substring(0, 60)}..."`,
                            idealAnswer: `La respuesta debe argumentar el marco teórico e implicaciones del texto.`,
                            sourceFile: randomPage.fileName, sourcePage: randomPage.pageNum
                        });
                    }
                }

                setCurrentTest(generatedQuestions);
                setUserAnswers({});
                setTestSubmitted(false);
                setUploadedFolioImg(null);
                setShowExamConfigModal(false);
                setActiveTab('generator');
            };

            // PROCESAR FOTO DE FOLIO ESCRITO A MANO CON OCR (TESSERACT.JS)
            const handleFolioPhotoUpload = (e) => {
                const file = e.target.files && e.target.files[0];
                if (!file) return;

                setOcrScanning(true);
                setUploadedFolioImg(URL.createObjectURL(file));

                Tesseract.recognize(file, 'spa', { logger: m => console.log(m) })
                    .then(({ data: { text } }) => {
                        console.log("OCR Extraído:", text);
                        setUserAnswers(prev => ({ ...prev, folioOcrText: text }));
                    })
                    .catch(err => console.error("OCR Error:", err))
                    .finally(() => setOcrScanning(false));
            };

            const downloadExamPDF = () => {
                if (!currentTest) return;
                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();
                
                doc.setFont("Helvetica", "bold");
                doc.setFontSize(16);
                doc.text(`MemorAI: Examen de ${currentSubjectName}`, 14, 20);
                doc.setFontSize(10);
                doc.setFont("Helvetica", "normal");
                doc.text(`Nombre del Alumno: ________________________   Fecha: _________`, 14, 28);
                
                let y = 40;
                currentTest.forEach((q, idx) => {
                    if (y > 270) { doc.addPage(); y = 20; }
                    doc.setFont("Helvetica", "bold");
                    doc.text(`${idx + 1}. ${q.question}`, 14, y);
                    y += 6;

                    if (q.type === 'test') {
                        doc.setFont("Helvetica", "normal");
                        q.options.forEach((opt, oIdx) => {
                            doc.text(`   [  ] ${String.fromCharCode(65 + oIdx)}) ${opt.substring(0, 75)}`, 14, y);
                            y += 6;
                        });
                    } else if (q.type === 'math') {
                        doc.text(`   [ Realice las operaciones en un folio y suba la foto para la corrección por IA ]`, 14, y);
                        y += 18;
                    } else {
                        y += 12;
                    }
                    y += 4;
                });

                doc.save(`Examen_${currentSubjectName}_Imprimir.pdf`);
            };

            // FINALIZAR Y GUARDAR EXAMEN EN HISTORIAL Y COMUNIDAD
            const handleFinishTest = () => {
                setTestSubmitted(true);
                
                const newSavedExam = {
                    id: String(Date.now()),
                    subjectId: selectedSubjectId || (subjects[0] ? subjects[0].id : '1'),
                    subjectName: currentSubjectName,
                    date: new Date().toLocaleDateString('es-ES'),
                    score: calculateScore(),
                    questionsCount: currentTest.length
                };

                setSavedExams(prev => [newSavedExam, ...prev]);

                // PUBLICAR EN LA COMUNIDAD SI SE MARCA PÚBLICO
                if (isPublic) {
                    const newPublicExam = {
                        id: String(Date.now()),
                        title: `Examen Oficial de ${currentSubjectName}`,
                        university: user ? user.university : "Universidad General",
                        subject: currentSubjectName,
                        author: user ? user.name : "Estudiante MemorAI",
                        questions: currentTest.length
                    };
                    setPublicExams(prev => [newPublicExam, ...prev]);
                }
            };

            const selectedSubject = subjects.find(s => s.id === selectedSubjectId);

            return (
                <div className="flex-1 flex flex-col min-h-screen">
                    {/* NAV BAR */}
                    <nav className="bg-white/90 backdrop-blur-md border-b border-purple-100 sticky top-0 z-40 shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex justify-between h-16 items-center">
                                <div className="flex items-center space-x-2 font-bold text-xl cursor-pointer group" onClick={handleLogoClick}>
                                    <div className="bg-gradient-to-tr from-brand-600 to-amber-500 text-white p-2.5 rounded-2xl flex items-center justify-center shadow-lg shadow-brand-500/30 group-hover:scale-105 transition">
                                        <Icon name="brain" className="w-6 h-6" />
                                    </div>
                                    <span className="text-brand-900 tracking-tight text-2xl font-black">Memor<span className="text-brand-600">AI</span></span>
                                </div>

                                {user && (
                                    <div className="flex items-center space-x-2 sm:space-x-4">
                                        <button onClick={() => { setActiveTab('dashboard'); setSelectedSubjectId(null); }} className={`px-3.5 py-2 rounded-xl text-xs font-bold transition ${activeTab === 'dashboard' ? 'bg-brand-100 text-brand-800' : 'text-slate-600 hover:text-brand-600'}`}>
                                            Panel
                                        </button>
                                        <button onClick={() => setActiveTab('generator')} className={`px-3.5 py-2 rounded-xl text-xs font-bold transition ${activeTab === 'generator' ? 'bg-brand-100 text-brand-800' : 'text-slate-600 hover:text-brand-600'}`}>
                                            Simulador / Test
                                        </button>
                                        <button onClick={() => setActiveTab('community')} className={`px-3.5 py-2 rounded-xl text-xs font-bold transition ${activeTab === 'community' ? 'bg-brand-100 text-brand-800' : 'text-slate-600 hover:text-brand-600'}`}>
                                            Comunidad ({publicExams.length})
                                        </button>

                                        <div className="pl-3 border-l border-slate-200 flex items-center space-x-3">
                                            <div className="hidden md:block text-right">
                                                <div className="text-xs font-extrabold text-slate-800 flex items-center justify-end space-x-1">
                                                    <span>{user.name}</span>
                                                    <Icon name="user" className="w-3.5 h-3.5 text-brand-600" />
                                                </div>
                                                <div className="text-[11px] text-slate-500 font-medium truncate max-w-[140px]">{user.degree}</div>
                                            </div>

                                            <button onClick={() => setUser(null)} className="p-2 text-slate-400 hover:text-red-500 rounded-xl hover:bg-red-50 transition" title="Cerrar Sesión">
                                                <Icon name="log-out" className="w-5 h-5" />
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </nav>

                    {/* VISTAS */}
                    <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
                        {!user ? (
                            /* LANDING */
                            <div className="py-8 max-w-4xl mx-auto space-y-8">
                                <div className="text-center space-y-4">
                                    <div className="inline-flex items-center space-x-2 bg-gradient-to-r from-brand-100 to-amber-100 text-brand-800 px-4 py-1.5 rounded-full text-xs font-bold border border-purple-200 shadow-sm">
                                        <Icon name="sparkles" className="w-4 h-4 text-brand-600" />
                                        <span>Aula Inteligente de Estudio Universitario</span>
                                    </div>
                                    <h1 className="text-4xl sm:text-6xl font-black text-slate-900 tracking-tight">
                                        Memor<span className="text-brand-600">AI</span>: Aprende y Domina
                                    </h1>
                                    <p className="text-base sm:text-lg text-slate-600 max-w-2xl mx-auto font-medium">
                                        Organiza tus asignaturas, sube PDFs, resuelve problemas de matemáticas en papel con corrección OCR por foto y descarga exámene e imprimibles.
                                    </p>
                                </div>

                                {/* ILUSTRACIÓN AMIGABLE DE ESTUDIO */}
                                <div className="flex justify-center">
                                    <img src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=800&q=80" alt="Estudio universitario" className="rounded-3xl shadow-2xl border-4 border-white max-h-64 object-cover" />
                                </div>

                                <div className="bg-white rounded-3xl shadow-2xl border border-purple-100 overflow-hidden max-w-md mx-auto">
                                    <div className="flex border-b border-slate-100 bg-slate-50/50">
                                        <button onClick={() => setAuthMode('login')} className={`flex-1 py-4 text-center font-bold text-xs ${authMode === 'login' ? 'bg-white text-brand-600 border-b-2 border-brand-600' : 'text-slate-500'}`}>Iniciar Sesión</button>
                                        <button onClick={() => setAuthMode('register')} className={`flex-1 py-4 text-center font-bold text-xs ${authMode === 'register' ? 'bg-white text-brand-600 border-b-2 border-brand-600' : 'text-slate-500'}`}>Registrarse</button>
                                    </div>

                                    <form onSubmit={handleAuthSubmit} className="p-6 space-y-4">
                                        {authError && <div className="p-3 bg-red-50 text-red-600 text-xs font-bold rounded-xl">{authError}</div>}

                                        {authMode === 'register' && (
                                            <div>
                                                <label className="block text-xs font-bold text-slate-600 uppercase mb-1">Nombre Completo</label>
                                                <input type="text" name="fullName" required value={formData.fullName} onChange={handleAuthInput} placeholder="Ej. Ana García" className="w-full px-4 py-2.5 rounded-xl border border-purple-100 text-sm" />
                                            </div>
                                        )}

                                        <div>
                                            <label className="block text-xs font-bold text-slate-600 uppercase mb-1">Correo Electrónico</label>
                                            <input type="email" name="email" required value={formData.email} onChange={handleAuthInput} placeholder="tu.email@universidad.edu" className="w-full px-4 py-2.5 rounded-xl border border-purple-100 text-sm" />
                                        </div>

                                        <div>
                                            <label className="block text-xs font-bold text-slate-600 uppercase mb-1">Contraseña</label>
                                            <input type="password" name="password" required value={formData.password} onChange={handleAuthInput} placeholder="••••••••" className="w-full px-4 py-2.5 rounded-xl border border-purple-100 text-sm" />
                                        </div>

                                        <button type="submit" className="w-full py-3.5 bg-gradient-to-r from-brand-600 to-amber-500 text-white font-extrabold rounded-2xl shadow-lg shadow-brand-500/25 text-sm">
                                            {authMode === 'login' ? 'Acceder a mi Aula 🚀' : 'Crear mi Cuenta 🎉'}
                                        </button>
                                    </form>
                                </div>
                            </div>
                        ) : activeTab === 'dashboard' ? (
                            /* DASHBOARD */
                            <div className="space-y-8">
                                <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                                    <div>
                                        <h2 className="text-3xl font-black text-slate-900 tracking-tight">
                                            {selectedSubject ? selectedSubject.name : `¡Hola de nuevo, ${user.name}! 👋`}
                                        </h2>
                                        <p className="text-slate-500 text-sm font-medium mt-1">
                                            {selectedSubject ? `Aprende, resume, resuelve problemas y evalúa tu progreso` : `${user.degree} • ${user.university}`}
                                        </p>
                                    </div>
                                    <div className="flex space-x-3">
                                        {selectedSubject && (
                                            <button onClick={() => setSelectedSubjectId(null)} className="px-4 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-2xl text-xs transition">
                                                Volver a Asignaturas
                                            </button>
                                        )}
                                        <button onClick={() => setShowModal(true)} className="inline-flex items-center space-x-2 bg-gradient-to-r from-brand-600 to-brand-700 text-white px-5 py-2.5 rounded-2xl font-bold shadow-lg shadow-brand-500/20 text-xs transition">
                                            <Icon name="plus" className="w-4 h-4" />
                                            <span>Nueva Asignatura</span>
                                        </button>
                                    </div>
                                </div>

                                {selectedSubject ? (
                                    /* VISTA DE UNA ASIGNATURA SELECCIONADA */
                                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                                        <div className="lg:col-span-2 space-y-6">
                                            {/* TEMARIOS PDF */}
                                            <div className="bg-white p-6 rounded-3xl border border-purple-100 shadow-xl shadow-purple-500/5 space-y-4">
                                                <div className="flex justify-between items-center">
                                                    <h3 className="text-lg font-extrabold text-slate-800 flex items-center space-x-2">
                                                        <Icon name="file-text" className="w-5 h-5 text-brand-600" />
                                                        <span>Temarios / PDFs ({selectedSubject.topics?.length || 0})</span>
                                                    </h3>
                                                    <label htmlFor="pdf-upload" className="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-xl text-xs font-bold cursor-pointer transition shadow inline-flex items-center space-x-2">
                                                        <Icon name="upload-cloud" className="w-4 h-4" />
                                                        <span>{isExtractingPDF ? 'Leyendo...' : 'Subir PDF'}</span>
                                                    </label>
                                                    <input type="file" id="pdf-upload" accept="application/pdf" onChange={(e) => handleFileUploadToSubject(e, selectedSubject.id)} className="hidden" />
                                                </div>

                                                {!selectedSubject.topics || selectedSubject.topics.length === 0 ? (
                                                    <div className="border-2 border-dashed border-purple-200 p-8 rounded-2xl text-center text-slate-400 space-y-2">
                                                        <Icon name="upload-cloud" className="w-10 h-10 mx-auto text-brand-400" />
                                                        <p className="text-sm font-bold text-slate-700">Aún no has subido ningún PDF a esta materia.</p>
                                                    </div>
                                                ) : (
                                                    <div className="space-y-3">
                                                        {selectedSubject.topics.map(t => (
                                                            <div key={t.id} className="p-4 bg-slate-50 rounded-2xl border border-slate-200 flex items-center justify-between">
                                                                <div className="flex items-center space-x-3">
                                                                    <div className="p-2 bg-red-100 text-red-600 rounded-xl">
                                                                        <Icon name="file" className="w-5 h-5" />
                                                                    </div>
                                                                    <div>
                                                                        <h4 className="text-sm font-bold text-slate-800">{t.fileName}</h4>
                                                                        <p className="text-xs text-slate-500">{t.pageCount} Páginas • {t.uploadDate}</p>
                                                                    </div>
                                                                </div>
                                                                <button onClick={() => setSubjects(prev => prev.map(s => s.id === selectedSubject.id ? { ...s, topics: s.topics.filter(tp => tp.id !== t.id) } : s))} className="text-slate-400 hover:text-red-500 p-2">
                                                                    <Icon name="trash-2" className="w-4 h-4" />
                                                                </button>
                                                            </div>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>

                                            {/* HISTORIAL DE EXÁMENES REALIZADOS Y GUARDADOS DE ESTA MATERIA */}
                                            <div className="bg-white p-6 rounded-3xl border border-purple-100 shadow-xl shadow-purple-500/5 space-y-4">
                                                <h3 className="text-lg font-extrabold text-slate-800 flex items-center space-x-2">
                                                    <Icon name="clock" className="w-5 h-5 text-brand-600" />
                                                    <span>Historial de Exámenes Guardados de {selectedSubject.name}</span>
                                                </h3>

                                                {savedExams.filter(e => e.subjectName === selectedSubject.name).length === 0 ? (
                                                    <p className="text-xs text-slate-400 font-medium">Aún no has realizado exámenes para esta materia.</p>
                                                ) : (
                                                    <div className="space-y-2">
                                                        {savedExams.filter(e => e.subjectName === selectedSubject.name).map(ex => (
                                                            <div key={ex.id} className="p-3.5 bg-slate-50 rounded-2xl border border-slate-200 flex justify-between items-center">
                                                                <div>
                                                                    <p className="text-xs font-bold text-slate-800">{ex.subjectName} ({ex.questionsCount} Preguntas)</p>
                                                                    <p className="text-[10px] text-slate-400">Realizado el {ex.date}</p>
                                                                </div>
                                                                <div className="text-right">
                                                                    <span className="text-sm font-black text-brand-600 bg-brand-50 px-3 py-1 rounded-xl border border-brand-200">
                                                                        Nota: {ex.score} / 10
                                                                    </span>
                                                                </div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>
                                        </div>

                                        {/* ACCIONES RESÚMENES Y EXÁMENES */}
                                        <div className="space-y-6">
                                            {/* RESÚMENES EXTENSOS */}
                                            <div className="bg-white p-6 rounded-3xl border border-purple-100 shadow-sm space-y-4">
                                                <h3 className="text-base font-extrabold text-slate-800 flex items-center space-x-2">
                                                    <Icon name="list" className="w-5 h-5 text-brand-600" />
                                                    <span>Resumir Apuntes IA</span>
                                                </h3>
                                                
                                                <div className="space-y-3">
                                                    <div>
                                                        <label className="block text-[11px] font-bold text-slate-600 uppercase mb-1">Elegir Temario</label>
                                                        <select value={summaryTopicScope} onChange={(e) => setSummaryTopicScope(e.target.value)} className="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs font-semibold bg-white">
                                                            <option value="all">📚 Todo el temario completo</option>
                                                            {selectedSubject.topics?.map(t => (
                                                                <option key={t.id} value={t.id}>📄 {t.fileName}</option>
                                                            ))}
                                                        </select>
                                                    </div>

                                                    <div>
                                                        <label className="block text-[11px] font-bold text-slate-600 uppercase mb-1">Formato de Resumen</label>
                                                        <select value={summaryType} onChange={(e) => setSummaryType(e.target.value)} className="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs font-semibold bg-white">
                                                            <option value="short">📌 Resumen Ultra-Extenso</option>
                                                            <option value="medium">📖 Resumen Detallado Completo</option>
                                                            <option value="keywords">🔑 Glosario y Palabras Clave</option>
                                                            <option value="schema">🧠 Esquema Conceptual Extenso</option>
                                                        </select>
                                                    </div>

                                                    <button onClick={handleGenerateSummary} className="w-full py-2.5 bg-brand-50 hover:bg-brand-600 hover:text-white text-brand-700 font-extrabold rounded-xl text-xs transition border border-brand-200 flex items-center justify-center space-x-2">
                                                        <Icon name="sparkles" className="w-4 h-4" />
                                                        <span>Generar Resumen Extenso</span>
                                                    </button>
                                                </div>
                                            </div>

                                            {/* GENERAR EXAMEN TRADICIONAL O DE CIENCIAS */}
                                            <div className="bg-white p-6 rounded-3xl border border-purple-100 shadow-sm space-y-4">
                                                <h3 className="text-base font-extrabold text-slate-800 flex items-center space-x-2">
                                                    <Icon name="brain" className="w-5 h-5 text-brand-600" />
                                                    <span>Generar Examen por IA</span>
                                                </h3>

                                                <button onClick={() => {
                                                    if (!selectedSubject.topics || selectedSubject.topics.length === 0) { alert("Sube al menos un PDF."); return; }
                                                    setExamConfig({ ...examConfig, subjectId: selectedSubject.id, isMath: false });
                                                    setShowExamConfigModal(true);
                                                }} className="w-full py-3 bg-gradient-to-r from-brand-600 to-amber-500 text-white font-extrabold rounded-xl text-xs flex items-center justify-center space-x-2">
                                                    <Icon name="sparkles" className="w-4 h-4" />
                                                    <span>Examen Teórico / Test</span>
                                                </button>

                                                <button onClick={() => {
                                                    if (!selectedSubject.topics || selectedSubject.topics.length === 0) { alert("Sube al menos un PDF."); return; }
                                                    setExamConfig({ ...examConfig, subjectId: selectedSubject.id, isMath: true });
                                                    setShowExamConfigModal(true);
                                                }} className="w-full py-3 bg-slate-800 hover:bg-slate-900 text-white font-extrabold rounded-xl text-xs flex items-center justify-center space-x-2">
                                                    <Icon name="calculator" className="w-4 h-4 text-amber-400" />
                                                    <span>Examen de Ciencias / Mates (Folio)</span>
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                ) : (
                                    /* PANEL GENERAL */
                                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                                        <div className="lg:col-span-2 space-y-4">
                                            <h3 className="text-xl font-black text-slate-900">Mis Asignaturas ({subjects.length})</h3>

                                            {subjects.length === 0 ? (
                                                <div className="bg-white p-12 rounded-3xl border border-dashed border-purple-200 text-center space-y-3">
                                                    <Icon name="book-open" className="w-12 h-12 mx-auto text-brand-400" />
                                                    <p className="text-base font-bold text-slate-800">No tienes asignaturas registradas.</p>
                                                    <button onClick={() => setShowModal(true)} className="px-5 py-2.5 bg-brand-600 text-white font-bold rounded-2xl text-xs shadow-lg shadow-brand-500/20">
                                                        Añadir Primera Asignatura
                                                    </button>
                                                </div>
                                            ) : (
                                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                                    {subjects.map(sub => (
                                                        <div key={sub.id} className="bg-white p-6 rounded-3xl border border-purple-100 shadow-xl shadow-purple-500/5 flex flex-col justify-between hover:border-brand-300 transition space-y-4">
                                                            <div>
                                                                <div className="flex items-start justify-between">
                                                                    <div className="flex items-center space-x-2">
                                                                        <div className="p-2.5 bg-brand-100 text-brand-700 rounded-2xl">
                                                                            <Icon name="book-open" className="w-5 h-5" />
                                                                        </div>
                                                                        <span className="font-black text-slate-900 text-2xl tracking-tight">{sub.name}</span>
                                                                    </div>
                                                                    <button onClick={() => handleDeleteSubject(sub.id)} className="text-slate-300 hover:text-red-500 p-1">
                                                                        <Icon name="trash-2" className="w-4 h-4" />
                                                                    </button>
                                                                </div>

                                                                <div className="bg-purple-50/60 p-3.5 rounded-2xl border border-purple-100 text-xs space-y-1 mt-3">
                                                                    <div className="text-slate-700 font-bold flex items-center">
                                                                        <Icon name="calendar" className="w-4 h-4 text-brand-600 mr-1.5" />
                                                                        <span>Examen: {sub.examDate}</span>
                                                                    </div>
                                                                </div>
                                                            </div>

                                                            <button onClick={() => setSelectedSubjectId(sub.id)} className="w-full py-2.5 bg-brand-50 hover:bg-brand-600 hover:text-white text-brand-700 font-extrabold rounded-2xl text-xs transition flex items-center justify-center space-x-1">
                                                                <span>Gestionar Materia</span>
                                                                <Icon name="chevronRight" className="w-4 h-4" />
                                                            </button>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>

                                        <div className="space-y-6">
                                            <ExamCalendar subjects={subjects} />
                                        </div>
                                    </div>
                                )}
                            </div>
                        ) : activeTab === 'generator' ? (
                            /* SIMULADOR DE EXAMEN */
                            <div className="max-w-3xl mx-auto space-y-6">
                                {!currentTest ? (
                                    <div className="bg-white p-12 rounded-3xl border border-purple-100 text-center shadow-xl space-y-4">
                                        <Icon name="help-circle" className="w-12 h-12 text-brand-400 mx-auto" />
                                        <h3 className="text-xl font-bold text-slate-800">No hay examen en curso</h3>
                                        <button onClick={() => setActiveTab('dashboard')} className="px-6 py-2.5 bg-brand-600 text-white font-bold rounded-2xl text-xs shadow">
                                            Ir a Mis Asignaturas
                                        </button>
                                    </div>
                                ) : (
                                    <>
                                        <div className="bg-white p-6 rounded-3xl border border-purple-100 shadow-sm flex flex-col sm:flex-row items-center justify-between gap-4">
                                            <div>
                                                <h2 className="text-2xl font-black text-slate-900">Examen: {currentSubjectName}</h2>
                                                <p className="text-xs text-slate-500 font-medium">{currentTest.length} Ejercicios • Evaluado por IA</p>
                                            </div>

                                            <div className="flex items-center space-x-2">
                                                <button onClick={downloadExamPDF} className="px-3.5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl text-xs transition flex items-center space-x-1">
                                                    <Icon name="printer" className="w-4 h-4" />
                                                    <span>Descargar Imprimible (PDF)</span>
                                                </button>

                                                <div className="flex items-center space-x-2 bg-slate-50 p-2 rounded-xl border">
                                                    <span className={`text-xs font-bold ${!isPublic ? 'text-brand-600' : 'text-slate-400'}`}>Privado</span>
                                                    <button onClick={() => setIsPublic(!isPublic)} className={`w-10 h-5 flex items-center rounded-full p-1 transition ${isPublic ? 'bg-brand-600 justify-end' : 'bg-slate-300 justify-start'}`}>
                                                        <div className="bg-white w-3.5 h-3.5 rounded-full shadow"></div>
                                                    </button>
                                                    <span className={`text-xs font-bold ${isPublic ? 'text-brand-600' : 'text-slate-400'}`}>Público</span>
                                                </div>
                                            </div>
                                        </div>

                                        {/* ZONA SUBIDA DE FOTO DE FOLIO PARA MATES/CIENCIAS */}
                                        {currentTest.some(q => q.type === 'math') && (
                                            <div className="bg-amber-50 p-6 rounded-3xl border border-amber-200 space-y-3">
                                                <h3 className="font-extrabold text-amber-900 text-sm flex items-center space-x-2">
                                                    <Icon name="camera" className="w-5 h-5 text-amber-600" />
                                                    <span>¿Has resuelto los ejercicios en un folio a mano?</span>
                                                </h3>
                                                <p className="text-xs text-amber-700">Sube la foto de tu folio escrito a mano. Nuestro motor OCR leerá tus operaciones y las corregirá paso a paso.</p>
                                                
                                                <label htmlFor="folio-photo" className="px-4 py-2.5 bg-amber-600 hover:bg-amber-700 text-white font-bold rounded-xl text-xs cursor-pointer inline-flex items-center space-x-2 shadow">
                                                    <Icon name="camera" className="w-4 h-4" />
                                                    <span>{ocrScanning ? 'Escaneando Foto OCR...' : 'Subir Foto de mi Folio'}</span>
                                                </label>
                                                <input type="file" id="folio-photo" accept="image/*" onChange={handleFolioPhotoUpload} className="hidden" />

                                                {uploadedFolioImg && (
                                                    <div className="mt-2">
                                                        <img src={uploadedFolioImg} alt="Folio escaneado" className="max-h-40 rounded-xl border border-amber-300 shadow" />
                                                    </div>
                                                )}
                                            </div>
                                        )}

                                        <div className="space-y-6">
                                            {currentTest.map((q, idx) => (
                                                <div key={q.id} className="bg-white p-6 rounded-3xl border border-purple-100 shadow-sm space-y-4">
                                                    <h3 className="font-extrabold text-slate-800 text-base">
                                                        <span className="text-brand-600 mr-2">{idx + 1}.</span>{q.question}
                                                    </h3>

                                                    {q.type === 'test' ? (
                                                        <div className="space-y-2">
                                                            {q.options.map((opt, oIdx) => (
                                                                <button key={oIdx} onClick={() => handleSelectOption(q.id, oIdx)} className={`w-full text-left p-3.5 rounded-2xl border text-xs transition ${userAnswers[q.id] === oIdx ? 'border-brand-600 bg-brand-50 font-bold' : 'border-slate-200 bg-slate-50'}`}>
                                                                    <span>{opt}</span>
                                                                </button>
                                                            ))}
                                                        </div>
                                                    ) : (
                                                        <textarea rows="3" disabled={testSubmitted} value={userAnswers[q.id] || ''} onChange={(e) => handleSelectOption(q.id, e.target.value)} placeholder="Escribe tu solución o pasos resueltos..." className="w-full p-3 rounded-2xl border border-slate-200 text-xs outline-none focus:ring-2 focus:ring-brand-500" />
                                                    )}

                                                    {testSubmitted && (
                                                        <div className="p-4 bg-purple-50/60 rounded-2xl border border-purple-100 text-xs text-purple-900 space-y-1">
                                                            <div className="font-bold flex items-center space-x-1 text-brand-700">
                                                                <Icon name="file-text" className="w-4 h-4" />
                                                                <span>Localización: {q.sourceFile} — Página {q.sourcePage}</span>
                                                            </div>
                                                        </div>
                                                    )}
                                                </div>
                                            ))}
                                        </div>

                                        {!testSubmitted ? (
                                            <button onClick={handleFinishTest} className="w-full py-4 bg-gradient-to-r from-brand-600 to-amber-500 text-white font-black rounded-2xl shadow-lg shadow-brand-500/25 transition">
                                                Finalizar, Guardar en Historial y Corregir
                                            </button>
                                        ) : (
                                            <div className="bg-slate-900 text-white p-8 rounded-3xl shadow-xl text-center space-y-4">
                                                <h3 className="text-xl font-bold text-slate-200">¡Examen Corregido y Guardado en el Historial!</h3>
                                                <div className="text-5xl font-black text-amber-400">{calculateScore()} / 10</div>
                                                <button onClick={() => setActiveTab('dashboard')} className="px-6 py-2.5 bg-brand-500 text-white font-bold rounded-2xl text-xs">
                                                    Volver al Panel
                                                </button>
                                            </div>
                                        )}
                                    </>
                                )}
                            </div>
                        ) : (
                            /* COMUNIDAD FUNCIONAL PERSISTENTE */
                            <div className="space-y-6">
                                <h2 className="text-3xl font-black text-slate-900 tracking-tight">Banco Comunitario de Exámenes</h2>
                                {publicExams.length === 0 ? (
                                    <div className="bg-white p-12 rounded-3xl border border-dashed border-purple-200 text-center text-slate-400 space-y-2">
                                        <Icon name="book-open" className="w-12 h-12 mx-auto text-brand-300" />
                                        <p className="text-base font-bold text-slate-700">Aún no hay exámenes públicos en la comunidad.</p>
                                    </div>
                                ) : (
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        {publicExams.map((e) => (
                                            <div key={e.id} className="bg-white p-6 rounded-3xl border border-purple-100 shadow-xl shadow-purple-500/5 flex flex-col justify-between space-y-4">
                                                <div>
                                                    <span className="text-[10px] uppercase font-extrabold px-2.5 py-1 bg-brand-100 text-brand-800 rounded-md">{e.subject}</span>
                                                    <h3 className="font-bold text-slate-800 text-base mt-2">{e.title}</h3>
                                                    <p className="text-xs text-slate-500">{e.university} • Creado por {e.author}</p>
                                                </div>
                                                <button onClick={() => handlePracticeExam(e)} className="px-4 py-2.5 bg-brand-50 hover:bg-brand-600 hover:text-white text-brand-700 font-extrabold rounded-2xl text-xs transition flex items-center justify-between">
                                                    <span>Practicar Examen</span>
                                                    <Icon name="arrow-right" className="w-4 h-4" />
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {/* MODAL CONFIGURAR EXAMEN */}
                    {showExamConfigModal && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-purple-100 space-y-4">
                                <div className="flex justify-between items-center border-b pb-3">
                                    <h3 className="text-lg font-bold text-slate-800">Configurar Examen IA</h3>
                                    <button onClick={() => setShowExamConfigModal(false)}><Icon name="x" className="w-5 h-5 text-slate-400" /></button>
                                </div>

                                <div className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-600 uppercase mb-1">Elegir Temario</label>
                                        <select value={examConfig.topicScope} onChange={(e) => setExamConfig({ ...examConfig, topicScope: e.target.value })} className="w-full px-3 py-2.5 rounded-xl border text-xs font-semibold bg-white">
                                            <option value="all">📚 Todo el temario completo</option>
                                            {subjects.find(s => s.id === examConfig.subjectId)?.topics?.map(t => (
                                                <option key={t.id} value={t.id}>📄 {t.fileName}</option>
                                            ))}
                                        </select>
                                    </div>

                                    {!examConfig.isMath && (
                                        <div>
                                            <label className="block text-xs font-bold text-slate-600 uppercase mb-1">Formato</label>
                                            <select value={examConfig.format} onChange={(e) => setExamConfig({ ...examConfig, format: e.target.value })} className="w-full px-3 py-2.5 rounded-xl border text-xs font-semibold bg-white">
                                                <option value="test">Tipo Test</option>
                                                <option value="short">Preguntas Cortas</option>
                                                <option value="long">Preguntas de Desarrollo</option>
                                                <option value="mixed">Examen Mixto</option>
                                            </select>
                                        </div>
                                    )}

                                    <div>
                                        <label className="block text-xs font-bold text-slate-600 uppercase mb-1">Número de Preguntas</label>
                                        <select value={examConfig.questionCount} onChange={(e) => setExamConfig({ ...examConfig, questionCount: e.target.value })} className="w-full px-3 py-2.5 rounded-xl border text-xs font-semibold bg-white">
                                            <option value="10">10 Preguntas</option>
                                            <option value="15">15 Preguntas</option>
                                            <option value="25">25 Preguntas</option>
                                            <option value="30">30 Preguntas</option>
                                        </select>
                                    </div>

                                    <button onClick={handleGenerateExamFromConfig} className="w-full py-3 bg-brand-600 text-white font-extrabold rounded-2xl shadow text-xs">
                                        Generar Examen
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL RESUMEN */}
                    {showSummaryModal && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl max-w-2xl w-full p-6 shadow-2xl border border-purple-100 space-y-4 max-h-[85vh] flex flex-col">
                                <div className="flex justify-between items-center border-b pb-3">
                                    <h3 className="text-lg font-bold text-slate-800 flex items-center space-x-2">
                                        <Icon name="sparkles" className="w-5 h-5 text-brand-600" />
                                        <span>Resumen Extenso Generado por IA</span>
                                    </h3>
                                    <button onClick={() => setShowSummaryModal(false)}><Icon name="x" className="w-5 h-5 text-slate-400" /></button>
                                </div>

                                <div className="flex-1 overflow-y-auto p-4 bg-slate-50 rounded-2xl font-mono text-xs whitespace-pre-wrap text-slate-800 border border-slate-200">
                                    {generatedSummary}
                                </div>

                                <div className="flex justify-between items-center pt-2">
                                    <button onClick={downloadSummaryPDF} className="px-4 py-2.5 bg-emerald-600 text-white font-bold rounded-2xl text-xs shadow flex items-center space-x-2">
                                        <Icon name="download" className="w-4 h-4" />
                                        <span>Descargar en PDF</span>
                                    </button>
                                    <button onClick={() => setShowSummaryModal(false)} className="px-5 py-2.5 bg-slate-200 text-slate-700 font-bold rounded-2xl text-xs">
                                        Cerrar
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL ASIGNATURA */}
                    {showModal && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl border border-purple-100 space-y-4">
                                <div className="flex justify-between items-center border-b pb-3">
                                    <h3 className="text-lg font-bold text-slate-800">Nueva Asignatura</h3>
                                    <button onClick={() => setShowModal(false)}><Icon name="x" className="w-5 h-5 text-slate-400" /></button>
                                </div>

                                <form onSubmit={handleAddSubject} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-bold text-slate-600 uppercase mb-1">Nombre de la Asignatura</label>
                                        <input type="text" required value={subjectNameInput} onChange={(e) => setSubjectNameInput(e.target.value)} placeholder="Ej. Matemáticas, Farmacología..." className="w-full px-4 py-2.5 rounded-xl border text-sm" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-slate-600 uppercase mb-1">Fecha de Examen</label>
                                        <input type="date" value={subjectExamDateInput} onChange={(e) => setSubjectExamDateInput(e.target.value)} className="w-full px-4 py-2.5 rounded-xl border text-sm bg-white" />
                                    </div>
                                    <button type="submit" className="w-full py-3 bg-brand-600 text-white font-extrabold rounded-2xl shadow text-xs">
                                        Guardar Asignatura
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    <footer className="bg-white border-t border-purple-100 py-6 mt-12">
                        <div className="max-w-7xl mx-auto px-4 text-center text-xs text-slate-400">
                            MemorAI © 2026 — Tu Aula Inteligente con Repetición Espaciada e IA.
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
