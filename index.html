<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MemorAI: Tu Aula Inteligente</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            200: '#ddd6fe',
                            300: '#c4b5fd',
                            400: '#a78bfa',
                            500: '#8b5cf6',
                            600: '#7c3aed',
                            700: '#6d28d9',
                            800: '#5b21b6',
                            900: '#4c1d95',
                        }
                    }
                }
            }
        }
    </script>

    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel para JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- PDF.js para lectura real de archivos PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <div id="root" class="flex-1 flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, Component } = React;

        // --- LÍMITE DE ERRORES (Evita que cualquier vista rompa la web) ---
        class ErrorBoundary extends Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false };
            }

            static getDerivedStateFromError(error) {
                return { hasError: true };
            }

            componentDidCatch(error, errorInfo) {
                console.error("Error capturado en MemorAI:", error, errorInfo);
            }

            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen flex flex-col items-center justify-center p-6 text-center bg-slate-50">
                            <div className="bg-white p-8 rounded-2xl shadow-xl border border-red-100 max-w-md w-full space-y-4">
                                <div className="w-12 h-12 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto">
                                    <i data-lucide="alert-triangle" className="w-6 h-6"></i>
                                </div>
                                <h2 className="text-xl font-bold text-slate-800">Ocurrió un contratiempo</h2>
                                <p className="text-sm text-slate-500">Se produjo un error al procesar esta vista. Puedes recargar la aplicación sin perder la sesión.</p>
                                <button 
                                    onClick={() => window.location.reload()} 
                                    className="w-full py-2.5 bg-brand-600 text-white font-semibold rounded-xl text-sm hover:bg-brand-700 transition">
                                    Reintentar / Volver a Cargar
                                </button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        // --- Componente de Iconos Lucide ---
        const Icon = ({ name, className = "w-5 h-5" }) => {
            useEffect(() => {
                try {
                    if (window.lucide) {
                        window.lucide.createIcons();
                    }
                } catch (e) {}
            }, [name]);
            return <i data-lucide={name} className={className}></i>;
        };

        // --- Datos Iniciales Simulados para la Comunidad ---
        const initialPublicExams = [
            { id: 1, title: "Anatomía Humana - Sistema Nervioso", university: "Universidad Complutense de Madrid", subject: "Anatomía", author: "Laura M.", questions: 3, rating: 4.8 },
            { id: 2, title: "Derecho Civil: Contratos y Obligaciones", university: "Universidad de Barcelona", subject: "Derecho Civil", author: "Carlos R.", questions: 3, rating: 4.5 },
            { id: 3, title: "Cálculo Multivariable - Parcial 1", university: "Universidad Politécnica de Valencia", subject: "Matemáticas", author: "Alex G.", questions: 3, rating: 4.9 },
            { id: 4, title: "Principios de Microeconomía", university: "Universidad de Sevilla", subject: "Economía", author: "Elena P.", questions: 3, rating: 4.2 }
        ];

        // --- Cuestionario de ejemplo genérico ---
        const sampleQuestions = [
            {
                id: 1,
                question: "¿Cuál es la función principal de la repetición espaciada en el aprendizaje?",
                options: [
                    "Sintetizar grandes volúmenes de texto de forma automática",
                    "Aplanar la curva del olvido repasando en intervalos óptimos",
                    "Sustituir la lectura comprensiva por memorización pasiva",
                    "Eliminar la necesidad de realizar evaluaciones periódicas"
                ],
                correct: 1,
                explanation: "La repetición espaciada distribuye los repasos en el tiempo para contrarrestar la curva del olvido de Ebbinghaus, consolidando la información en la memoria a largo plazo."
            },
            {
                id: 2,
                question: "¿Qué estructura es fundamental para la consolidación de nuevas memorias episódicas?",
                options: [
                    "Cerebelo",
                    "Corteza Motora",
                    "Hipocampo",
                    "Lóbulo Occipital"
                ],
                correct: 2,
                explanation: "El hipocampo desempeña un papel crucial en la formación y consolidación de la memoria declarativa (episódica y semántica)."
            },
            {
                id: 3,
                question: "¿Qué beneficio principal ofrece la evaluación interactiva inmediata (Active Recall)?",
                options: [
                    "Evita el esfuerzo mental durante las sesiones de estudio",
                    "Fortalece las conexiones neuronales al recuperar activamente la información",
                    "Garantiza el aprobado sin necesidad de repaso previo",
                    "Permite estudiar únicamente la noche anterior al examen"
                ],
                correct: 1,
                explanation: "El recuerdo activo (Active Recall) fuerza al cerebro a recuperar datos guardados, fortaleciendo la retención con mayor eficacia que la relectura pasiva."
            }
        ];

        // --- APP PRINCIPAL ---
        function App() {
            // Estado de Usuario
            const [user, setUser] = useState(null);
            const [activeTab, setActiveTab] = useState('dashboard');
            
            // Estado de Autenticación
            const [authMode, setAuthMode] = useState('login');
            const [formData, setFormData] = useState({
                fullName: '',
                email: '',
                password: '',
                university: '',
                customUniversity: '',
                degree: ''
            });

            // Estado de Asignaturas
            const [subjects, setSubjects] = useState([]); 
            const [showModal, setShowModal] = useState(false);
            
            // Formulario para añadir asignatura con fecha de examen
            const [subjectNameInput, setSubjectNameInput] = useState('');
            const [subjectExamDateInput, setSubjectExamDateInput] = useState('');
            const [subjectExamTypeInput, setSubjectExamTypeInput] = useState('Examen Parcial');

            // Estado de Carga de Apuntes
            const [notesText, setNotesText] = useState('');
            const [isExtractingPDF, setIsExtractingPDF] = useState(false);

            // Estado del Examen / Test
            const [currentTest, setCurrentTest] = useState(null);
            const [currentSubjectName, setCurrentSubjectName] = useState('General');
            const [isPublic, setIsPublic] = useState(false);
            const [userAnswers, setUserAnswers] = useState({});
            const [testSubmitted, setTestSubmitted] = useState(false);

            // Estado del Banco Comunitario
            const [publicExams, setPublicExams] = useState(initialPublicExams);
            const [searchQuery, setSearchQuery] = useState('');
            const [filterUniversity, setFilterUniversity] = useState('');

            // Manejo de Inputs de Auth
            const handleAuthInput = (e) => {
                setFormData({ ...formData, [e.target.name]: e.target.value });
            };

            // Login / Registro Submit
            const handleAuthSubmit = (e) => {
                e.preventDefault();
                let finalUniversity = formData.university;
                if (formData.university === 'Otra universidad (España)' || formData.university === 'Universidad Extranjera / Internacional') {
                    finalUniversity = formData.customUniversity.trim() || formData.university;
                }

                if (authMode === 'register') {
                    setUser({
                        name: formData.fullName || 'Estudiante',
                        email: formData.email,
                        university: finalUniversity || 'Universidad No Especificada',
                        degree: formData.degree || 'Grado Universitario'
                    });
                } else {
                    setUser({
                        name: formData.email ? formData.email.split('@')[0] : 'Estudiante',
                        email: formData.email,
                        university: finalUniversity || 'Universidad Registrada',
                        degree: 'Grado Universitario'
                    });
                }
                setActiveTab('dashboard');
            };

            // Añadir Asignatura completamente funcional y a prueba de errores
            const handleAddSubject = (e) => {
                e.preventDefault();
                const trimmedName = subjectNameInput.trim();
                if (!trimmedName) return;

                const newSub = {
                    id: String(Date.now()),
                    name: trimmedName,
                    examDate: subjectExamDateInput || 'Sin fecha',
                    examType: subjectExamTypeInput || 'Examen'
                };

                setSubjects(prev => [...prev, newSub]);
                setSubjectNameInput('');
                setSubjectExamDateInput('');
                setSubjectExamTypeInput('Examen Parcial');
                setShowModal(false);
            };

            // Eliminar Asignatura
            const handleDeleteSubject = (id) => {
                setSubjects(prev => prev.filter(s => s.id !== id));
            };

            // Cálculo dinámico de días faltantes
            const getNextExamInfo = () => {
                if (!subjects || subjects.length === 0) return "Sin exámenes";
                
                const validExams = subjects
                    .filter(s => s?.examDate && s.examDate !== 'Sin fecha')
                    .map(s => new Date(s.examDate))
                    .filter(d => !isNaN(d.getTime()) && d >= new Date().setHours(0,0,0,0))
                    .sort((a, b) => a - b);

                if (validExams.length === 0) return "Sin fechas pendientes";

                const diffTime = Math.abs(validExams[0] - new Date());
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)); 
                return `En ${diffDays} día${diffDays === 1 ? '' : 's'}`;
            };

            // Lectura Real de PDF mediante PDF.js
            const handleFileUpload = (e) => {
                const file = e.target.files?.[0];
                if (!file) return;

                if (file.type !== 'application/pdf') {
                    alert("Por favor, selecciona un archivo PDF válido.");
                    return;
                }

                setIsExtractingPDF(true);
                const reader = new FileReader();

                reader.onload = async function() {
                    try {
                        const typedarray = new Uint8Array(this.result);
                        const pdf = await pdfjsLib.getDocument(typedarray).promise;
                        let fullText = '';

                        for (let i = 1; i <= pdf.numPages; i++) {
                            const page = await pdf.getPage(i);
                            const textContent = await page.getTextContent();
                            const pageText = textContent.items.map(item => item.str).join(' ');
                            fullText += `--- Página ${i} ---\n` + pageText + '\n\n';
                        }

                        setNotesText(fullText);
                    } catch (error) {
                        console.error("Error al procesar el PDF:", error);
                        alert("Hubo un error al extraer el texto del PDF. Intenta copiar y pegar el texto manualmente.");
                    } finally {
                        setIsExtractingPDF(false);
                    }
                };

                reader.readAsArrayBuffer(file);
            };

            // Generador de Test Inteligente
            const handleGenerateTest = () => {
                if (!notesText.trim()) {
                    alert("Por favor, sube un archivo PDF o pega texto en el área de apuntes antes de generar el test.");
                    return;
                }

                const currentSub = subjects.length > 0 ? subjects[0].name : 'General';
                setCurrentSubjectName(currentSub);

                const textLines = notesText.split('\n').filter(l => l.trim().length > 20);
                let generatedQuestions = [];

                if (textLines.length >= 3) {
                    generatedQuestions = [
                        {
                            id: 1,
                            question: `Según los apuntes cargados: ¿Cuál de las siguientes afirmaciones refleja mejor el contenido principal?`,
                            options: [
                                textLines[0].substring(0, 80) + '...',
                                "Información no contemplada en el documento de estudio",
                                "Conclusión opuesta a los temas tratados en los apuntes",
                                "Concepto secundario sin relevancia teórica"
                            ],
                            correct: 0,
                            explanation: `Extraído directamente del fragmento de tus apuntes: "${textLines[0].substring(0, 120)}..."`
                        },
                        {
                            id: 2,
                            question: `Respecto al desarrollo analizado en el texto cargado:`,
                            options: [
                                "No se incluye ningún fundamento teórico directo",
                                textLines[Math.floor(textLines.length / 2)].substring(0, 80) + '...',
                                "Se desacredita el marco conceptual tradicional",
                                "Aplica únicamente a casos prácticos aislados"
                            ],
                            correct: 1,
                            explanation: `Basado en la sección intermedia de tus apuntes: "${textLines[Math.floor(textLines.length / 2)].substring(0, 120)}..."`
                        },
                        {
                            id: 3,
                            question: `Al sintetizar los apuntes introducidos, ¿qué elemento clave se destaca?`,
                            options: [
                                "Falta de estructura formal en las definiciones",
                                "Incompatibilidad con los planes de estudio vigentes",
                                textLines[textLines.length - 1].substring(0, 80) + '...',
                                "Ausencia de conceptos evaluables"
                            ],
                            correct: 2,
                            explanation: `Derivado del bloque final de tus apuntes: "${textLines[textLines.length - 1].substring(0, 120)}..."`
                        }
                    ];
                } else {
                    generatedQuestions = sampleQuestions;
                }

                setCurrentTest(generatedQuestions);
                setUserAnswers({});
                setTestSubmitted(false);
                setActiveTab('generator');
            };

            const handlePracticeExam = (exam) => {
                setCurrentSubjectName(exam.subject);
                setCurrentTest(sampleQuestions);
                setUserAnswers({});
                setTestSubmitted(false);
                setActiveTab('generator');
            };

            const handleSelectOption = (qId, optionIdx) => {
                if (testSubmitted) return;
                setUserAnswers(prev => ({ ...prev, [qId]: optionIdx }));
            };

            const calculateScore = () => {
                if (!currentTest) return 0;
                let correctCount = 0;
                currentTest.forEach(q => {
                    if (userAnswers[q.id] === q.correct) correctCount++;
                });
                return Math.round((correctCount / currentTest.length) * 10);
            };

            const handleFinishTest = () => {
                setTestSubmitted(true);
                if (isPublic && currentTest) {
                    const newPublicExam = {
                        id: Date.now(),
                        title: `Examen de ${currentSubjectName}`,
                        university: user ? user.university : "Universidad General",
                        subject: currentSubjectName,
                        author: user ? user.name : "Estudiante MemorAI",
                        questions: currentTest.length,
                        rating: 5.0
                    };
                    setPublicExams(prev => [newPublicExam, ...prev]);
                }
            };

            return (
                <div className="flex-1 flex flex-col min-h-screen">
                    {/* BARRA DE NAVEGACIÓN */}
                    <nav className="bg-white border-b border-purple-100 sticky top-0 z-40 shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex justify-between h-16 items-center">
                                <div className="flex items-center space-x-2 font-bold text-xl cursor-pointer" onClick={() => user && setActiveTab('dashboard')}>
                                    <div className="bg-brand-600 text-white p-2 rounded-xl flex items-center justify-center shadow-md shadow-brand-500/20">
                                        <Icon name="brain" className="w-6 h-6 text-white" />
                                    </div>
                                    <span className="text-brand-900 tracking-tight">Memor<span className="text-brand-600">AI</span></span>
                                </div>

                                {user && (
                                    <div className="flex items-center space-x-1 sm:space-x-4">
                                        <button 
                                            onClick={() => setActiveTab('dashboard')}
                                            className={`px-3 py-2 rounded-lg text-sm font-medium transition ${activeTab === 'dashboard' ? 'bg-brand-50 text-brand-700' : 'text-slate-600 hover:text-brand-600'}`}>
                                            Panel
                                        </button>
                                        <button 
                                            onClick={() => setActiveTab('generator')}
                                            className={`px-3 py-2 rounded-lg text-sm font-medium transition ${activeTab === 'generator' ? 'bg-brand-50 text-brand-700' : 'text-slate-600 hover:text-brand-600'}`}>
                                            Generador / Test
                                        </button>
                                        <button 
                                            onClick={() => setActiveTab('community')}
                                            className={`px-3 py-2 rounded-lg text-sm font-medium transition ${activeTab === 'community' ? 'bg-brand-50 text-brand-700' : 'text-slate-600 hover:text-brand-600'}`}>
                                            Comunidad
                                        </button>
                                        
                                        <div className="pl-4 border-l border-slate-200 flex items-center space-x-3">
                                            <div className="hidden md:block text-right">
                                                <div className="text-xs font-bold text-slate-800">{user.name}</div>
                                                <div className="text-xs text-slate-500 max-w-[150px] truncate" title={`${user.degree} • ${user.university}`}>{user.degree}</div>
                                            </div>
                                            <button 
                                                onClick={() => setUser(null)}
                                                className="p-2 text-slate-400 hover:text-red-500 rounded-lg hover:bg-red-50 transition"
                                                title="Cerrar Sesión">
                                                <Icon name="log-out" className="w-5 h-5" />
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </nav>

                    {/* VISTAS DE LA APLICACIÓN */}
                    <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
                        
                        {/* 1. AUTENTICACIÓN / LANDING */}
                        {!user && (
                            <div className="py-8 max-w-4xl mx-auto">
                                <div className="text-center mb-10">
                                    <div className="inline-flex items-center space-x-2 bg-brand-50 text-brand-700 px-4 py-1.5 rounded-full text-sm font-semibold mb-4 border border-brand-200">
                                        <Icon name="sparkles" className="w-4 h-4 text-brand-600" />
                                        <span>Potenciado con Repetición Espaciada e IA</span>
                                    </div>
                                    <h1 className="text-4xl sm:text-5xl font-extrabold text-slate-900 tracking-tight mb-4">
                                        Memor<span className="text-brand-600">AI</span>: Tu Aula Inteligente
                                    </h1>
                                    <p className="text-lg text-slate-600 max-w-2xl mx-auto">
                                        Domina cualquier examen universitario. Sube tus apuntes en PDF, genera tests interactivos al instante y optimiza tu retención con algoritmos de repaso inteligente.
                                    </p>
                                </div>

                                <div className="bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden max-w-md mx-auto">
                                    <div className="flex border-b border-slate-100">
                                        <button 
                                            onClick={() => setAuthMode('login')}
                                            className={`flex-1 py-4 text-center font-semibold text-sm transition ${authMode === 'login' ? 'bg-white text-brand-600 border-b-2 border-brand-600' : 'bg-slate-50 text-slate-500 hover:text-slate-700'}`}>
                                            Iniciar Sesión
                                        </button>
                                        <button 
                                            onClick={() => setAuthMode('register')}
                                            className={`flex-1 py-4 text-center font-semibold text-sm transition ${authMode === 'register' ? 'bg-white text-brand-600 border-b-2 border-brand-600' : 'bg-slate-50 text-slate-500 hover:text-slate-700'}`}>
                                            Registrarse
                                        </button>
                                    </div>

                                    <form onSubmit={handleAuthSubmit} className="p-6 space-y-4">
                                        {authMode === 'register' && (
                                            <div>
                                                <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Nombre Completo</label>
                                                <input 
                                                    type="text" 
                                                    name="fullName"
                                                    required
                                                    value={formData.fullName} 
                                                    onChange={handleAuthInput} 
                                                    placeholder="Ej. María García" 
                                                    className="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm"
                                                />
                                            </div>
                                        )}

                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Correo Electrónico</label>
                                            <input 
                                                type="email" 
                                                name="email"
                                                required
                                                value={formData.email} 
                                                onChange={handleAuthInput} 
                                                placeholder="tu.email@universidad.edu" 
                                                className="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm"
                                            />
                                        </div>

                                        <div>
                                            <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Contraseña</label>
                                            <input 
                                                type="password" 
                                                name="password"
                                                required
                                                value={formData.password} 
                                                onChange={handleAuthInput} 
                                                placeholder="••••••••" 
                                                className="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm"
                                            />
                                        </div>

                                        {authMode === 'register' && (
                                            <>
                                                <div>
                                                    <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Universidad</label>
                                                    <select 
                                                        name="university"
                                                        value={formData.university}
                                                        onChange={handleAuthInput}
                                                        required
                                                        className="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm bg-white">
                                                        <option value="">Selecciona tu universidad</option>

                                                        <optgroup label="Andalucía">
                                                            <option value="Universidad de Sevilla">Universidad de Sevilla</option>
                                                            <option value="Universidad de Granada">Universidad de Granada</option>
                                                            <option value="Universidad de Málaga">Universidad de Málaga</option>
                                                            <option value="Universidad de Córdoba">Universidad de Córdoba</option>
                                                            <option value="Universidad de Cádiz">Universidad de Cádiz</option>
                                                            <option value="Universidad de Almería">Universidad de Almería</option>
                                                            <option value="Universidad de Huelva">Universidad de Huelva</option>
                                                            <option value="Universidad de Jaén">Universidad de Jaén</option>
                                                            <option value="Universidad Internacional de Andalucía">Universidad Internacional de Andalucía</option>
                                                            <option value="Universidad Pablo de Olavide">Universidad Pablo de Olavide</option>
                                                            <option value="Universidad Loyola Andalucía">Universidad Loyola Andalucía</option>
                                                        </optgroup>

                                                        <optgroup label="Aragón">
                                                            <option value="Universidad de Zaragoza">Universidad de Zaragoza</option>
                                                            <option value="Universidad San Jorge">Universidad San Jorge</option>
                                                        </optgroup>

                                                        <optgroup label="Canarias">
                                                            <option value="Universidad de La Laguna">Universidad de La Laguna</option>
                                                            <option value="Universidad de Las Palmas de Gran Canaria">Universidad de Las Palmas de Gran Canaria</option>
                                                        </optgroup>

                                                        <optgroup label="Cantabria">
                                                            <option value="Universidad de Cantabria">Universidad de Cantabria</option>
                                                            <option value="Universidad Europea del Atlántico">Universidad Europea del Atlántico</option>
                                                        </optgroup>

                                                        <optgroup label="Castilla y León">
                                                            <option value="Universidad de Salamanca">Universidad de Salamanca</option>
                                                            <option value="Universidad de Valladolid">Universidad de Valladolid</option>
                                                            <option value="Universidad de León">Universidad de León</option>
                                                            <option value="Universidad de Burgos">Universidad de Burgos</option>
                                                            <option value="IE University">IE University</option>
                                                        </optgroup>

                                                        <optgroup label="Castilla-La Mancha">
                                                            <option value="Universidad de Castilla-La Mancha">Universidad de Castilla-La Mancha</option>
                                                        </optgroup>

                                                        <optgroup label="Cataluña">
                                                            <option value="Universidad de Barcelona">Universidad de Barcelona</option>
                                                            <option value="Universidad Autónoma de Barcelona">Universidad Autónoma de Barcelona</option>
                                                            <option value="Universidad Politécnica de Cataluña">Universidad Politécnica de Cataluña</option>
                                                            <option value="Universidad Pompeu Fabra">Universidad Pompeu Fabra</option>
                                                            <option value="Universidad Ramon Llull">Universidad Ramon Llull</option>
                                                        </optgroup>

                                                        <optgroup label="Comunidad de Madrid">
                                                            <option value="Universidad Complutense de Madrid">Universidad Complutense de Madrid</option>
                                                            <option value="Universidad Autónoma de Madrid">Universidad Autónoma de Madrid</option>
                                                            <option value="Universidad Politécnica de Madrid">Universidad Politécnica de Madrid</option>
                                                            <option value="Universidad Carlos III de Madrid">Universidad Carlos III de Madrid</option>
                                                            <option value="Universidad de Alcalá">Universidad de Alcalá</option>
                                                            <option value="Universidad Rey Juan Carlos">Universidad Rey Juan Carlos</option>
                                                            <option value="Universidad CEU San Pablo">Universidad CEU San Pablo</option>
                                                            <option value="Universidad Pontificia Comillas">Universidad Pontificia Comillas</option>
                                                            <option value="Universidad Europea de Madrid">Universidad Europea de Madrid</option>
                                                        </optgroup>

                                                        <optgroup label="Comunidad Valenciana">
                                                            <option value="Universidad de Valencia">Universidad de Valencia</option>
                                                            <option value="Universidad Politécnica de Valencia">Universidad Politécnica de Valencia</option>
                                                            <option value="Universidad de Alicante">Universidad de Alicante</option>
                                                            <option value="Universidad Jaume I">Universidad Jaume I</option>
                                                        </optgroup>

                                                        <optgroup label="Galicia">
                                                            <option value="Universidad de Santiago de Compostela">Universidad de Santiago de Compostela</option>
                                                            <option value="Universidad de La Coruña">Universidad de La Coruña</option>
                                                            <option value="Universidad de Vigo">Universidad de Vigo</option>
                                                        </optgroup>

                                                        <optgroup label="País Vasco">
                                                            <option value="Universidad del País Vasco (UPV/EHU)">Universidad del País Vasco (UPV/EHU)</option>
                                                            <option value="Universidad de Deusto">Universidad de Deusto</option>
                                                        </optgroup>

                                                        <optgroup label="Otras opciones">
                                                            <option value="Otra universidad (España)">Otra universidad (España)</option>
                                                            <option value="Universidad Extranjera / Internacional">Universidad Extranjera / Internacional</option>
                                                        </optgroup>
                                                    </select>
                                                </div>

                                                {(formData.university === 'Otra universidad (España)' || formData.university === 'Universidad Extranjera / Internacional') && (
                                                    <div>
                                                        <label className="block text-xs font-semibold text-brand-700 uppercase mb-1">Nombre de tu Universidad</label>
                                                        <input 
                                                            type="text" 
                                                            name="customUniversity"
                                                            required
                                                            value={formData.customUniversity} 
                                                            onChange={handleAuthInput} 
                                                            placeholder="Ej. Harvard, UBA, etc." 
                                                            className="w-full px-4 py-2.5 rounded-xl border border-brand-300 bg-brand-50/40 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm"
                                                        />
                                                    </div>
                                                )}

                                                <div>
                                                    <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Carrera / Grado</label>
                                                    <input 
                                                        type="text" 
                                                        name="degree"
                                                        required
                                                        value={formData.degree} 
                                                        onChange={handleAuthInput} 
                                                        placeholder="Ej. Medicina, Derecho, Ing. Informática, etc." 
                                                        className="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm"
                                                    />
                                                </div>
                                            </>
                                        )}

                                        <button 
                                            type="submit" 
                                            className="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-xl shadow-lg shadow-brand-500/30 transition duration-200 text-sm mt-2">
                                            {authMode === 'login' ? 'Acceder a mi Aula' : 'Crear mi Cuenta'}
                                        </button>
                                    </form>
                                </div>
                            </div>
                        )}

                        {/* 2. PANEL DE ESTUDIANTE (DASHBOARD) */}
                        {user && activeTab === 'dashboard' && (
                            <div className="space-y-8">
                                {/* Saludo */}
                                <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                                    <div>
                                        <h2 className="text-2xl font-extrabold text-slate-900">¡Hola de nuevo, {user.name}! 👋</h2>
                                        <p className="text-slate-500 text-sm">{user.degree} • {user.university}</p>
                                    </div>
                                    <button 
                                        onClick={() => setShowModal(true)}
                                        className="inline-flex items-center space-x-2 bg-brand-600 hover:bg-brand-700 text-white px-4 py-2.5 rounded-xl font-semibold shadow-md shadow-brand-500/20 text-sm transition self-start">
                                        <Icon name="plus" className="w-4 h-4" />
                                        <span>Añadir Asignatura</span>
                                    </button>
                                </div>

                                {/* Métricas */}
                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                                    <div className="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm flex items-center space-x-4">
                                        <div className="p-3 bg-brand-100 text-brand-600 rounded-xl">
                                            <Icon name="trending-up" className="w-6 h-6" />
                                        </div>
                                        <div>
                                            <div className="text-2xl font-bold text-slate-800">
                                                {subjects.length > 0 ? "85%" : "0%"}
                                            </div>
                                            <div className="text-xs text-slate-500 font-medium">Nivel de Dominio Global</div>
                                        </div>
                                    </div>

                                    <div className="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm flex items-center space-x-4">
                                        <div className="p-3 bg-amber-100 text-amber-600 rounded-xl">
                                            <Icon name="calendar" className="w-6 h-6" />
                                        </div>
                                        <div>
                                            <div className="text-2xl font-bold text-slate-800">
                                                {getNextExamInfo()}
                                            </div>
                                            <div className="text-xs text-slate-500 font-medium">Próximo Examen</div>
                                        </div>
                                    </div>

                                    <div className="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm flex items-center space-x-4">
                                        <div className="p-3 bg-orange-100 text-orange-600 rounded-xl">
                                            <Icon name="flame" className="w-6 h-6" />
                                        </div>
                                        <div>
                                            <div className="text-2xl font-bold text-slate-800">1 Día</div>
                                            <div className="text-xs text-slate-500 font-medium">Racha de Estudio</div>
                                        </div>
                                    </div>

                                    <div className="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm flex items-center space-x-4">
                                        <div className="p-3 bg-emerald-100 text-emerald-600 rounded-xl">
                                            <Icon name="clock" className="w-6 h-6" />
                                        </div>
                                        <div>
                                            <div className="text-2xl font-bold text-slate-800">
                                                {currentTest ? "3 Preg." : "0 Preg."}
                                            </div>
                                            <div className="text-xs text-slate-500 font-medium">Repasos Pendientes Hoy</div>
                                        </div>
                                    </div>
                                </div>

                                {/* Lista de Asignaturas */}
                                <div>
                                    <h3 className="text-lg font-bold text-slate-800 mb-3">Mis Asignaturas ({subjects.length})</h3>
                                    {subjects.length === 0 ? (
                                        <div className="bg-white p-6 rounded-2xl border border-dashed border-slate-200 text-center text-slate-400">
                                            <Icon name="book-open" className="w-8 h-8 mx-auto mb-2 text-slate-300" />
                                            <p className="text-sm font-medium">No has añadido asignaturas todavía.</p>
                                            <button 
                                                onClick={() => setShowModal(true)} 
                                                className="mt-3 text-xs text-brand-600 font-bold hover:underline inline-flex items-center space-x-1">
                                                <span>Añade tu primera materia con fecha de examen</span>
                                                <Icon name="arrow-right" className="w-3.5 h-3.5" />
                                            </button>
                                        </div>
                                    ) : (
                                        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                                            {subjects.map((sub) => (
                                                <div key={sub.id} className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between space-y-3">
                                                    <div className="flex items-start justify-between">
                                                        <div className="flex items-center space-x-2">
                                                            <div className="p-2 bg-brand-50 text-brand-600 rounded-lg">
                                                                <Icon name="book-open" className="w-4 h-4" />
                                                            </div>
                                                            <span className="font-bold text-slate-800 text-sm">{sub.name}</span>
                                                        </div>
                                                        <button 
                                                            onClick={() => handleDeleteSubject(sub.id)}
                                                            className="text-slate-300 hover:text-red-500 transition p-1"
                                                            title="Eliminar materia">
                                                            <Icon name="trash-2" className="w-4 h-4" />
                                                        </button>
                                                    </div>

                                                    <div className="bg-slate-50 p-2.5 rounded-xl border border-slate-100 text-xs space-y-1">
                                                        <div className="flex items-center text-slate-600">
                                                            <Icon name="calendar" className="w-3.5 h-3.5 text-brand-500 mr-1.5" />
                                                            <span>Examen: <strong>{sub.examDate !== 'Sin fecha' ? sub.examDate : 'Sin definir'}</strong></span>
                                                        </div>
                                                        <div className="flex items-center text-slate-500">
                                                            <Icon name="tag" className="w-3.5 h-3.5 text-slate-400 mr-1.5" />
                                                            <span>Tipo: {sub.examType}</span>
                                                        </div>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>

                                {/* Carga Real de Apuntes */}
                                <div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-md">
                                    <div className="flex items-center space-x-3 mb-4">
                                        <div className="p-2 bg-brand-50 text-brand-600 rounded-lg">
                                            <Icon name="file-text" className="w-5 h-5" />
                                        </div>
                                        <h3 className="text-lg font-bold text-slate-800">Generar Examen con IA desde Apuntes</h3>
                                    </div>

                                    <div className="space-y-4">
                                        <div className="border-2 border-dashed border-purple-200 rounded-2xl p-6 text-center hover:border-brand-400 transition bg-purple-50/30">
                                            <Icon name="upload-cloud" className="w-10 h-10 text-brand-500 mx-auto mb-2" />
                                            <p className="text-sm font-semibold text-slate-700">Subir archivo PDF con tus temas</p>
                                            <p className="text-xs text-slate-400 mb-3">PDF.js extraerá el texto directamente en tu navegador</p>
                                            
                                            <input 
                                                type="file" 
                                                accept="application/pdf"
                                                onChange={handleFileUpload} 
                                                className="hidden" 
                                                id="file-upload" 
                                            />
                                            <label htmlFor="file-upload" className="px-4 py-2 bg-white border border-slate-200 rounded-lg text-xs font-semibold text-slate-600 hover:bg-slate-50 cursor-pointer shadow-sm inline-block">
                                                {isExtractingPDF ? "Extrayendo texto del PDF..." : "Explorar PDF"}
                                            </label>
                                        </div>

                                        <textarea 
                                            rows="5" 
                                            value={notesText}
                                            onChange={(e) => setNotesText(e.target.value)}
                                            placeholder="Pega aquí el texto de tus apuntes o revisa el contenido extraído de tu PDF..." 
                                            className="w-full p-4 rounded-xl border border-slate-200 focus:ring-2 focus:ring-brand-500 text-sm outline-none">
                                        </textarea>

                                        <button 
                                            onClick={handleGenerateTest}
                                            disabled={isExtractingPDF}
                                            className="w-full sm:w-auto px-6 py-3 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-xl shadow-lg shadow-brand-500/20 transition flex items-center justify-center space-x-2 text-sm">
                                            <Icon name="sparkles" className="w-4 h-4" />
                                            <span>Generar Test con IA</span>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 3. GENERADOR Y SIMULADOR DE TEST */}
                        {user && activeTab === 'generator' && (
                            <div className="max-w-3xl mx-auto space-y-6">
                                {!currentTest ? (
                                    <div className="bg-white p-8 rounded-2xl border border-slate-100 text-center shadow-sm">
                                        <Icon name="help-circle" className="w-12 h-12 text-brand-400 mx-auto mb-3" />
                                        <h3 className="text-xl font-bold text-slate-800 mb-2">No hay ningún test generado en esta sesión</h3>
                                        <p className="text-slate-500 text-sm mb-6">Sube un PDF o pega tus apuntes en el Panel de Control para crear uno personalizado.</p>
                                        <button 
                                            onClick={() => setActiveTab('dashboard')}
                                            className="px-5 py-2.5 bg-brand-600 text-white rounded-xl text-sm font-semibold shadow hover:bg-brand-700 transition">
                                            Ir al Panel de Control
                                        </button>
                                    </div>
                                ) : (
                                    <>
                                        {/* Header del Examen */}
                                        <div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                                            <div>
                                                <h2 className="text-xl font-bold text-slate-800">Simulador de Examen: {currentSubjectName}</h2>
                                                <p className="text-xs text-slate-500">{currentTest.length} Preguntas • Generado inteligentemente</p>
                                            </div>

                                            {/* Selector Examen Público/Privado */}
                                            <div className="flex items-center space-x-3 bg-slate-50 p-2 rounded-xl border border-slate-200 self-start">
                                                <span className={`text-xs font-semibold ${!isPublic ? 'text-brand-600' : 'text-slate-400'}`}>Privado</span>
                                                <button 
                                                    onClick={() => setIsPublic(!isPublic)}
                                                    className={`w-12 h-6 flex items-center rounded-full p-1 transition duration-300 ${isPublic ? 'bg-brand-600 justify-end' : 'bg-slate-300 justify-start'}`}>
                                                    <div className="bg-white w-4 h-4 rounded-full shadow-md"></div>
                                                </button>
                                                <span className={`text-xs font-semibold ${isPublic ? 'text-brand-600' : 'text-slate-400'}`}>Público</span>
                                            </div>
                                        </div>

                                        {/* Cuestionario */}
                                        <div className="space-y-6">
                                            {currentTest.map((q, idx) => (
                                                <div key={q.id} className="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm space-y-4">
                                                    <h3 className="font-bold text-slate-800 text-base">
                                                        <span className="text-brand-600 mr-2">{idx + 1}.</span> 
                                                        {q.question}
                                                    </h3>

                                                    <div className="space-y-2">
                                                        {q.options.map((opt, oIdx) => {
                                                            const isSelected = userAnswers[q.id] === oIdx;
                                                            let btnStyle = "border-slate-200 hover:border-brand-300 bg-slate-50/50";

                                                            if (testSubmitted) {
                                                                if (oIdx === q.correct) {
                                                                    btnStyle = "border-emerald-500 bg-emerald-50 text-emerald-800 font-semibold";
                                                                } else if (isSelected && oIdx !== q.correct) {
                                                                    btnStyle = "border-red-500 bg-red-50 text-red-800";
                                                                }
                                                            } else if (isSelected) {
                                                                btnStyle = "border-brand-600 bg-brand-50 text-brand-900 font-semibold";
                                                            }

                                                            return (
                                                                <button
                                                                    key={oIdx}
                                                                    onClick={() => handleSelectOption(q.id, oIdx)}
                                                                    className={`w-full text-left p-3.5 rounded-xl border text-sm transition flex items-center justify-between ${btnStyle}`}>
                                                                    <span>{opt}</span>
                                                                    {testSubmitted && oIdx === q.correct && <Icon name="check-circle" className="w-5 h-5 text-emerald-600" />}
                                                                    {testSubmitted && isSelected && oIdx !== q.correct && <Icon name="x-circle" className="w-5 h-5 text-red-500" />}
                                                                </button>
                                                            );
                                                        })}
                                                    </div>

                                                    {/* Explicación / Feedback */}
                                                    {testSubmitted && (
                                                        <div className="mt-3 p-4 bg-purple-50/60 rounded-xl border border-purple-100 text-xs text-purple-900 flex items-start space-x-2">
                                                            <Icon name="info" className="w-4 h-4 text-brand-600 flex-shrink-0 mt-0.5" />
                                                            <div>
                                                                <span className="font-bold">Explicación: </span>
                                                                {q.explanation}
                                                            </div>
                                                        </div>
                                                    )}
                                                </div>
                                            ))}
                                        </div>

                                        {/* Botón Finalizar / Resultados */}
                                        {!testSubmitted ? (
                                            <button 
                                                onClick={handleFinishTest}
                                                disabled={Object.keys(userAnswers).length < currentTest.length}
                                                className={`w-full py-3.5 rounded-xl text-white font-semibold shadow-lg text-sm transition ${Object.keys(userAnswers).length < currentTest.length ? 'bg-slate-300 cursor-not-allowed' : 'bg-brand-600 hover:bg-brand-700 shadow-brand-500/20'}`}>
                                                Finalizar y Ver Resultados
                                            </button>
                                        ) : (
                                            <div className="bg-slate-900 text-white p-6 rounded-2xl shadow-xl text-center space-y-4">
                                                <h3 className="text-lg font-bold text-slate-200">¡Examen Completado!</h3>
                                                <div className="text-4xl font-black text-brand-400">
                                                    Nota: {calculateScore()} / 10
                                                </div>
                                                
                                                {/* Algoritmo Repetición Espaciada */}
                                                <div className="p-4 bg-slate-800 rounded-xl border border-slate-700 text-xs text-slate-300 flex items-center justify-center space-x-3">
                                                    <Icon name="repeat" className="w-5 h-5 text-brand-400" />
                                                    <span>
                                                        Próximo repaso recomendado: <strong className="text-white">En 3 días (Repetición Espaciada)</strong>
                                                    </span>
                                                </div>

                                                {isPublic && (
                                                    <p className="text-xs text-emerald-400 font-medium">
                                                        ✓ Este examen se ha publicado en el Banco Comunitario.
                                                    </p>
                                                )}

                                                <button 
                                                    onClick={() => setActiveTab('dashboard')}
                                                    className="px-6 py-2.5 bg-brand-500 hover:bg-brand-600 text-white rounded-xl text-sm font-semibold transition">
                                                    Volver al Panel
                                                </button>
                                            </div>
                                        )}
                                    </>
                                )}
                            </div>
                        )}

                        {/* 4. BANCO COMUNITARIO DE EXÁMENES */}
                        {user && activeTab === 'community' && (
                            <div className="space-y-6">
                                <div>
                                    <h2 className="text-2xl font-extrabold text-slate-900">Banco Comunitario de Exámenes</h2>
                                    <p className="text-slate-500 text-sm">Explora y practica con tests compartidos por otros estudiantes universitarios.</p>
                                </div>

                                {/* Filtros y Búsqueda */}
                                <div className="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm flex flex-col md:flex-row gap-4">
                                    <div className="flex-1 flex items-center bg-slate-50 border border-slate-200 rounded-xl px-3 py-2">
                                        <Icon name="search" className="w-4 h-4 text-slate-400 mr-2" />
                                        <input 
                                            type="text" 
                                            placeholder="Buscar por asignatura o título..." 
                                            value={searchQuery}
                                            onChange={(e) => setSearchQuery(e.target.value)}
                                            className="bg-transparent text-sm w-full outline-none"
                                        />
                                    </div>

                                    <div className="w-full md:w-64">
                                        <select 
                                            value={filterUniversity}
                                            onChange={(e) => setFilterUniversity(e.target.value)}
                                            className="w-full bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-sm text-slate-700 outline-none">
                                            <option value="">Todas las Universidades</option>
                                            <option value="Universidad Complutense de Madrid">U. Complutense de Madrid</option>
                                            <option value="Universidad de Barcelona">U. de Barcelona</option>
                                            <option value="Universidad Politécnica de Valencia">U. Politécnica de Valencia</option>
                                            <option value="Universidad de Sevilla">U. de Sevilla</option>
                                        </select>
                                    </div>
                                </div>

                                {/* Lista de Exámenes */}
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {publicExams
                                        .filter(item => item.title.toLowerCase().includes(searchQuery.toLowerCase()) || item.subject.toLowerCase().includes(searchQuery.toLowerCase()))
                                        .filter(item => filterUniversity === '' || item.university === filterUniversity)
                                        .map((exam) => (
                                            <div key={exam.id} className="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm flex flex-col justify-between hover:border-brand-300 transition">
                                                <div>
                                                    <div className="flex justify-between items-start mb-2">
                                                        <span className="text-xs font-semibold px-2.5 py-1 bg-brand-50 text-brand-700 rounded-md">
                                                            {exam.subject}
                                                        </span>
                                                        <div className="flex items-center text-amber-500 text-xs font-bold space-x-1">
                                                            <Icon name="star" className="w-3.5 h-3.5 fill-amber-400" />
                                                            <span>{exam.rating}</span>
                                                        </div>
                                                    </div>

                                                    <h3 className="font-bold text-slate-800 text-base mb-1">{exam.title}</h3>
                                                    <p className="text-xs text-slate-500 mb-4">{exam.university} • Creado por {exam.author}</p>
                                                </div>

                                                <div className="flex items-center justify-between border-t border-slate-100 pt-4 mt-2">
                                                    <span className="text-xs font-medium text-slate-400 flex items-center">
                                                        <Icon name="help-circle" className="w-3.5 h-3.5 mr-1" />
                                                        {exam.questions} preguntas
                                                    </span>
                                                    <button 
                                                        onClick={() => handlePracticeExam(exam)}
                                                        className="px-4 py-2 bg-brand-50 hover:bg-brand-600 hover:text-white text-brand-700 text-xs font-bold rounded-xl transition flex items-center space-x-1">
                                                        <span>Practicar ahora</span>
                                                        <Icon name="arrow-right" className="w-3.5 h-3.5" />
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* MODAL COMPLETAMENTE CORREGIDO Y FUNCIONAL */}
                    {showModal && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-100 space-y-4">
                                <div className="flex justify-between items-center">
                                    <h3 className="text-lg font-bold text-slate-800">Añadir Asignatura y Examen</h3>
                                    <button onClick={() => setShowModal(false)} className="text-slate-400 hover:text-slate-600">
                                        <Icon name="x" className="w-5 h-5" />
                                    </button>
                                </div>

                                <form onSubmit={handleAddSubject} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Nombre de la Materia</label>
                                        <input 
                                            type="text" 
                                            required
                                            value={subjectNameInput}
                                            onChange={(e) => setSubjectNameInput(e.target.value)}
                                            placeholder="Ej. Farmacología, Estadística, etc." 
                                            className="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-brand-500 text-sm outline-none"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Fecha del Examen</label>
                                        <input 
                                            type="date" 
                                            value={subjectExamDateInput}
                                            onChange={(e) => setSubjectExamDateInput(e.target.value)}
                                            className="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-brand-500 text-sm outline-none bg-white"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Tipo de Evaluación</label>
                                        <select 
                                            value={subjectExamTypeInput}
                                            onChange={(e) => setSubjectExamTypeInput(e.target.value)}
                                            className="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:ring-2 focus:ring-brand-500 text-sm outline-none bg-white">
                                            <option value="Examen Parcial">Examen Parcial</option>
                                            <option value="Examen Final">Examen Final</option>
                                            <option value="Entrega de Práctica">Entrega de Práctica</option>
                                            <option value="Test / Quiz">Test / Quiz</option>
                                        </select>
                                    </div>

                                    <div className="flex space-x-3 justify-end pt-2">
                                        <button 
                                            type="button" 
                                            onClick={() => setShowModal(false)}
                                            className="px-4 py-2 text-sm font-semibold text-slate-600 hover:bg-slate-100 rounded-xl transition">
                                            Cancelar
                                        </button>
                                        <button 
                                            type="submit" 
                                            className="px-4 py-2 text-sm font-semibold bg-brand-600 hover:bg-brand-700 text-white rounded-xl shadow-md transition">
                                            Guardar Asignatura
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* FOOTER */}
                    <footer className="bg-white border-t border-slate-100 py-6 mt-12">
                        <div className="max-w-7xl mx-auto px-4 text-center text-xs text-slate-400">
                            MemorAI © 2026 — Tu Aula Inteligente con Repetición Espaciada e IA.
                        </div>
                    </footer>
                </div>
            );
        }

        // Renderizado seguro montado en ErrorBoundary
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <ErrorBoundary>
                <App />
            </ErrorBoundary>
        );
    </script>
</body>
</html>
