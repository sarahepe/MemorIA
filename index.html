</head>

                "arrow-right": <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />,

                chevronRight: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5l7 7-7 7" />,
                list: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 10h16M4 14h16M4 18h16" />,

                mail: <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />,

        // --- COMPONENTE UNIVERSIDADES DROPDOWN ---
        const UniversitySelect = ({ name, value, onChange, required = true }) => (

                required={required}
                className="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm bg-white">
                <option value="">Selecciona tu universidad</option>

                <optgroup label="Andalucía">

                    <option value="Universidad de Granada">Universidad de Granada</option>

                    <option value="Universidad de Córdoba">Universidad de Córdoba</option>
                    <option value="Universidad de Cádiz">Universidad de Cádiz</option>
                    <option value="Universidad de Almería">Universidad de Almería</option>
                    <option value="Universidad de Huelva">Universidad de Huelva</option>
                    <option value="Universidad de Jaén">Universidad de Jaén</option>

                </optgroup>

                <optgroup label="Aragón">
                    <option value="Universidad de Zaragoza">Universidad de Zaragoza</option>
                    <option value="Universidad San Jorge">Universidad San Jorge</option>
                </optgroup>

                <optgroup label="Canarias">
                    <option value="Universidad de La Laguna">Universidad de La Laguna</option>
                    <option value="Universidad de Las Palmas de Gran Canaria">Universidad de Las Palmas de Gran Canaria</option>
                </optgroup>

                <optgroup label="Cantabria">
                    <option value="Universidad de Cantabria">Universidad de Cantabria</option>
                    <option value="Universidad Europea del Atlántico">Universidad Europea del Atlántico</option>
                </optgroup>

                <optgroup label="Castilla y León">
                    <option value="Universidad de Salamanca">Universidad de Salamanca</option>
                    <option value="Universidad de Valladolid">Universidad de Valladolid</option>
                    <option value="Universidad de León">Universidad de León</option>
                    <option value="Universidad de Burgos">Universidad de Burgos</option>
                    <option value="IE University">IE University</option>
                </optgroup>

                <optgroup label="Castilla-La Mancha">
                    <option value="Universidad de Castilla-La Mancha">Universidad de Castilla-La Mancha</option>
                </optgroup>

                <optgroup label="Cataluña">
                    <option value="Universidad de Barcelona">Universidad de Barcelona</option>
                    <option value="Universidad Autónoma de Barcelona">Universidad Autónoma de Barcelona</option>
                    <option value="Universidad Politécnica de Cataluña">Universidad Politécnica de Cataluña</option>

                </optgroup>

                <optgroup label="Comunidad de Madrid">
                    <option value="Universidad Complutense de Madrid">Universidad Complutense de Madrid</option>
                    <option value="Universidad Autónoma de Madrid">Universidad Autónoma de Madrid</option>
                    <option value="Universidad Politécnica de Madrid">Universidad Politécnica de Madrid</option>
                    <option value="Universidad Carlos III de Madrid">Universidad Carlos III de Madrid</option>
                    <option value="Universidad Rey Juan Carlos">Universidad Rey Juan Carlos</option>

                </optgroup>

                <optgroup label="Comunidad Valenciana">
                    <option value="Universidad de Valencia">Universidad de Valencia</option>
                    <option value="Universidad Politécnica de Valencia">Universidad Politécnica de Valencia</option>
                    <option value="Universidad de Alicante">Universidad de Alicante</option>
                    <option value="Universidad Jaume I">Universidad Jaume I</option>
                </optgroup>

                <optgroup label="Galicia">
                    <option value="Universidad de Santiago de Compostela">Universidad de Santiago de Compostela</option>
                    <option value="Universidad de La Coruña">Universidad de La Coruña</option>
                    <option value="Universidad de Vigo">Universidad de Vigo</option>
                </optgroup>

                <optgroup label="País Vasco">
                    <option value="Universidad del País Vasco (UPV/EHU)">Universidad del País Vasco (UPV/EHU)</option>

                <optgroup label="Educación a Distancia">
                    <option value="UNED">UNED</option>
                    <option value="UOC">UOC</option>
                    <option value="UNIR">UNIR</option>
                </optgroup>

                <optgroup label="Otras opciones">
                    <option value="Otra universidad (España)">Otra universidad (España)</option>
                    <option value="Universidad Extranjera / Internacional">Universidad Extranjera / Internacional</option>

            </select>
        );

        // --- COMPONENTE CALENDARIO INTERACTIVO ---
        const ExamCalendar = ({ subjects }) => {
            const today = new Date();
            const currentMonth = today.getMonth();
            const currentYear = today.getFullYear();

            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
            const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
            
            const monthNames = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

            const examDates = subjects
                .filter(s => s.examDate && s.examDate !== 'Sin fecha')
                .map(s => ({
                    dateStr: s.examDate,
                    name: s.name
                }));

            const daysArray = [];
            for (let i = 0; i < (firstDayIndex === 0 ? 6 : firstDayIndex - 1); i++) {
                daysArray.push(null);
            }
            for (let i = 1; i <= daysInMonth; i++) {
                daysArray.push(i);
            }

            return (
                <div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm space-y-4">
                    <div className="flex justify-between items-center">
                        <h3 className="font-bold text-slate-800 text-base flex items-center space-x-2">
                            <Icon name="calendar" className="w-5 h-5 text-brand-600" />
                            <span>Calendario de Exámenes ({monthNames[currentMonth]} {currentYear})</span>
                        </h3>
                    </div>

                    <div className="grid grid-cols-7 gap-2 text-center text-xs font-semibold text-slate-400">
                        <div>Lun</div><div>Mar</div><div>Mié</div><div>Jue</div><div>Vie</div><div>Sáb</div><div>Dom</div>
                    </div>

                    <div className="grid grid-cols-7 gap-2 text-center text-xs">
                        {daysArray.map((day, idx) => {
                            if (!day) return <div key={idx} className="p-2"></div>;

                            const formattedDay = String(day).padStart(2, '0');
                            const formattedMonth = String(currentMonth + 1).padStart(2, '0');
                            const matchDateStr = `${currentYear}-${formattedMonth}-${formattedDay}`;

                            const examMatch = examDates.find(e => e.dateStr === matchDateStr);

                            return (
                                <div 
                                    key={idx} 
                                    className={`p-2 rounded-xl flex flex-col items-center justify-center transition relative ${examMatch ? 'bg-brand-600 text-white font-bold shadow-md shadow-brand-500/30' : 'bg-slate-50 text-slate-700 hover:bg-slate-100'}`}
                                    title={examMatch ? `Examen: ${examMatch.name}` : ''}>
                                    <span>{day}</span>
                                    {examMatch && (
                                        <span className="w-1.5 h-1.5 bg-white rounded-full mt-1"></span>
                                    )}
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        // --- APP PRINCIPAL ---
        function App() {
            // Persistencia en localStorage
            const [registeredUsers, setRegisteredUsers] = useState(() => {
                const saved = localStorage.getItem('memorai_users');
                return saved ? JSON.parse(saved) : [];
            });
            
            const [user, setUser] = useState(() => {
                const saved = localStorage.getItem('memorai_current_user');
                return saved ? JSON.parse(saved) : null;
            });

            const [subjects, setSubjects] = useState(() => {
                const saved = localStorage.getItem('memorai_subjects');
                return saved ? JSON.parse(saved) : [];
            });

            const [publicExams, setPublicExams] = useState(() => {
                const saved = localStorage.getItem('memorai_public_exams');
                return saved ? JSON.parse(saved) : [];
            });

            useEffect(() => {
                localStorage.setItem('memorai_users', JSON.stringify(registeredUsers));
            }, [registeredUsers]);

            useEffect(() => {
                if (user) {
                    localStorage.setItem('memorai_current_user', JSON.stringify(user));
                } else {
                    localStorage.removeItem('memorai_current_user');
                }
            }, [user]);

            useEffect(() => {
                localStorage.setItem('memorai_subjects', JSON.stringify(subjects));
            }, [subjects]);

            useEffect(() => {
                localStorage.setItem('memorai_public_exams', JSON.stringify(publicExams));
            }, [publicExams]);

            const [activeTab, setActiveTab] = useState('dashboard');
            const [selectedSubjectId, setSelectedSubjectId] = useState(null);
            
            // Estado Auth
            const [authMode, setAuthMode] = useState('login'); // 'login', 'register', 'forgot'
            const [authError, setAuthError] = useState('');
            const [authSuccess, setAuthErrorSuccess] = useState('');
            const [formData, setFormData] = useState({
                fullName: '',
                email: '',
                password: '',
                university: '',
                customUniversity: '',
                degree: ''
            });

            // Estado para Restablecimiento de Contraseña
            const [forgotEmail, setForgotEmail] = useState('');
            const [resetTokenSent, setResetTokenSent] = useState(false);
            const [newPassword, setNewPassword] = useState('');

            // Modal Perfil
            const [showProfileModal, setShowProfileModal] = useState(false);
            const [profileForm, setProfileForm] = useState({
                name: '',
                degree: '',
                university: '',
                customUniversity: ''
            });

            // Modal Asignatura
            const [showModal, setShowModal] = useState(false);
            const [subjectNameInput, setSubjectNameInput] = useState('');
            const [subjectExamDateInput, setSubjectExamDateInput] = useState('');
            const [subjectExamTypeInput, setSubjectExamTypeInput] = useState('Examen Parcial');

            // Carga Apuntes
            const [isExtractingPDF, setIsExtractingPDF] = useState(false);

            // Modal Configurador de Examen IA
            const [showExamConfigModal, setShowExamConfigModal] = useState(false);
            const [examConfig, setExamConfig] = useState({
                format: 'test',
                questionCount: 15,
                subjectId: null
            });

            // Modal Resumen por IA
            const [showSummaryModal, setShowSummaryModal] = useState(false);
            const [summaryType, setSummaryType] = useState('short');
            const [generatedSummary, setGeneratedSummary] = useState('');

            // Estado del Examen Generado
            const [currentTest, setCurrentTest] = useState(null);
            const [currentSubjectName, setCurrentSubjectName] = useState('General');
            const [isPublic, setIsPublic] = useState(false);
            const [userAnswers, setUserAnswers] = useState({});
            const [testSubmitted, setTestSubmitted] = useState(false);

            // Búsqueda Comunidad
            const [searchQuery, setSearchQuery] = useState('');

            const handleAuthInput = (e) => {
                setAuthError('');
                setAuthErrorSuccess('');
                setFormData({ ...formData, [e.target.name]: e.target.value });
            };

            const handleAuthSubmit = (e) => {
                e.preventDefault();
                setAuthError('');
                setAuthErrorSuccess('');
                const cleanEmail = formData.email.trim().toLowerCase();

                if (authMode === 'register') {
                    const existingUser = registeredUsers.find(u => u.email.toLowerCase() === cleanEmail);
                    if (existingUser) {
                        setAuthError('Este correo electrónico ya está registrado. Por favor, inicia sesión.');
                        return;
                    }

                    let finalUniversity = formData.university;
                    if (formData.university === 'Otra universidad (España)' || formData.university === 'Universidad Extranjera / Internacional') {
                        finalUniversity = formData.customUniversity.trim() || formData.university;
                    }

                    const newUser = {
                        name: formData.fullName.trim() || 'Estudiante',
                        email: cleanEmail,
                        password: formData.password,
                        university: finalUniversity || 'Universidad No Especificada',
                        degree: formData.degree.trim() || 'Grado Universitario'
                    };

                    setRegisteredUsers(prev => [...prev, newUser]);
                    setUser(newUser);
                    setActiveTab('dashboard');
                } else if (authMode === 'login') {
                    const foundUser = registeredUsers.find(u => u.email.toLowerCase() === cleanEmail);

                    if (!foundUser) {
                        setAuthError('No existe ninguna cuenta registrada con este correo.');
                        return;
                    }

                    if (foundUser.password !== formData.password) {
                        setAuthError('La contraseña introducida es incorrecta.');
                        return;
                    }

                    setUser(foundUser);
                    setActiveTab('dashboard');
                }
            };

            // RECUPERAR CONTRASEÑA - PASO 1 (Enviar correo simulado)
            const handleSendResetLink = (e) => {
                e.preventDefault();
                setAuthError('');
                const cleanEmail = forgotEmail.trim().toLowerCase();
                const foundUser = registeredUsers.find(u => u.email.toLowerCase() === cleanEmail);

                if (!foundUser) {
                    setAuthError('No encontramos ningún usuario con este correo electrónico.');
                    return;
                }

                setResetTokenSent(true);
            };

            // RECUPERAR CONTRASEÑA - PASO 2 (Cambiar contraseña)
            const handleResetPasswordSubmit = (e) => {
                e.preventDefault();
                if (!newPassword.trim()) return;

                const cleanEmail = forgotEmail.trim().toLowerCase();

                setRegisteredUsers(prev => prev.map(u => {
                    if (u.email.toLowerCase() === cleanEmail) {
                        return { ...u, password: newPassword };
                    }
                    return u;
                }));

                setResetTokenSent(false);
                setForgotEmail('');
                setNewPassword('');
                setAuthMode('login');
                setAuthErrorSuccess('¡Contraseña restablecida con éxito! Ya puedes iniciar sesión.');
            };

            // ABRIR EDITAR PERFIL
            const handleOpenProfileModal = () => {
                if (!user) return;
                setProfileForm({
                    name: user.name,
                    degree: user.degree,
                    university: user.university,
                    customUniversity: ''
                });
                setShowProfileModal(true);
            };

            // GUARDAR EDICIÓN DE PERFIL
            const handleSaveProfile = (e) => {
                e.preventDefault();
                if (!user) return;

                let finalUniv = profileForm.university;
                if (profileForm.university === 'Otra universidad (España)' || profileForm.university === 'Universidad Extranjera / Internacional') {
                    finalUniv = profileForm.customUniversity.trim() || profileForm.university;
                }

                const updatedUser = {
                    ...user,
                    name: profileForm.name.trim() || user.name,
                    degree: profileForm.degree.trim() || user.degree,
                    university: finalUniv || user.university
                };

                setUser(updatedUser);

                // Actualizar en la lista global de usuarios
                setRegisteredUsers(prev => prev.map(u => u.email === user.email ? updatedUser : u));
                setShowProfileModal(false);
            };

            const handleAddSubject = (e) => {
                e.preventDefault();
                const trimmedName = subjectNameInput.trim();
                if (!trimmedName) return;

                const newSub = {
                    id: String(Date.now()),
                    name: trimmedName,
                    examDate: subjectExamDateInput || 'Sin fecha',
                    examType: subjectExamTypeInput || 'Examen',
                    topics: []
                };

                setSubjects(prev => [...prev, newSub]);
                setSubjectNameInput('');
                setSubjectExamDateInput('');
                setSubjectExamTypeInput('Examen Parcial');
                setShowModal(false);
            };

            const handleDeleteSubject = (id) => {
                setSubjects(prev => prev.filter(s => s.id !== id));
                if (selectedSubjectId === id) setSelectedSubjectId(null);
            };

            const getCountdownText = (examDateStr) => {
                if (!examDateStr || examDateStr === 'Sin fecha') return "Sin fecha asignada";

                const target = new Date(examDateStr);
                const now = new Date();
                const diffTime = target - now;

                if (isNaN(target.getTime())) return "Sin fecha asignada";
                if (diffTime < 0) return "Examen ya realizado";

                const days = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diffTime % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));

                return `Faltan ${days}d ${hours}h`;
            };

            const handleFileUploadToSubject = (e, subjectId) => {
                const file = e.target.files && e.target.files[0];
                if (!file) return;

                if (file.type !== 'application/pdf') {
                    alert("Por favor, selecciona un archivo PDF válido.");
                    return;
                }

                setIsExtractingPDF(true);
                const reader = new FileReader();

                reader.onload = async function() {
                    try {
                        const typedarray = new Uint8Array(this.result);
                        const pdf = await pdfjsLib.getDocument(typedarray).promise;
                        let pagesData = [];

                        for (let i = 1; i <= pdf.numPages; i++) {
                            const page = await pdf.getPage(i);
                            const textContent = await page.getTextContent();
                            const pageText = textContent.items.map(item => item.str).join(' ');
                            pagesData.push({ pageNum: i, text: pageText });
                        }

                        const newTopic = {
                            id: String(Date.now()),
                            fileName: file.name,
                            uploadDate: new Date().toLocaleDateString('es-ES'),
                            pageCount: pdf.numPages,
                            pages: pagesData
                        };

                        setSubjects(prevSubjects => prevSubjects.map(sub => {
                            if (sub.id === subjectId) {
                                return { ...sub, topics: [...(sub.topics || []), newTopic] };
                            }
                            return sub;
                        }));

                    } catch (error) {
                        console.error("Error al procesar el PDF:", error);
                        alert("Hubo un error al leer el PDF.");
                    } finally {
                        setIsExtractingPDF(false);
                    }
                };

                reader.readAsArrayBuffer(file);
            };

            const handleDeleteTopic = (subjectId, topicId) => {
                setSubjects(prev => prev.map(sub => {
                    if (sub.id === subjectId) {
                        return { ...sub, topics: sub.topics.filter(t => t.id !== topicId) };
                    }
                    return sub;
                }));
            };

            const handleGenerateSummary = () => {
                const targetSub = subjects.find(s => s.id === selectedSubjectId);
                if (!targetSub || !targetSub.topics || targetSub.topics.length === 0) {
                    alert("Sube al menos un archivo PDF en esta asignatura para poder resumir los apuntes.");
                    return;
                }

                let fullText = targetSub.topics.flatMap(t => t.pages.map(p => p.text)).join(" ");
                if (!fullText.trim()) {
                    alert("El temario cargado no contiene suficiente texto.");
                    return;
                }

                let summaryResult = "";
                const snippet = fullText.substring(0, 300);

                if (summaryType === 'short') {
                    summaryResult = `📌 RESUMEN ULTRA-CORTO:\n\nSÍNTESIS EJECUTIVA:\nEl temario aborda los fundamentos de la asignatura. Se destacan las bases teóricas principales: "${snippet}..."`;
                } else if (summaryType === 'medium') {
                    summaryResult = `📖 RESUMEN DETALLADO:\n\n1. CONTEXTUALIZACIÓN:\nEl desarrollo analizado en el temario abarca los aspectos clave del curso.\n\n2. PUNTOS CLAVE DE APRENDIZAJE:\n- Principio Fundamental: En base al texto expuesto ("${snippet}...").\n- Metodología: Procedimientos estructurados en los apuntes.`;
                } else if (summaryType === 'keywords') {
                    summaryResult = `🔑 PALABRAS CLAVE:\n\n- Concepto Central: Marco Teórico Principal\n- Variable A: Análisis Estructural\n- Variable B: Aplicación Práctica\n- Referencia: "${snippet.substring(0, 100)}..."`;
                } else if (summaryType === 'schema') {
                    summaryResult = `🧠 ESQUEMA CONCEPTUAL ESTRUCTURADO:\n\n[UNIDAD CENTRAL]\n ├── 1. Núcleo Teórico\n │    ├── Definición Inicial ("${snippet.substring(0, 60)}...")\n │    └── Principios Clave\n └── 2. Conclusiones`;
                }

                setGeneratedSummary(summaryResult);
                setShowSummaryModal(true);
            };

            const handleGenerateExamFromConfig = () => {
                const targetSub = subjects.find(s => s.id === examConfig.subjectId);
                if (!targetSub || !targetSub.topics || targetSub.topics.length === 0) {
                    alert("Esta asignatura no tiene ningún temario subido. Sube un PDF primero.");
                    setShowExamConfigModal(false);
                    return;
                }

                setCurrentSubjectName(targetSub.name);
                
                let allPages = [];
                targetSub.topics.forEach(t => {
                    t.pages.forEach(p => {
                        allPages.push({ fileName: t.fileName, pageNum: p.pageNum, text: p.text });
                    });
                });

                const count = parseInt(examConfig.questionCount) || 15;
                let generatedQuestions = [];

                for (let i = 1; i <= count; i++) {
                    const randomPage = allPages[Math.floor(Math.random() * allPages.length)];
                    const shortText = randomPage.text.length > 30 ? randomPage.text.substring(0, 100) : "conceptos fundamentales analizados en el temario";

                    let type = examConfig.format;
                    if (examConfig.format === 'mixed') {
                        const types = ['test', 'short', 'long'];
                        type = types[i % 3];
                    }

                    if (type === 'test') {
                        generatedQuestions.push({
                            id: i,
                            type: 'test',
                            question: `¿Qué implicación conceptual se deriva de lo analizado sobre "${shortText.substring(0, 50)}..."?`,
                            options: [
                                `Permite redefinir la estructura conceptual basándose en los principios teóricos del tema.`,
                                `Invalida la aplicación práctica al contradecir las hipótesis de trabajo.`,
                                `Aplica únicamente a modelos empíricos aislados sin valor metodológico.`,
                                `Sustituye completamente la terminología tradicional empleada en la disciplina.`
                            ],
                            correct: 0,
                            explanation: `Esta conclusión se fundamenta en el análisis desarrollado en la materia.`,
                            sourceFile: randomPage.fileName,
                            sourcePage: randomPage.pageNum
                        });
                    } else if (type === 'short') {
                        generatedQuestions.push({
                            id: i,
                            type: 'short',
                            question: `Explique brevemente el concepto principal referente a: "${shortText.substring(0, 60)}..."`,
                            idealAnswer: `La respuesta debe abordar la definición de la variable, sus componentes esenciales y su aplicabilidad directa según la bibliografía del curso.`,
                            sourceFile: randomPage.fileName,
                            sourcePage: randomPage.pageNum
                        });
                    } else if (type === 'long') {
                        generatedQuestions.push({
                            id: i,
                            type: 'long',
                            question: `Desarrolle en profundidad el marco teórico y las aplicaciones prácticas asociadas a: "${shortText.substring(0, 70)}..."`,
                            idealAnswer: `El desarrollo debe incluir: 1) Contextualización teórica, 2) Justificación metodológica y 3) Conclusión crítica.`,
                            sourceFile: randomPage.fileName,
                            sourcePage: randomPage.pageNum
                        });
                    }
                }

                setCurrentTest(generatedQuestions);
                setUserAnswers({});
                setTestSubmitted(false);
                setShowExamConfigModal(false);
                setActiveTab('generator');
            };

            const handlePracticeExam = (exam) => {
                setCurrentSubjectName(exam.subject);
                setCurrentTest([
                    {
                        id: 1,
                        type: 'test',
                        question: "¿Cuál es el objetivo primordial de la repetición espaciada?",
                        options: [
                            "Optimizar la retención a largo plazo combatiendo la curva del olvido",
                            "Sustituir los exámenes por lecturas automáticas",
                            "Reducir el tiempo de clase presencial",
                            "Memorizar textos literalmente sin comprensión"
                        ],
                        correct: 0,
                        explanation: "La repetición espaciada distribuye las autoevaluaciones en el tiempo.",
                        sourceFile: "Banco Comunitario",
                        sourcePage: 1
                    }
                ]);
                setUserAnswers({});
                setTestSubmitted(false);
                setActiveTab('generator');
            };

            const handleSelectOption = (qId, val) => {
                if (testSubmitted) return;
                setUserAnswers(prev => ({ ...prev, [qId]: val }));
            };

            const calculateScore = () => {
                if (!currentTest) return 0;
                let testQuestions = currentTest.filter(q => q.type === 'test');
                if (testQuestions.length === 0) return 10;

                let correctCount = 0;
                testQuestions.forEach(q => {
                    if (userAnswers[q.id] === q.correct) correctCount++;
                });
                return Math.round((correctCount / testQuestions.length) * 10);
            };

            const handleFinishTest = () => {
                setTestSubmitted(true);
                if (isPublic && currentTest) {
                    const newPublicExam = {
                        id: Date.now(),
                        title: `Examen de ${currentSubjectName}`,
                        university: user ? user.university : "Universidad General",
                        subject: currentSubjectName,
                        author: user ? user.name : "Estudiante MemorAI",
                        questions: currentTest.length,
                        rating: 5.0
                    };
                    setPublicExams(prev => [newPublicExam, ...prev]);
                }
            };

            const selectedSubject = subjects.find(s => s.id === selectedSubjectId);

            return (
                <div className="flex-1 flex flex-col min-h-screen">
                    {/* BARRA DE NAVEGACIÓN */}
                    <nav className="bg-white border-b border-purple-100 sticky top-0 z-40 shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex justify-between h-16 items-center">
                                <div className="flex items-center space-x-2 font-bold text-xl cursor-pointer" onClick={() => user && setActiveTab('dashboard')}>
                                    <div className="bg-brand-600 text-white p-2 rounded-xl flex items-center justify-center shadow-md shadow-brand-500/20">
                                        <Icon name="brain" className="w-6 h-6" />
                                    </div>
                                    <span className="text-brand-900 tracking-tight">Memor<span className="text-brand-600">AI</span></span>
                                </div>

                                {user && (
                                    <div className="flex items-center space-x-1 sm:space-x-4">
                                        <button 
                                            onClick={() => { setActiveTab('dashboard'); setSelectedSubjectId(null); }}
                                            className={`px-3 py-2 rounded-lg text-sm font-medium transition ${activeTab === 'dashboard' ? 'bg-brand-50 text-brand-700' : 'text-slate-600 hover:text-brand-600'}`}>
                                            Panel
                                        </button>
                                        <button 
                                            onClick={() => setActiveTab('generator')}
                                            className={`px-3 py-2 rounded-lg text-sm font-medium transition ${activeTab === 'generator' ? 'bg-brand-50 text-brand-700' : 'text-slate-600 hover:text-brand-600'}`}>
                                            Simulador / Test
                                        </button>
                                        <button 
                                            onClick={() => setActiveTab('community')}
                                            className={`px-3 py-2 rounded-lg text-sm font-medium transition ${activeTab === 'community' ? 'bg-brand-50 text-brand-700' : 'text-slate-600 hover:text-brand-600'}`}>
                                            Comunidad ({publicExams.length})
                                        </button>
                                        
                                        {/* CLIC EN PERFIL DE USUARIO */}
                                        <div className="pl-4 border-l border-slate-200 flex items-center space-x-3">
                                            <div 
                                                onClick={handleOpenProfileModal}
                                                className="hidden md:block text-right cursor-pointer hover:opacity-80 transition group"
                                                title="Hacer clic para editar perfil">
                                                <div className="text-xs font-bold text-slate-800 flex items-center justify-end space-x-1">
                                                    <span>{user.name}</span>
                                                    <Icon name="user" className="w-3.5 h-3.5 text-brand-600" />
                                                </div>
                                                <div className="text-xs text-slate-500 max-w-[160px] truncate" title={`${user.degree} • ${user.university}`}>{user.degree}</div>
                                            </div>

                                            <button 
                                                onClick={() => setUser(null)}
                                                className="p-2 text-slate-400 hover:text-red-500 rounded-lg hover:bg-red-50 transition"
                                                title="Cerrar Sesión">
                                                <Icon name="log-out" className="w-5 h-5" />
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    </nav>

                    {/* VISTAS */}
                    <main className="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
                        
                        {/* 1. AUTENTICACIÓN / RESTABLECER CONTRASEÑA */}
                        {!user && (
                            <div className="py-8 max-w-4xl mx-auto">
                                <div className="text-center mb-10">
                                    <div className="inline-flex items-center space-x-2 bg-brand-50 text-brand-700 px-4 py-1.5 rounded-full text-sm font-semibold mb-4 border border-brand-200">
                                        <Icon name="sparkles" className="w-4 h-4" />
                                        <span>Potenciado con Repetición Espaciada e IA</span>
                                    </div>
                                    <h1 className="text-4xl sm:text-5xl font-extrabold text-slate-900 tracking-tight mb-4">
                                        Memor<span className="text-brand-600">AI</span>: Tu Aula Inteligente
                                    </h1>
                                    <p className="text-lg text-slate-600 max-w-2xl mx-auto">
                                        Organiza tus asignaturas, sube tus temarios en PDF, genera resúmenes inteligentes y exámenes de hasta 30 preguntas.
                                    </p>
                                </div>

                                <div className="bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden max-w-md mx-auto">
                                    <div className="flex border-b border-slate-100">
                                        <button 
                                            onClick={() => { setAuthMode('login'); setAuthError(''); setAuthErrorSuccess(''); }}
                                            className={`flex-1 py-4 text-center font-semibold text-sm transition ${authMode === 'login' ? 'bg-white text-brand-600 border-b-2 border-brand-600' : 'bg-slate-50 text-slate-500 hover:text-slate-700'}`}>
                                            Iniciar Sesión
                                        </button>
                                        <button 
                                            onClick={() => { setAuthMode('register'); setAuthError(''); setAuthErrorSuccess(''); }}
                                            className={`flex-1 py-4 text-center font-semibold text-sm transition ${authMode === 'register' ? 'bg-white text-brand-600 border-b-2 border-brand-600' : 'bg-slate-50 text-slate-500 hover:text-slate-700'}`}>
                                            Registrarse
                                        </button>
                                    </div>

                                    {authMode === 'forgot' ? (
                                        /* FORMULARIO RECUPERAR CONTRASEÑA */
                                        <div className="p-6 space-y-4">
                                            <h3 className="text-lg font-bold text-slate-800 flex items-center space-x-2">
                                                <Icon name="key" className="w-5 h-5 text-brand-600" />
                                                <span>Recuperar Contraseña</span>
                                            </h3>

                                            {authError && (
                                                <div className="p-3 bg-red-50 border border-red-200 rounded-xl text-red-600 text-xs font-semibold flex items-center space-x-2">
                                                    <Icon name="alert-circle" className="w-4 h-4 flex-shrink-0" />
                                                    <span>{authError}</span>
                                                </div>
                                            )}

                                            {!resetTokenSent ? (
                                                <form onSubmit={handleSendResetLink} className="space-y-4">
                                                    <p className="text-xs text-slate-500">Introduce el correo electrónico de tu cuenta para enviarte un enlace de restablecimiento.</p>
                                                    <div>
                                                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Correo Electrónico</label>
                                                        <input 
                                                            type="email" 
                                                            required
                                                            value={forgotEmail} 
                                                            onChange={(e) => setForgotEmail(e.target.value)} 
                                                            placeholder="tu.email@universidad.edu" 
                                                            className="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm"
                                                        />
                                                    </div>
                                                    <div className="flex space-x-2">
                                                        <button 
                                                            type="button" 
                                                            onClick={() => setAuthMode('login')}
                                                            className="flex-1 py-2.5 bg-slate-100 text-slate-600 font-semibold rounded-xl text-xs hover:bg-slate-200 transition">
                                                            Volver
                                                        </button>
                                                        <button 
                                                            type="submit" 
                                                            className="flex-1 py-2.5 bg-brand-600 text-white font-semibold rounded-xl text-xs hover:bg-brand-700 transition">
                                                            Enviar Correo
                                                        </button>
                                                    </div>
                                                </form>
                                            ) : (
                                                /* SIMULACIÓN DE RECEPCIÓN DE CORREO Y CAMBIO DE CLAVE */
                                                <form onSubmit={handleResetPasswordSubmit} className="space-y-4">
                                                    <div className="p-3 bg-emerald-50 border border-emerald-200 rounded-xl text-emerald-800 text-xs font-medium space-y-1">
                                                        <p className="font-bold flex items-center space-x-1">
                                                            <Icon name="mail" className="w-4 h-4 text-emerald-600 mr-1" />
                                                            <span>¡Mensaje enviado a tu email!</span>
                                                        </p>
                                                        <p className="text-[11px]">En un entorno real recibirías un enlace. Introduce abajo tu nueva contraseña para actualizarla:</p>
                                                    </div>

                                                    <div>
                                                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Nueva Contraseña</label>
                                                        <input 
                                                            type="password" 
                                                            required
                                                            value={newPassword} 
                                                            onChange={(e) => setNewPassword(e.target.value)} 
                                                            placeholder="••••••••" 
                                                            className="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm"
                                                        />
                                                    </div>

                                                    <button 
                                                        type="submit" 
                                                        className="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-xl text-sm shadow">
                                                        Guardar Nueva Contraseña
                                                    </button>
                                                </form>
                                            )}
                                        </div>
                                    ) : (
                                        /* FORMULARIO LOGIN / REGISTRO */
                                        <form onSubmit={handleAuthSubmit} className="p-6 space-y-4">
                                            {authSuccess && (
                                                <div className="p-3 bg-emerald-50 border border-emerald-200 rounded-xl text-emerald-700 text-xs font-semibold flex items-center space-x-2">
                                                    <Icon name="check-circle" className="w-4 h-4 flex-shrink-0" />
                                                    <span>{authSuccess}</span>
                                                </div>
                                            )}

                                            {authError && (
                                                <div className="p-3 bg-red-50 border border-red-200 rounded-xl text-red-600 text-xs font-semibold flex items-center space-x-2">
                                                    <Icon name="alert-circle" className="w-4 h-4 flex-shrink-0" />
                                                    <span>{authError}</span>
                                                </div>
                                            )}

                                            {authMode === 'register' && (
                                                <div>
                                                    <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Nombre Completo</label>
                                                    <input 
                                                        type="text" 
                                                        name="fullName"
                                                        required
                                                        value={formData.fullName} 
                                                        onChange={handleAuthInput} 
                                                        placeholder="Ej. María García" 
                                                        className="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm"
                                                    />
                                                </div>
                                            )}

                                            <div>
                                                <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Correo Electrónico</label>
                                                <input 
                                                    type="email" 
                                                    name="email"
                                                    required
                                                    value={formData.email} 
                                                    onChange={handleAuthInput} 
                                                    placeholder="tu.email@universidad.edu" 
                                                    className="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm"
                                                />
                                            </div>

                                            <div>
                                                <div className="flex justify-between items-center mb-1">
                                                    <label className="block text-xs font-semibold text-slate-600 uppercase">Contraseña</label>
                                                    {authMode === 'login' && (
                                                        <button 
                                                            type="button"
                                                            onClick={() => { setAuthMode('forgot'); setAuthError(''); setAuthErrorSuccess(''); }}
                                                            className="text-xs text-brand-600 hover:underline font-medium">
                                                            ¿Has olvidado tu contraseña?
                                                        </button>
                                                    )}
                                                </div>
                                                <input 
                                                    type="password" 
                                                    name="password"
                                                    required
                                                    value={formData.password} 
                                                    onChange={handleAuthInput} 
                                                    placeholder="••••••••" 
                                                    className="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm"
                                                />
                                            </div>

                                            {authMode === 'register' && (
                                                <>
                                                    <div>
                                                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Universidad</label>
                                                        <UniversitySelect 
                                                            name="university"
                                                            value={formData.university}
                                                            onChange={handleAuthInput}
                                                        />
                                                    </div>

                                                    {(formData.university === 'Otra universidad (España)' || formData.university === 'Universidad Extranjera / Internacional') && (
                                                        <div>
                                                            <label className="block text-xs font-semibold text-brand-700 uppercase mb-1">Nombre de tu Universidad</label>
                                                            <input 
                                                                type="text" 
                                                                name="customUniversity"
                                                                required
                                                                value={formData.customUniversity} 
                                                                onChange={handleAuthInput} 
                                                                placeholder="Ej. Harvard, UBA, etc." 
                                                                className="w-full px-4 py-2.5 rounded-xl border border-brand-300 bg-brand-50/40 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm"
                                                            />
                                                        </div>
                                                    )}

                                                    <div>
                                                        <label className="block text-xs font-semibold text-slate-600 uppercase mb-1">Carrera / Grado</label>
                                                        <input 
                                                            type="text" 
                                                            name="degree"
                                                            required
                                                            value={formData.degree} 
                                                            onChange={handleAuthInput} 
                                                            placeholder="Ej. Medicina, Derecho, Ing. Informática, etc." 
                                                            className="w-full px-4 py-2.5 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm"
                                                        />
                                                    </div>
                                                </>
                                            )}

                                            <button 
                                                type="submit" 
                                                className="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-xl shadow-lg shadow-brand-500/30 transition duration-200 text-sm mt-2">
                                                {authMode === 'login' ? 'Acceder a mi Aula' : 'Crear mi Cuenta'}
                                            </button>
                                        </form>
                                    )}
                                </div>
                            </div>
                        )}

                        {/* 2. PANEL DE ESTUDIANTE (DASHBOARD O VISTA DE ASIGNATURA) */}
                        {user && activeTab === 'dashboard' && (
                            <div className="space-y-8">
                                {/* Encabezado */}
                                <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                                    <div>
                                        <div className="flex items-center space-x-3">
                                            <h2 className="text-3xl font-extrabold text-slate-900 tracking-tight">
                                                {selectedSubject ? selectedSubject.name : `¡Hola de nuevo, ${user.name}! 👋`}
                                            </h2>
                                            {!selectedSubject && (
                                                <button 
                                                    onClick={handleOpenProfileModal}
                                                    className="p-1.5 bg-brand-50 hover:bg-brand-100 text-brand-700 rounded-lg text-xs font-semibold transition inline-flex items-center space-x-1"
                                                    title="Editar información de perfil">
                                                    <Icon name="user" className="w-3.5 h-3.5" />
                                                    <span>Editar perfil</span>
                                                </button>
                                            )}
                                        </div>
                                        <p className="text-slate-500 text-sm mt-1">
                                            {selectedSubject ? `Gestión de Temario, Resúmenes y Exámenes` : `${user.degree} • ${user.university}`}
                                        </p>
                                    </div>
                                    <div className="flex space-x-3">
                                        {selectedSubject && (
                                            <button 
                                                onClick={() => setSelectedSubjectId(null)}
                                                className="px-4 py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl text-sm transition">
                                                Volver al Panel
                                            </button>
                                        )}
                                        <button 
                                            onClick={() => setShowModal(true)}
                                            className="inline-flex items-center space-x-2 bg-brand-600 hover:bg-brand-700 text-white px-4 py-2.5 rounded-xl font-semibold shadow-md shadow-brand-500/20 text-sm transition">
                                            <Icon name="plus" className="w-4 h-4" />
                                            <span>Nueva Asignatura</span>
                                        </button>
                                    </div>
                                </div>

                                {/* Vista Detallada de Asignatura */}
                                {selectedSubject ? (
                                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                                        <div className="lg:col-span-2 space-y-6">
                                            <div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm space-y-4">
                                                <div className="flex justify-between items-center">
                                                    <h3 className="text-lg font-bold text-slate-800 flex items-center space-x-2">
                                                        <Icon name="file-text" className="w-5 h-5 text-brand-600" />
                                                        <span>Temario / Apuntes en PDF ({selectedSubject.topics?.length || 0})</span>
                                                    </h3>
                                                    
                                                    <label htmlFor="pdf-upload-subject" className="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-xl text-xs font-bold cursor-pointer transition shadow inline-flex items-center space-x-2">
                                                        <Icon name="upload-cloud" className="w-4 h-4" />
                                                        <span>{isExtractingPDF ? 'Procesando...' : 'Subir PDF'}</span>
                                                    </label>
                                                    <input 
                                                        type="file" 
                                                        id="pdf-upload-subject" 
                                                        accept="application/pdf" 
                                                        onChange={(e) => handleFileUploadToSubject(e, selectedSubject.id)} 
                                                        className="hidden" 
                                                    />
                                                </div>

                                                {!selectedSubject.topics || selectedSubject.topics.length === 0 ? (
                                                    <div className="border-2 border-dashed border-slate-200 p-8 rounded-2xl text-center text-slate-400">
                                                        <Icon name="upload-cloud" className="w-10 h-10 mx-auto mb-2 text-slate-300" />
                                                        <p className="text-sm font-semibold">Aún no has subido temario para esta asignatura.</p>
                                                        <p className="text-xs text-slate-400 mt-1">Sube tus archivos PDF para generar exámenes o resúmenes con IA.</p>
                                                    </div>
                                                ) : (
                                                    <div className="space-y-3">
                                                        {selectedSubject.topics.map((topic) => (
                                                            <div key={topic.id} className="p-4 bg-slate-50 rounded-xl border border-slate-200 flex items-center justify-between">
                                                                <div className="flex items-center space-x-3">
                                                                    <div className="p-2.5 bg-red-100 text-red-600 rounded-lg">
                                                                        <Icon name="file" className="w-5 h-5" />
                                                                    </div>
                                                                    <div>
                                                                        <h4 className="text-sm font-bold text-slate-800">{topic.fileName}</h4>
                                                                        <p className="text-xs text-slate-500">{topic.pageCount} Páginas • Subido el {topic.uploadDate}</p>
                                                                    </div>
                                                                </div>
                                                                <button 
                                                                    onClick={() => handleDeleteTopic(selectedSubject.id, topic.id)}
                                                                    className="text-slate-400 hover:text-red-500 p-2 transition">
                                                                    <Icon name="trash-2" className="w-4 h-4" />
                                                                </button>
                                                            </div>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>
                                        </div>

                                        <div className="space-y-6">
                                            <div className="bg-slate-900 text-white p-6 rounded-2xl shadow-xl space-y-2">
                                                <div className="text-xs text-brand-400 font-bold uppercase tracking-wider flex items-center space-x-1">
                                                    <Icon name="clock" className="w-4 h-4" />
                                                    <span>Cuenta Atrás de Examen</span>
                                                </div>
                                                <div className="text-2xl font-black text-white">
                                                    {getCountdownText(selectedSubject.examDate)}
                                                </div>
                                                <p className="text-xs text-slate-400">Fecha fijada: {selectedSubject.examDate !== 'Sin fecha' ? selectedSubject.examDate : 'Sin asignar'}</p>
                                            </div>

                                            <div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm space-y-4">
                                                <h3 className="text-base font-bold text-slate-800 flex items-center space-x-2">
                                                    <Icon name="list" className="w-5 h-5 text-brand-600" />
                                                    <span>Resumir Apuntes con IA</span>
                                                </h3>
                                                
                                                <div className="space-y-3">
                                                    <label className="block text-xs font-semibold text-slate-600 uppercase">Formato de Resumen</label>
                                                    <select 
                                                        value={summaryType}
                                                        onChange={(e) => setSummaryType(e.target.value)}
                                                        className="w-full px-3 py-2 rounded-xl border border-slate-200 text-xs font-medium outline-none bg-white">
                                                        <option value="short">📌 Resumen Muy Corto / Highlights</option>
                                                        <option value="medium">📖 Resumen Medio / Detallado</option>
                                                        <option value="keywords">🔑 Solo Palabras Clave</option>
                                                        <option value="schema">🧠 Esquema / Mapa Conceptual</option>
                                                    </select>

                                                    <button 
                                                        onClick={handleGenerateSummary}
                                                        className="w-full py-2.5 bg-brand-50 hover:bg-brand-600 hover:text-white text-brand-700 font-bold rounded-xl text-xs transition border border-brand-200 flex items-center justify-center space-x-2">
                                                        <Icon name="sparkles" className="w-4 h-4" />
                                                        <span>Generar Resumen</span>
                                                    </button>
                                                </div>
                                            </div>

                                            <div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm space-y-4">
                                                <h3 className="text-base font-bold text-slate-800 flex items-center space-x-2">
                                                    <Icon name="brain" className="w-5 h-5 text-brand-600" />
                                                    <span>Generar Examen por IA</span>
                                                </h3>
                                                <button 
                                                    onClick={() => {
                                                        if (!selectedSubject.topics || selectedSubject.topics.length === 0) {
                                                            alert("Sube al menos un PDF en esta asignatura para generar el examen.");
                                                            return;
                                                        }
                                                        setExamConfig({ ...examConfig, subjectId: selectedSubject.id });
                                                        setShowExamConfigModal(true);
                                                    }}
                                                    className="w-full py-3 bg-brand-600 hover:bg-brand-700 text-white font-semibold rounded-xl shadow-lg shadow-brand-500/20 text-xs transition flex items-center justify-center space-x-2">
                                                    <Icon name="sparkles" className="w-4 h-4" />
                                                    <span>Configurar Examen IA</span>
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                ) : (
                                    /* VISTA GENERAL DASHBOARD */
                                    <div className="space-y-8">
                                        <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                                            <div className="lg:col-span-2 space-y-4">
                                                <h3 className="text-lg font-bold text-slate-800">Mis Asignaturas ({subjects.length})</h3>
                                                
                                                {subjects.length === 0 ? (
                                                    <div className="bg-white p-8 rounded-2xl border border-dashed border-slate-200 text-center text-slate-400">
                                                        <Icon name="book-open" className="w-10 h-10 mx-auto mb-2 text-slate-300" />
                                                        <p className="text-sm font-semibold">No has añadido asignaturas todavía.</p>
                                                        <p className="text-xs text-slate-400 mb-4">Añade materias para subir sus temarios correspondientes.</p>
                                                        <button 
                                                            onClick={() => setShowModal(true)} 
                                                            className="px-4 py-2 bg-brand-600 text-white rounded-xl text-xs font-bold shadow hover:bg-brand-700 transition">
                                                            Añadir Primera Asignatura
                                                        </button>
                                                    </div>
                                                ) : (
                                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                                        {subjects.map((sub) => (
                                                            <div key={sub.id} className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between hover:border-brand-300 transition space-y-4">
                                                                <div>
                                                                    <div className="flex items-start justify-between mb-2">
                                                                        <div className="flex items-center space-x-2">
                                                                            <div className="p-2 bg-brand-50 text-brand-600 rounded-lg">
                                                                                <Icon name="book-open" className="w-5 h-5" />
                                                                            </div>
                                                                            <span className="font-extrabold text-slate-900 text-xl tracking-tight">{sub.name}</span>
                                                                        </div>
                                                                        <button 
                                                                            onClick={() => handleDeleteSubject(sub.id)}
                                                                            className="text-slate-300 hover:text-red-500 transition p-1"
                                                                            title="Eliminar materia">
                                                                            <Icon name="trash-2" className="w-4 h-4" />
                                                                        </button>
                                                                    </div>

                                                                    <div className="bg-slate-50 p-3 rounded-xl border border-slate-100 text-xs space-y-1.5 mt-3">
                                                                        <div className="flex items-center justify-between text-slate-700 font-semibold">
                                                                            <span className="flex items-center">
                                                                                <Icon name="calendar" className="w-3.5 h-3.5 text-brand-500 mr-1.5" />
                                                                                Examen: {sub.examDate !== 'Sin fecha' ? sub.examDate : 'Sin fecha'}
                                                                            </span>
                                                                        </div>
                                                                        <div className="flex items-center text-brand-700 font-bold bg-brand-50 px-2.5 py-1 rounded-lg">
                                                                            <Icon name="clock" className="w-3.5 h-3.5 mr-1.5 text-brand-600" />
                                                                            <span>{getCountdownText(sub.examDate)}</span>
                                                                        </div>
                                                                    </div>
                                                                </div>

                                                                <button 
                                                                    onClick={() => setSelectedSubjectId(sub.id)}
                                                                    className="w-full py-2.5 bg-brand-50 hover:bg-brand-600 hover:text-white text-brand-700 font-bold rounded-xl text-xs transition flex items-center justify-center space-x-1">
                                                                    <span>Gestionar Temario & Exámenes</span>
                                                                    <Icon name="chevronRight" className="w-4 h-4" />
                                                                </button>
                                                            </div>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>

                                            <div className="space-y-6">
                                                <ExamCalendar subjects={subjects} />
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* 3. SIMULADOR DE EXAMEN */}
                        {user && activeTab === 'generator' && (
                            <div className="max-w-3xl mx-auto space-y-6">
                                {!currentTest ? (
                                    <div className="bg-white p-8 rounded-2xl border border-slate-100 text-center shadow-sm">
                                        <Icon name="help-circle" className="w-12 h-12 text-brand-400 mx-auto mb-3" />
                                        <h3 className="text-xl font-bold text-slate-800 mb-2">No hay ningún examen activo</h3>
                                        <p className="text-slate-500 text-sm mb-6">Selecciona una asignatura y configura las preguntas a partir de tus PDFs subidos.</p>
                                        <button 
                                            onClick={() => setActiveTab('dashboard')}
                                            className="px-5 py-2.5 bg-brand-600 text-white rounded-xl text-sm font-semibold shadow hover:bg-brand-700 transition">
                                            Ir a Mis Asignaturas
                                        </button>
                                    </div>
                                ) : (
                                    <>
                                        <div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                                            <div>
                                                <h2 className="text-xl font-bold text-slate-800">Simulador: {currentSubjectName}</h2>
                                                <p className="text-xs text-slate-500">{currentTest.length} Preguntas • Generado inteligentemente por IA</p>
                                            </div>

                                            <div className="flex items-center space-x-3 bg-slate-50 p-2 rounded-xl border border-slate-200 self-start">
                                                <span className={`text-xs font-semibold ${!isPublic ? 'text-brand-600' : 'text-slate-400'}`}>Privado</span>
                                                <button 
                                                    onClick={() => setIsPublic(!isPublic)}
                                                    className={`w-12 h-6 flex items-center rounded-full p-1 transition duration-300 ${isPublic ? 'bg-brand-600 justify-end' : 'bg-slate-300 justify-start'}`}>
                                                    <div className="bg-white w-4 h-4 rounded-full shadow-md"></div>
                                                </button>
                                                <span className={`text-xs font-semibold ${isPublic ? 'text-brand-600' : 'text-slate-400'}`}>Público</span>
                                            </div>
                                        </div>

                                        <div className="space-y-6">
                                            {currentTest.map((q, idx) => (
                                                <div key={q.id} className="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm space-y-4">
                                                    <div className="flex justify-between items-start">
                                                        <h3 className="font-bold text-slate-800 text-base">
                                                            <span className="text-brand-600 mr-2">{idx + 1}.</span> 
                                                            {q.question}
